<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f1d1a; --muted:#8a8378; --line:#ece6dc; --soft:#f3eee6;
  --accent:#ff6b4a; --accent-ink:#fff; --good:#16a34a; --bad:#dc2626;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151413; --card:#201e1c; --ink:#f3efe8; --muted:#9b958b; --line:#2e2b28; --soft:#2a2724;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding-bottom:calc(84px + var(--safe-b));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Top ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 0}
.toprow{display:flex;align-items:center;gap:8px}
.month{position:relative;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:4px}
.month small{font-size:13px;color:var(--muted);font-weight:600}
.month input{position:absolute;inset:0;opacity:0;width:100%}
.spacer{flex:1}
.pill{padding:7px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,#999) 22%,var(--card));box-shadow:0 0 0 2px var(--c,#999) inset;flex:none}
.av.sm{width:24px;height:24px;font-size:13px;box-shadow:0 0 0 1.5px var(--c,#999) inset}
.av.lg{width:56px;height:56px;font-size:30px;box-shadow:0 0 0 3px var(--c,#999) inset}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 6px;touch-action:pan-y}
.day{display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;border-radius:14px;gap:2px}
.day .dw{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day .dn{font-size:17px;font-weight:700;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--card);box-shadow:var(--shadow)}
.day.sel .dn{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;opacity:.9}
.fchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));opacity:1}
.fchip .av{width:24px;height:24px;font-size:14px}

/* ---------- Main ---------- */
main{padding:4px 16px 20px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:6px 2px 12px}
.dayhead h2{margin:0;font-size:26px;letter-spacing:-.02em}
.dayhead span{color:var(--muted);font-weight:600}
.sub{margin:22px 2px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.card{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px 18px;margin:0 0 12px;overflow:visible}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.card .when{font-size:13px;font-weight:700;color:var(--c);display:flex;gap:6px;align-items:center}
.card .ttl{font-size:18px;font-weight:700;margin:2px 0 0;padding-right:46px;letter-spacing:-.01em;word-break:break-word}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;color:var(--muted);font-size:14px;align-items:center}
.kindtag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--muted)}
.sticker{position:absolute;top:-10px;right:10px;font-size:38px;line-height:1;transform:rotate(9deg);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1.5px -1.5px #fff,-1.5px 1.5px #fff;pointer-events:none}
.card:nth-of-type(even) .sticker{transform:rotate(-8deg)}
.people{display:flex;align-items:center}
.people .av{margin-right:-6px;position:relative}
.people .av.yes::after,.people .av.no::after{position:absolute;right:-3px;bottom:-3px;font-size:10px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.people .av.yes::after{content:"✓";background:var(--good)}
.people .av.no::after{content:"✕";background:var(--bad)}
.rsvp{display:flex;gap:8px;margin-top:10px}
.rsvp button{flex:1;padding:10px;border-radius:12px;font-weight:700;background:var(--soft)}
.rsvp .y{background:var(--good);color:#fff}
.mine{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.mine.yes{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.mine.no{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.reacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.reacts span{font-size:13px;padding:2px 7px;border-radius:999px;background:var(--soft)}
.reacts span.me{box-shadow:0 0 0 1.5px var(--accent) inset}

.busy{background:repeating-linear-gradient(-45deg,var(--card),var(--card) 10px,var(--soft) 10px,var(--soft) 20px)}
.busy .ttl{color:var(--muted)}

.items{list-style:none;margin:8px 0 0;padding:0}
.items li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:16px}
.items li:first-child{border-top:0}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.items li.done .chk{background:var(--good);border-color:var(--good)}
.items li.done .itx{text-decoration:line-through;color:var(--muted)}
.itx{flex:1;word-break:break-word}
.items .x{color:var(--muted);padding:4px 6px;font-size:15px}
.addline{display:flex;gap:8px;align-items:center;margin-top:6px}
.addline input{flex:1;border:0;border-bottom:1.5px dashed var(--line);background:transparent;padding:8px 2px;outline:none}
.addline input:focus{border-bottom-color:var(--accent)}
.progress{font-size:12px;font-weight:800;color:var(--muted)}
.more{font-size:14px;color:var(--muted);padding-top:6px;font-weight:600}

.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.row .rs{font-size:22px;width:28px;text-align:center}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt small{color:var(--muted);font-weight:600}
.row .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}

.pinned{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.pinned::-webkit-scrollbar{display:none}
.pin{flex:none;display:flex;gap:6px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.pin small{color:var(--muted)}

.empty{text-align:center;padding:30px 20px 10px;color:var(--muted)}
.empty .big{font-size:56px;display:block;margin-bottom:6px;transform:rotate(-6deg)}
.try{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);font-weight:600}

/* ---------- Bottom nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-around;padding:8px 24px calc(8px + var(--safe-b));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--muted);gap:2px;width:80px}
.tab span{font-size:22px;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--ink)}
.tab.on span{filter:none;opacity:1}
.fab{width:62px;height:62px;border-radius:22px;background:var(--accent);color:#fff;font-size:34px;font-weight:300;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent);margin-top:-30px;display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:24px 24px 0 0;max-height:88dvh;overflow:auto;padding:8px 18px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0;font-size:24px;letter-spacing:-.02em;padding-right:60px;word-break:break-word}
.sheet .bigsticker{position:absolute;right:20px;top:18px;font-size:54px;transform:rotate(8deg);text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.drow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.drow .ic{width:26px;text-align:center;font-size:18px}
.drow a{color:var(--accent);text-decoration:none;font-weight:600}
.tray{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray button{font-size:26px;min-width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);transition:transform .1s}
.tray button:active{transform:scale(.85) rotate(-8deg)}
.tray button.on{box-shadow:0 0 0 2px var(--accent) inset}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:700;text-align:center}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.danger{color:var(--bad)}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 2px 8px}

/* ---------- Composer ---------- */
.composer{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.composer.on{transform:none}
.chead{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 6px}
.chead .t{font-weight:800}
.chead .cancel{color:var(--muted);font-weight:600;padding:8px 4px}
.save{padding:9px 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800}
.save:disabled{opacity:.35}
.cbody{flex:1;overflow:auto;padding:4px 16px calc(30px + var(--safe-b))}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--soft);padding:4px;border-radius:14px}
.kinds button{padding:8px 0;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.kinds button b{font-size:18px}
.kinds button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.big{width:100%;border:0;outline:0;background:transparent;font-size:24px;font-weight:700;padding:16px 2px 8px;letter-spacing:-.01em;resize:none}
.big::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.hint{font-size:13px;color:var(--muted);margin:0 2px 10px}
.hint code{background:var(--soft);padding:1px 5px;border-radius:5px;font-family:inherit;font-weight:700;color:var(--ink)}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px}
.sugg button.place{padding-left:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.p{position:relative;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px}
.p.off{color:var(--muted);font-weight:600;box-shadow:none;border:1.5px dashed var(--line);background:transparent}
.p input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.p .clr{margin-left:2px;color:var(--muted);position:relative;z-index:2;padding:0 2px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:7px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px;color:var(--muted)}
.quick button.on{background:var(--ink);color:var(--bg)}
.ta{width:100%;min-height:90px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:12px;outline:0;resize:vertical;font-size:16px}
.stk{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.stk button{font-size:24px;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;transition:transform .12s}
.stk button.on{background:var(--card);box-shadow:0 0 0 2px var(--accent) inset,var(--shadow);transform:rotate(-8deg) scale(1.08)}
.stk button.auto{background:var(--soft)}
.linkish{color:var(--accent);font-weight:700;padding:6px 2px}
.privnote{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin:6px 0 4px}

/* ---------- Onboarding / settings ---------- */
.onboard{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;padding:calc(30px + var(--safe-t)) 22px calc(30px + var(--safe-b))}
.logo{font-size:64px;text-align:center;transform:rotate(-6deg);margin-top:20px}
.onboard h1{text-align:center;margin:8px 0 4px;font-size:30px;letter-spacing:-.03em}
.onboard p.c{text-align:center;color:var(--muted);margin:0 0 26px}
.field{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:0;font-size:17px;margin-bottom:10px}
.field:focus{border-color:var(--accent)}
.code{text-align:center;letter-spacing:.3em;font-weight:800;text-transform:uppercase;font-size:24px}
.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.emojis button{font-size:26px;aspect-ratio:1;border-radius:12px;background:var(--card)}
.emojis button.on{box-shadow:0 0 0 2.5px var(--accent) inset}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.colors button{width:34px;height:34px;border-radius:50%;background:var(--c)}
.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 18px}
.who button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:700}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:22px;margin:6px 0}
.back{color:var(--muted);font-weight:600;padding:6px 0}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.codebox{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.codebox b{font-size:22px;letter-spacing:.25em}
.banner{margin:0 16px 8px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,#f59e0b 16%,var(--card));font-size:13px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;z-index:90;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes slap{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(9deg)}}
.slap{animation:slap .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}

.namefield{position:relative;display:block}
.namefield input{padding-right:40px;font-weight:700}
.namefield span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;pointer-events:none}
/* ---------- Countdowns ---------- */
.cds{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px;margin:-8px -2px 8px;scrollbar-width:none}
.cds::-webkit-scrollbar{display:none}
.cd{position:relative;flex:none;min-width:118px;max-width:170px;display:flex;flex-direction:column;align-items:flex-start;padding:12px 14px 12px;border-radius:20px;color:#fff;text-align:left;
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 30%,transparent)}
.cd b{font-size:34px;line-height:1;font-weight:900;letter-spacing:-.03em}
.cd small{font-size:12px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.cd .ct{font-size:14px;font-weight:700;margin-top:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cds-st{position:absolute;top:-10px;right:-4px;font-size:30px;transform:rotate(10deg);text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.cdb{margin-left:auto;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);white-space:nowrap}
.card .when{flex-wrap:wrap}
.card:has(.sticker) .cdb{margin-right:34px}
.cdbig{display:flex;align-items:center;gap:12px;margin:14px 0 2px;padding:14px 16px;border-radius:18px;color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.cdbig b{font-size:46px;line-height:1;font-weight:900;letter-spacing:-.03em}
.cdbig span{font-size:17px;font-weight:800;display:flex;flex-direction:column}
.cdbig small{font-size:13px;font-weight:700;opacity:.9}
.p.cdp{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.sbcd{font-size:13px;color:var(--c);font-weight:900}
/* ---------- Notifications ---------- */
.tog{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.tog > span{width:24px;text-align:center}
.tog .sw{margin-left:auto;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tog.on .sw{background:var(--good)}
.tog.on .sw::after{transform:translateX(18px)}
.nudge{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 8px 8px 14px;margin:0 0 14px;font-weight:700;font-size:15px}
.nudge .ni{font-size:20px}
.nudge .nt{flex:1}
.nudge .pill.on{background:var(--accent);color:#fff}
.nudge .nx{color:var(--muted);padding:6px 8px}
@media (min-width:1200px){ .nudge{max-width:560px} }

/* ================= Larger screens ================= */
.side,.desk{display:none}
@media (hover:hover){
  .card[data-open],.row[data-open],.pin,.sbrow{cursor:pointer;transition:box-shadow .15s,transform .15s}
  .card[data-open]:hover,.row[data-open]:hover{box-shadow:0 2px 4px rgba(40,30,10,.08),0 10px 26px rgba(40,30,10,.10);transform:translateY(-1px)}
}

/* Tablet: center the phone layout */
@media (min-width:600px) and (max-width:899px){
  .top,main{max-width:720px;margin-left:auto;margin-right:auto}
  .tabs{left:50%;right:auto;transform:translateX(-50%);width:min(520px,100%);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}
  .sheet{max-width:620px;margin:0 auto}
  .chead,.cbody{width:100%;max-width:660px;margin:0 auto}
  .lists-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;align-items:start}
}

/* Desktop: sidebar + week view */
@media (min-width:900px){
  body{padding:0 0 0 300px}
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:300px;overflow:auto;padding:22px 18px 28px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 55%,var(--bg));z-index:25}
  .desk{display:inline-flex}
  .tabs,#meBtn,.top .week,.top .filters,.grab{display:none!important}
  .banner{margin:12px 28px 0}
  .top{padding:20px 28px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .toprow{gap:12px}
  .month{font-size:26px}
  .navs{gap:4px}
  .nav{width:34px;height:34px;border-radius:10px;background:var(--soft);font-size:20px;font-weight:700;display:grid;place-items:center}
  .nav:hover,.pill:hover{background:var(--line)}
  .range{color:var(--muted);font-weight:700}
  main{padding:4px 28px 48px}
  .toast{bottom:32px;left:calc(50% + 150px)}

  /* sidebar */
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .brand img{width:36px;height:36px;border-radius:10px}
  .brand b{flex:1;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .newbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);margin-bottom:8px}
  .newbtn:hover{filter:brightness(1.05)}
  .newbtn kbd{font:inherit;font-size:12px;opacity:.75;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:0 5px}
  .snav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;font-weight:700;color:var(--muted)}
  .snav span{font-size:18px}
  .snav small{margin-left:auto;font-weight:700}
  .snav:hover{background:var(--soft)}
  .snav.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .shd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 6px 6px;display:flex;align-items:center}
  .shd .spacer{flex:1}
  .shd button{width:26px;height:26px;border-radius:8px;font-size:16px;color:var(--ink)}
  .shd button:hover{background:var(--soft)}
  .mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .mini .wd{font-size:11px;font-weight:800;color:var(--muted);padding:2px 0 4px}
  .mini button{position:relative;aspect-ratio:1;border-radius:50%;font-size:13px;font-weight:600;display:grid;place-items:center}
  .mini button:hover{background:var(--soft)}
  .mini button.out{color:color-mix(in srgb,var(--muted) 60%,transparent)}
  .mini button.inwk{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:8px}
  .mini button.today{color:var(--accent);font-weight:800}
  .mini button.sel{background:var(--accent);color:#fff;border-radius:50%}
  .mini button i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent);opacity:.7}
  .mini button.sel i{background:#fff}
  .sbrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;font-weight:600;width:100%;text-align:left}
  .sbrow:hover{background:var(--soft)}
  .sbrow.on{background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:0 0 0 1.5px var(--c) inset}
  .sbrow .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbrow small{color:var(--muted);font-weight:700}
  .sbrow .ls{font-size:18px;width:24px;text-align:center}
  .sfoot{margin-top:auto;padding-top:16px;font-size:12px;color:var(--muted);line-height:1.6}
  .sfoot kbd{font:inherit;font-weight:800;background:var(--soft);border-radius:5px;padding:0 5px}

  /* day view + coming up side by side (900–1199) */
  .split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:32px;align-items:start}
  .split .sub{margin-top:14px}
  .lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 16px;align-items:start}
  .top.onlists .navs,.top.onlists .range{display:none!important}

  /* detail = right-hand panel */
  .sheet{left:auto;top:0;width:440px;max-height:none;border-radius:24px 0 0 24px;padding:26px 24px 28px;transform:translateX(105%);box-shadow:-10px 0 40px rgba(0,0,0,.12)}
  .sheet.on{transform:none}
  .sheet .bigsticker{top:22px}

  /* composer = centered dialog */
  .composer{inset:auto;left:50%;top:50%;width:620px;max-height:88vh;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.25);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
  .composer.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .chead{padding:16px 20px 6px}
  .cbody{padding:4px 22px 24px}
  .stk{grid-template-columns:repeat(12,1fr)}
}

/* Wide desktop: full week columns */
@media (min-width:1200px){
  .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:stretch}
  .wkcol{display:flex;flex-direction:column;gap:10px;min-height:68vh;padding:8px 8px 10px;border-radius:18px;background:color-mix(in srgb,var(--soft) 55%,transparent)}
  .wkcol.sel{background:color-mix(in srgb,var(--accent) 7%,var(--bg));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 35%,transparent) inset}
  .wkhead{display:flex;align-items:baseline;gap:6px;padding:4px 6px 2px;border-radius:10px;text-align:left}
  .wkhead b{font-size:22px;letter-spacing:-.02em}
  .wkhead span{font-size:13px;font-weight:800;text-transform:uppercase;color:var(--muted)}
  .wkcol.today .wkhead b{color:#fff;background:var(--accent);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;font-size:18px}
  .wkcol.today .wkhead span{color:var(--accent)}
  .wkcol .card{margin:0;padding:10px 10px 10px 14px;border-radius:14px}
  .wkcol .card::before{top:9px;bottom:9px;width:4px}
  .wkcol .card .when{font-size:12px}
  .wkcol .card .ttl{font-size:15px;padding-right:22px;line-height:1.25}
  .wkcol .card .meta{font-size:12px;gap:4px 8px;margin-top:5px}
  .wkcol .sticker{font-size:26px;top:-8px;right:4px}
  .wkcol .rsvp{flex-direction:column;gap:6px}
  .wkcol .rsvp button{padding:7px;font-size:13px}
  .wkcol .items li{font-size:14px;padding:4px 0;gap:8px}
  .wkcol .chk{width:20px;height:20px;border-radius:6px;font-size:12px}

function fmtRange(s,e){ if(!s) return 'All day'; if(!e) return fmtTime(s); const a=fmtTime(s), b=fmtTime(e); return (a.slice(-2)===b.slice(-2) ? a.slice(0,-2) : a) + '–' + b; }

/* ========================= Quick-add parser =========================
   "Soccer Sat 9-10am @Ava @Sam #Field 3"  →  title, date, time, people, place
   "Groceries: milk, eggs, bread"          →  list with items                 */
const WDN = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
const END = '(?=[\\s,.!?;]|$)';
const TOK = '(noon|midnight|\\d{1,2}(?::\\d{2})?\\s?(?:am|pm|a\\.m\\.|p\\.m\\.|a|p)?)';
const RANGE_RE = new RegExp('\\s(?:(?:at|from)\\s+)?' + TOK + '\\s?(?:-|–|to|until|til)\\s?' + TOK + END, 'i');
const SINGLE_RE = new RegExp('\\s((?:at|by)\\s+)?' + TOK + END, 'ig');

function hm(tok){
  tok = tok.toLowerCase().replace(/\./g,'').replace(/\s/g,'');
  if(tok==='noon') return {h:12,m:0,mer:'p',sure:true};
  if(tok==='midnight') return {h:0,m:0,mer:'a',sure:true};
  const x = tok.match(/^(\d{1,2})(?::(\d{2}))?(am|pm|a|p)?$/); if(!x) return null;
  const h=+x[1], m=+(x[2]||0); if(h>23||m>59) return null;
  return {h, m, mer: x[3] ? x[3][0] : null, sure: !!x[3] || !!x[2]};
}
function to24(o, mer){ let h=o.h; mer = o.mer || mer; if(mer && h<=12){ if(mer==='p' && h<12) h+=12; if(mer==='a' && h===12) h=0; } return pad(h)+':'+pad(o.m); }

function parseDate(h, r){
  const today = todayStr();
  const rules = [
    [/\s(?:on\s+)?(today|tonight)/i, () => today],
    [/\s(?:on\s+)?(tomorrow|tmrw|tmw)/i, () => addDays(today,1)],
    [/\s(?:in\s+)(\d{1,2})\s+days?/i, m => addDays(today, +m[1])],
    [/\s(?:on\s+|this\s+)?(next\s+)?(sunday|sun|monday|mon|tuesday|tues|tue|wednesday|weds|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat)/i, m => {
      const wd = WDN[m[2].toLowerCase()], cur = parseYmd(today).getDay();
      let diff = (wd - cur + 7) % 7; if(m[1] && diff===0) diff = 7; return addDays(today, diff); }],
    [/\s(?:on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/, m => mkDate(m[3], +m[1]-1, +m[2])],
    [/\s(?:on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sept|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?/i, m => mkDate(null, MON[m[1].toLowerCase()], +m[2])],
  ];
  for(const [re, fn] of rules){
    const rx = new RegExp(re.source + END, re.flags);
    const m = h.match(rx);
    if(m){ const d = fn(m); if(d){ r.date = d; return h.replace(m[0], ' '); } }
  }
  return h;
}
function mkDate(y, mo, d){
  if(mo<0||mo>11||d<1||d>31) return null;
  const now = new Date(); let year = y ? (+y < 100 ? 2000 + +y : +y) : now.getFullYear();
  let dt = new Date(year, mo, d);
  if(!y && dt < new Date(now.getFullYear(), now.getMonth(), now.getDate()-30)) dt = new Date(year+1, mo, d);
  return ymd(dt);
}
function parseTime(h, r){
  const m = h.match(RANGE_RE);
  if(m){
    const a = hm(m[1]), b = hm(m[2]);
    if(a && b && (a.sure || b.sure)){
      let am = a.mer, bm = b.mer;
      if(!am && !bm && a.h < 8 && b.h <= 12){ am = bm = 'p'; }
      if(!am && bm){ am = to24(a,bm) <= to24(b,bm) ? bm : (bm==='p' ? 'a' : 'p'); }
      if(am && !bm){ bm = am; if(to24(b,bm) <= to24(a,am) && am==='a') bm = 'p'; }
      r.start = to24(a, am); r.end = to24(b, bm);
      return h.replace(m[0], ' ');
    }
  }
  for(const s of h.matchAll(SINGLE_RE)){
    const o = hm(s[2]); if(!o) continue;
    const hasAt = !!s[1];
    if(!o.sure && !hasAt) continue;
    let mer = o.mer; if(!mer && o.h>=1 && o.h<8) mer = 'p';
    r.start = to24(o, mer);
    return h.replace(s[0], ' ');
  }
  return h;
}
function splitList(raw){
  for(let i=0;i<raw.length;i++){
    if(raw[i]===':' && !(/\d/.test(raw[i-1]||'') && /\d/.test(raw[i+1]||''))) return [raw.slice(0,i), raw.slice(i+1)];
  }
  return [raw, null];
}
function parseQuick(raw, opts={}){
  const r = {date:null, start:null, end:null, people:[], place:null, title:'', items:[], listLike:false};
  let [head, tail] = splitList(raw);
  if(tail !== null){
    const its = tail.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    if(its.length >= 2 || opts.kind === 'list'){ r.items = its; r.listLike = its.length >= 2; }
    else head = raw;
  }
  let h = ' ' + head.replace(/\s+/g,' ') + ' ';
  h = h.replace(/@([A-Za-z][\w'’-]*)/g, (m, n) => {
    const low = n.toLowerCase();
    if(/^(all|everyone|everybody|family|fam)$/.test(low)){ S.members.forEach(x => r.people.includes(x.id) || r.people.push(x.id)); return ' '; }
    const mm = S.members.find(x => firstName(x.name).toLowerCase() === low) || S.members.find(x => x.name.toLowerCase().startsWith(low));
    if(mm){ if(!r.people.includes(mm.id)) r.people.push(mm.id); return ' '; }
    return m;
  });
  if(!opts.noDateTime){ h = parseDate(h, r); h = parseTime(h, r); }
  const pm = h.match(/#([^@#]+)/);
  if(pm){ r.place = pm[1].trim().replace(/[,.;]+$/,'') || null; h = h.replace(pm[0], ' '); }

  r.title = t;
  return r;
}

    },
    async deleteEvent(id){ db.events = db.events.filter(e => e.id!==id); ['items','rsvps','reactions'].forEach(k => db[k] = db[k].filter(x => x.event_id!==id)); save(); },
    async addItems(eid, texts){ const base = Date.now(); texts.forEach((t,k) => db.items.push({id:uid(), event_id:eid, family_id:db.family.id, text:t, done:false, done_by:null, position:base+k})); save(); },
    async setItem(id, patch){ const it = db.items.find(i => i.id===id); if(it) Object.assign(it, patch); save(); },
    async deleteItem(id){ db.items = db.items.filter(i => i.id!==id); save(); },
    async setRsvp(eid, status){ db.rsvps = db.rsvps.filter(r => !(r.event_id===eid && r.member_id===db.meId)); if(status) db.rsvps.push({event_id:eid, member_id:db.meId, family_id:db.family.id, status}); save(); },
    async setReaction(eid, st, on){ db.reactions = db.reactions.filter(r => !(r.event_id===eid && r.member_id===db.meId && r.sticker===st)); if(on) db.reactions.push({event_id:eid, member_id:db.meId, family_id:db.family.id, sticker:st}); save(); },
    async updateMe(p){ Object.assign(db.members.find(m => m.id===db.meId), p); save(); },
    async updateFamily(p){ Object.assign(db.family, p); save(); },
    async addMember(m){ db.members.push({id:uid(), name:m.name, emoji:m.emoji, color:m.color}); save(); },
    async switchMember(id){ db.meId = id; save(); },
    async reset(){ localStorage.removeItem(KEY); },
    notify(){},
    subscribe(){},
  };
}

async function fnError(err){ try{ const j = await err.context.json(); return j.error || err.message; }catch(e){ return err.message || 'Notification service unavailable'; } }
function SupaBackend(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db:{ schema:SCHEMA }, auth:{ persistSession:true, autoRefreshToken:true } });
  let meId = null, famId = null;
  const ok = ({data, error}) => { if(error) throw new Error(error.message); return data; };
  const rpc = async (fn, args) => ok(await sb.rpc(fn, args));
  return {
    mode:'supabase',
    async start(){
      const { data:{ session } } = await sb.auth.getSession();
      if(!session) ok(await sb.auth.signInAnonymously());
      const d = ok(await sb.from('devices').select('member_id').maybeSingle());
      meId = d?.member_id || null; return meId;
    },
    preview: code => rpc('family_preview', {p_code:code}),
    async createFamily(f){ const r = await rpc('create_family', {p_family:f.family, p_name:f.name, p_emoji:f.emoji, p_color:f.color, p_pin:f.pin}); meId = r.member_id; return r; },
    async join(f){ const r = await rpc('join_family', {p_code:f.code, p_name:f.name, p_emoji:f.emoji, p_color:f.color, p_pin:f.pin}); meId = r.member_id; return r; },
    async claim(code, mid, pin){ const r = await rpc('claim_member', {p_code:code, p_member:mid, p_pin:pin}); if(!r.ok) throw new Error(r.error); meId = r.member_id; return r; },
    async load(){
      const since = addDays(todayStr(), -60);
      const [fam, members, events, items, rsvps, reactions, privs] = await Promise.all([
        sb.from('families').select('*').maybeSingle(),
        sb.from('members').select('id,name,emoji,color,created_at').order('created_at'),
        sb.from('events').select('*').or(`starts_on.is.null,starts_on.gte.${since}`),
        sb.from('list_items').select('*'),
        sb.from('rsvps').select('*'),
        sb.from('reactions').select('*'),
        sb.from('event_private').select('*'),
      ]).then(rs => rs.map(ok));
      famId = fam?.id;
      const privates = {}; (privs||[]).forEach(p => privates[p.event_id] = p);
      return { family:fam, members, meId,
        events: events.map(e => ({...e, start_time:hhmm(e.start_time), end_time:hhmm(e.end_time), invitees:e.invitees||[]})),
        items, rsvps, reactions, privates };
    },
    async saveEvent(ev){
      const priv = ev.kind === 'private';
      const row = { kind:ev.kind, title:priv?null:ev.title, notes:priv?null:ev.notes, place:priv?null:ev.place, sticker:priv?null:ev.sticker,
        starts_on:ev.starts_on, start_time:ev.start_time, end_time:ev.end_time, invitees:ev.invitees||[], countdown:!!ev.countdown, updated_at:new Date().toISOString() };
      let id = ev.id;
      const write = r => id ? sb.from('events').update(r).eq('id', id) : sb.from('events').insert({...r, family_id:famId, owner_id:meId}).select('id').single();
      let res = await write(row);
      if(res.error && /countdown/.test(res.error.message)){   // database not updated yet: save without it
        const {countdown, ...rest} = row; res = await write(rest);
        toast('⚠️ Run the latest schema.sql in Supabase to save countdowns');
      }
      const saved = ok(res); if(!id) id = saved.id;
      if(priv) ok(await sb.from('event_private').upsert({event_id:id, owner_id:meId, title:ev.title, notes:ev.notes, place:ev.place, sticker:ev.sticker}));
      else if(ev.id) ok(await sb.from('event_private').delete().eq('event_id', id));
      return {...ev, id};
    },
    async deleteEvent(id){ ok(await sb.from('events').delete().eq('id', id)); },
    async addItems(eid, texts){ const base = Date.now()/1000; ok(await sb.from('list_items').insert(texts.map((t,k) => ({event_id:eid, family_id:famId, text:t, position:base + k/1000})))); },
    async setItem(id, patch){ ok(await sb.from('list_items').update(patch).eq('id', id)); },
    async deleteItem(id){ ok(await sb.from('list_items').delete().eq('id', id)); },
    async setRsvp(eid, status){
      if(status) ok(await sb.from('rsvps').upsert({event_id:eid, member_id:meId, family_id:famId, status, updated_at:new Date().toISOString()}));
      else ok(await sb.from('rsvps').delete().eq('event_id', eid).eq('member_id', meId));
    },
    async setReaction(eid, st, on){
      if(on) ok(await sb.from('reactions').upsert({event_id:eid, member_id:meId, family_id:famId, sticker:st}));
      else ok(await sb.from('reactions').delete().eq('event_id', eid).eq('member_id', meId).eq('sticker', st));
    },
    async updateMe(p){ ok(await sb.from('members').update(p).eq('id', meId)); },
    async updateFamily(p){ ok(await sb.from('families').update(p).eq('id', famId)); },
    async addMember(m){ await rpc('add_member', {p_name:m.name, p_emoji:m.emoji, p_color:m.color, p_pin:m.pin}); },
    async signOut(){ await sb.from('devices').delete().eq('user_id', (await sb.auth.getUser()).data.user.id); await sb.auth.signOut(); },
    notify(body){ sb.functions.invoke(PUSH_FN, {body}).then(r => { if(r.error) console.warn('notify', r.error); }).catch(()=>{}); },
    async savePush(sub, prefs){ const j = sub.toJSON(); await rpc('save_push_sub', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_prefs:prefs, p_ua:navigator.userAgent}); },
    async deletePush(endpoint){ await rpc('delete_push_sub', {p_endpoint:endpoint}); },
    async getPush(endpoint){ return ok(await sb.from('push_subs').select('prefs').eq('endpoint', endpoint).maybeSingle()); },
    async testPush(){ const r = await sb.functions.invoke(PUSH_FN, {body:{type:'test'}}); if(r.error) throw new Error(await fnError(r.error)); return r.data; },
    subscribe(onChange){
      const ch = sb.channel('famcal-live');
      ['events','event_private','list_items','rsvps','reactions','members','families'].forEach(t =>
        ch.on('postgres_changes', {event:'*', schema:SCHEMA, table:t}, onChange));
      ch.subscribe();
      document.addEventListener('visibilitychange', () => { if(!document.hidden) onChange(); });
    },
  };
}

async function refresh(){
  const d = await B.load();
  Object.assign(S, { family:d.family, members:d.members, events:d.events, items:d.items, rsvps:d.rsvps, reactions:d.reactions, privates:d.privates });
  S.me = member(d.meId);
  if(!S.me) throw new Error('not-member');
  render();
  if(S.openId) S.events.some(e => e.id===S.openId) ? openDetail(S.openId, true) : closeSheet();
}
let rT; const liveRefresh = () => { clearTimeout(rT); rT = setTimeout(() => refresh().catch(()=>{}), 250); };

/* ========================= Rendering ========================= */
const mqDesk = matchMedia('(min-width:900px)'), mqWide = matchMedia('(min-width:1200px)');
const isDesk = () => mqDesk.matches, isWide = () => mqWide.matches;
let cardMax = 6;
function render(){ renderTop(); renderMain(); renderSide(); }
const weekStart = d => addDays(d, -parseYmd(d).getDay());
function rangeLabel(){
  if(!isWide()) return '';
  const a = parseYmd(weekStart(S.sel)), b = parseYmd(addDays(weekStart(S.sel), 6));
  const f = (d, o) => d.toLocaleDateString(undefined, o);
  return a.getMonth() === b.getMonth() ? `${f(a,{month:'short'})} ${a.getDate()} – ${b.getDate()}` : `${f(a,{month:'short',day:'numeric'})} – ${f(b,{month:'short',day:'numeric'})}`;
}

function renderSide(){
  const el = $('#side');
  if(!isDesk() || !S.me){ el.innerHTML = ''; return; }
  const sel = parseYmd(S.sel), t = todayStr();
  const first = new Date(sel.getFullYear(), sel.getMonth(), 1), gs = addDays(ymd(first), -first.getDay());
  const ws = weekStart(S.sel), we = addDays(ws, 6);
  let mini = ['S','M','T','W','T','F','S'].map(d => `<span class="wd">${d}</span>`).join('');
  for(let i=0;i<42;i++){
    const d = addDays(gs, i), dt = parseYmd(d);
    if(i === 35 && dt.getMonth() !== sel.getMonth()) break;
    const cls = [dt.getMonth() !== sel.getMonth() ? 'out' : '', d === t ? 'today' : '', d === S.sel && S.tab==='cal' ? 'sel' : '',
                 isWide() && S.tab==='cal' && d >= ws && d <= we ? 'inwk' : ''].join(' ');
    mini += `<button class="${cls}" data-day="${d}">${dt.getDate()}${dayEvents(d).length ? '<i></i>' : ''}</button>`;
  }
  const lists = S.events.filter(e => e.kind==='list' && passesFilter(e) && (!e.starts_on || e.starts_on >= addDays(t,-7)))
    .sort((a,b) => (a.starts_on ? 1 : 0) - (b.starts_on ? 1 : 0) || String(a.starts_on).localeCompare(String(b.starts_on)));
  el.innerHTML = `
    <div class="brand"><img src="${APP_ICON}" alt=""><b>${esc(S.family?.name || 'Family')}</b><button data-me aria-label="Me and family">${avatar(S.me)}</button></div>
    <button class="newbtn" data-new>＋ New <kbd>N</kbd></button>
    <button class="snav ${S.tab==='cal'?'on':''}" data-tab="cal"><span>📅</span>Calendar</button>
    <button class="snav ${S.tab==='lists'?'on':''}" data-tab="lists"><span>☑️</span>Lists<small>${lists.length || ''}</small></button>
    <div class="shd">${esc(sel.toLocaleDateString(undefined,{month:'long', year:'numeric'}))}<span class="spacer"></span><button data-mnav="-1" aria-label="Previous month">‹</button><button data-mnav="1" aria-label="Next month">›</button></div>
    <div class="mini">${mini}</div>
    ${(() => { const cds = countdowns(); return cds.length ? `<div class="shd">Countdowns</div>${cds.slice(0,6).map(e => { const n = daysUntil(e.starts_on);
      return `<button class="sbrow" data-open="${e.id}"><span class="ls">${esc(e.sticker||'⏳')}</span><span class="grow">${esc(e.title)}</span><b class="sbcd" style="--c:${esc((member(e.owner_id)||{}).color||'#ff6b4a')}">${n === 0 ? '🎉' : n + 'd'}</b></button>`; }).join('')}` : ''; })()}
    ${S.members.length > 1 ? `<div class="shd">People${S.filter.size ? '<span class="spacer"></span><button data-clearfilter style="width:auto;padding:0 6px;font-size:12px;color:var(--accent)">Show all</button>' : ''}</div>
      ${S.members.map(m => `<button class="sbrow ${S.filter.has(m.id)?'on':''}" style="--c:${esc(m.color)}" data-filter="${m.id}">${avatar(m,'sm')}<span class="grow">${esc(m.name)}${m.id===S.me.id?' <small>(you)</small>':''}</span></button>`).join('')}` : ''}
    ${lists.length ? `<div class="shd">Lists</div>${lists.slice(0,8).map(e => { const it = itemsOf(e.id), left = it.filter(i=>!i.done).length;
      return `<button class="sbrow" data-open="${e.id}"><span class="ls">${esc(e.sticker||'☑️')}</span><span class="grow">${esc(e.title)}</span><small>${left ? left+' left' : '✓'}</small></button>`; }).join('')}` : ''}
    <div class="sfoot"><kbd>N</kbd> new · <kbd>←</kbd><kbd>→</kbd> move · <kbd>T</kbd> today</div>`;
}

function renderTop(){
  const sel = parseYmd(S.sel);
  $('#monthTxt').textContent = sel.toLocaleDateString(undefined, {month:'long'}) + (sel.getFullYear() !== new Date().getFullYear() ? ' ' + sel.getFullYear() : '');
  $('#jump').value = S.sel;
  $('#meBtn').innerHTML = avatar(S.me);
  $('#todayBtn').classList.toggle('hidden', isWide() ? (todayStr() >= weekStart(S.sel) && todayStr() <= addDays(weekStart(S.sel),6)) : S.sel === todayStr());
  $('#rangeTxt').textContent = rangeLabel();
  document.querySelector('.top').classList.toggle('onlists', S.tab === 'lists');
  const start = addDays(S.sel, -sel.getDay()), t = todayStr();
  let w = '';
  for(let i=0;i<7;i++){
    const d = addDays(start, i), dt = parseYmd(d);
    const cols = [...new Set(dayEvents(d).map(e => member(e.owner_id)?.color).filter(Boolean))].slice(0,3);
    w += `<button class="day ${d===S.sel?'sel':''} ${d===t?'today':''}" data-day="${d}">
      <span class="dw">${dt.toLocaleDateString(undefined,{weekday:'narrow'})}</span><span class="dn">${dt.getDate()}</span>
      <span class="dots">${cols.map(c => `<i style="--c:${c}"></i>`).join('')}</span></button>`;
  }
  $('#week').innerHTML = w;
  $('#week').classList.toggle('hidden', S.tab !== 'cal');
  $('#filters').innerHTML = S.members.length > 1 ? S.members.map(m =>
    `<button class="fchip ${S.filter.has(m.id)?'on':''}" style="--c:${esc(m.color)}" data-filter="${m.id}">${avatar(m)}${esc(firstName(m.name))}</button>`).join('') : '';
}

function renderMain(){
  if(isDesk()) return renderDesk();
  cardMax = 6;
  let h = '';
  if(S.tab === 'cal'){
    h += pushNudge();
    if(S.sel === todayStr()) h += countdownStrip();
    if(S.sel === todayStr()){
      const pins = S.events.filter(e => e.kind==='list' && !e.starts_on && passesFilter(e));
      if(pins.length) h += `<div class="pinned">${pins.map(e => { const it = itemsOf(e.id), left = it.filter(i=>!i.done).length;
        return `<button class="pin" data-open="${e.id}">${esc(e.sticker||'☑️')} ${esc(e.title)} <small>${left ? left+' left' : 'done ✓'}</small></button>`; }).join('')}</div>`;
    }
    h += `<div class="dayhead"><h2>${dayLabel(S.sel)}</h2><span>${shortDate(S.sel)}</span></div>`;
    const evs = dayEvents(S.sel);
    h += evs.length ? evs.map(e => card(e)).join('') : `<div class="empty"><span class="big">🌤️</span>Nothing planned.<br>
      <button class="try" data-try="Pizza night 6pm @everyone">Try “Pizza night 6pm @everyone” 🍕</button></div>`;
    const up = [];
    for(let i=1; i<=21 && up.length<6; i++) dayEvents(addDays(S.sel,i)).forEach(e => up.length<6 && up.push(e));
    if(up.length) h += `<div class="sub">Coming up</div>` + up.map(rowHTML).join('');
  } else {
    const lists = S.events.filter(e => e.kind==='list' && passesFilter(e) && (!e.starts_on || e.starts_on >= addDays(todayStr(),-7)))
      .sort((a,b) => (a.starts_on ? 1 : 0) - (b.starts_on ? 1 : 0) || String(a.starts_on).localeCompare(String(b.starts_on)));
    h += `<div class="dayhead"><h2>Lists</h2><span>${lists.length}</span></div>`;
    h += lists.length ? `<div class="lists-grid">${lists.map(e => card(e)).join('')}</div>` : `<div class="empty"><span class="big">🛒</span>No lists yet.<br><button class="try" data-try="Groceries: milk, eggs, bread" data-kind="list">Try “Groceries: milk, eggs, bread”</button></div>`;
  }
  $('#main').innerHTML = h;
}

function countdownStrip(){
  const cds = countdowns(); if(!cds.length) return '';
  return `<div class="cds">${cds.map(e => { const n = daysUntil(e.starts_on), o = member(e.owner_id) || {color:'#ff6b4a'};
    return `<button class="cd" style="--c:${esc(o.color)}" data-open="${e.id}">${e.sticker ? `<span class="cds-st">${esc(e.sticker)}</span>` : ''}
      ${n === 0 ? '<b>🎉</b><small>Today!</small>' : `<b>${n}</b><small>day${n>1?'s':''} to go</small>`}<span class="ct">${esc(e.title)}</span></button>`; }).join('')}</div>`;
}
function renderDesk(){
  let h = '';
  const empty = `<div class="empty"><span class="big">🌤️</span>Nothing planned.<br><button class="try" data-try="Pizza night 6pm @everyone">Try “Pizza night 6pm @everyone” 🍕</button></div>`;
  if(S.tab === 'lists'){
    cardMax = 12;
    const lists = S.events.filter(e => e.kind==='list' && passesFilter(e) && (!e.starts_on || e.starts_on >= addDays(todayStr(),-7)))
      .sort((a,b) => (a.starts_on ? 1 : 0) - (b.starts_on ? 1 : 0) || String(a.starts_on).localeCompare(String(b.starts_on)));
    h += `<div class="dayhead"><h2>Lists</h2><span>${lists.length}</span></div>`;
    h += lists.length ? `<div class="lists-grid">${lists.map(e => card(e)).join('')}</div>` : `<div class="empty"><span class="big">🛒</span>No lists yet.<br><button class="try" data-try="Groceries: milk, eggs, bread" data-kind="list">Try “Groceries: milk, eggs, bread”</button></div>`;
  } else if(isWide()){
    cardMax = 4;
    h += pushNudge();
    const ws = weekStart(S.sel), t = todayStr();
    h += '<div class="wk">';
    for(let i=0;i<7;i++){
      const d = addDays(ws, i), dt = parseYmd(d), evs = dayEvents(d);
      h += `<section class="wkcol ${d===S.sel?'sel':''} ${d===t?'today':''}">
        <button class="wkhead" data-day="${d}"><b>${dt.getDate()}</b><span>${dt.toLocaleDateString(undefined,{weekday:'short'})}</span></button>
        ${evs.map(e => card(e)).join('')}
        <button class="wkadd" data-addday="${d}">＋ Add</button></section>`;
    }
    h += '</div>';
  } else {
    cardMax = 8;
    h += pushNudge() + countdownStrip();
    const evs = dayEvents(S.sel), up = [];
    for(let i=1; i<=30 && up.length<12; i++) dayEvents(addDays(S.sel,i)).forEach(e => up.length<12 && up.push(e));
    h += `<div class="split"><div><div class="dayhead"><h2>${dayLabel(S.sel)}</h2><span>${shortDate(S.sel)}</span></div>${evs.length ? evs.map(e => card(e)).join('') : empty}</div>
      <div><div class="sub">Coming up</div>${up.length ? up.map(rowHTML).join('') : '<p style="color:var(--muted)">Nothing else on the calendar yet.</p>'}</div></div>`;
  }
  $('#main').innerHTML = h;
}

function whenText(e, withDay){
  const day = withDay && e.starts_on ? (e.starts_on===todayStr() ? 'Today' : shortDate(e.starts_on)) + ' · ' : '';
  return day + (e.starts_on ? fmtRange(e.start_time, e.end_time) : 'Anytime');
}

function card(ev){
  const v = view(ev), o = member(v.owner_id) || {color:'#999'};
  const withDay = S.tab === 'lists';
  if(hidden(v)){
    return `<div class="card busy" style="--c:${esc(o.color)}"><div class="when">${esc(whenText(v, withDay))}</div>
      <div class="ttl">🔒 ${esc(busyNames(v).text)}</div><div class="meta"><span class="people">${busyNames(v).ids.map(id => avatar(member(id),'sm')).join('')}</span><span>Private</span></div></div>`;
  }
  let h = `<div class="card" style="--c:${esc(o.color)}" data-open="${v.id}">`;
  if(v.sticker) h += `<span class="sticker">${esc(v.sticker)}</span>`;
  h += `<div class="when">${esc(whenText(v, withDay))}${v.kind==='private' ? (v.invitees?.length ? ' · 🔒 private' : ' · 🔒 only you') : ''}${hasCountdown(v) ? `<span class="cdb">⏳ ${cdShort(daysUntil(v.starts_on))}</span>` : ''}</div><div class="ttl">${esc(v.title || 'Untitled')}</div>`;
  const meta = [];
  meta.push(avatar(o,'sm'));
  if(v.place) meta.push(`<span>📍 ${esc(v.place)}</span>`);
  if(v.invitees?.length){
    meta.push(`<span class="people">${v.invitees.map(id => { const m = member(id); return m ? `<span class="av sm ${asksRsvp(v) ? (rsvpOf(v,id)||'') : ''}" style="--c:${esc(m.color)}">${esc(m.emoji)}</span>` : ''; }).join('')}</span>`);
  }
  const mine = asksRsvp(v) && v.invitees?.includes(S.me.id) ? myRsvp(v) : null;
  if(mine) meta.push(`<span class="mine ${mine}">${mine==='yes' ? "You're in" : "Can't make it"}</span>`);
  if(v.kind === 'list'){ const it = itemsOf(v.id); meta.push(`<span class="progress">${it.filter(i=>i.done).length}/${it.length}</span>`); }
  h += `<div class="meta">${meta.join('')}</div>`;
  if(asksRsvp(v) && v.invitees?.includes(S.me.id) && !mine && v.owner_id !== S.me.id){
    h += `<div class="rsvp"><button class="y" data-rsvp="yes" data-id="${v.id}">👍 I'm in</button><button data-rsvp="no" data-id="${v.id}">Can't</button></div>`;
  }
  if(v.kind === 'list') h += listHTML(v, cardMax);
  h += reactsHTML(v);
  return h + `</div>`;
}

function listHTML(v, max){
  const it = itemsOf(v.id), shown = max ? it.slice(0, max) : it;
  let h = `<ul class="items">${shown.map(i => `<li class="${i.done?'done':''}"><button class="chk" data-check="${i.id}" aria-label="Check">${i.done?'✓':''}</button><span class="itx">${esc(i.text)}</span>${max ? '' : `<button class="x" data-delitem="${i.id}" aria-label="Remove">✕</button>`}</li>`).join('')}</ul>`;
  if(max && it.length > max) h += `<div class="more">+${it.length - max} more</div>`;
  h += `<div class="addline" data-stop><span>＋</span><input placeholder="Add item" data-additem="${v.id}" enterkeyhint="done" autocomplete="off"></div>`;
  return h;
}

function reactsHTML(v){

/* ========================= Detail sheet ========================= */

function openDetail(id, quiet){

  let h = v.sticker ? `<span class="bigsticker">${esc(v.sticker)}</span>` : '';

  if(hasCountdown(v)){ const n = daysUntil(v.starts_on), o2 = member(v.owner_id) || {color:'#ff6b4a'};
    h += n === 0 ? `<div class="cdbig" style="--c:${esc(o2.color)}"><b>🎉</b><span>It’s today!</span></div>`

  h += reactsHTML(v);

  if(v.place) h += `<div class="drow"><span class="ic">📍</span><a href="https://maps.apple.com/?q=${encodeURIComponent(v.place)}" target="_blank" rel="noopener">${esc(v.place)}</a></div>`;
  h += `<div class="drow"><span class="ic">${avatar(o,'sm')}</span><span>Added by ${esc(mine ? 'you' : o.name)}</span></div>`;
  if(v.invitees?.length){
    h += `<div class="drow" style="flex-wrap:wrap"><span class="ic">👥</span>${v.invitees.map(mid => { const m = member(mid); if(!m) return ''; const r = asksRsvp(v) ? rsvpOf(v, mid) : null;
      return `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px">${avatar(m,'sm')}${esc(firstName(m.name))}${r==='yes'?' ✅':r==='no'?' ❌':asksRsvp(v)?' ⏳':''}</span>`; }).join('')}</div>`;
  }
  if(v.notes) h += `<div class="drow"><span class="ic">📝</span><span style="white-space:pre-wrap">${esc(v.notes)}</span></div>`;
  if(asksRsvp(v) && v.invitees?.includes(S.me.id) && !mine){
    const r = myRsvp(v);
    h += `<div class="rsvp"><button class="${r==='yes'?'y':''}" data-rsvp="yes" data-id="${id}">👍 I'm in</button><button class="${r==='no'?'y':''}" style="${r==='no'?'background:var(--bad)':''}" data-rsvp="no" data-id="${id}">Can't</button></div>`;

  h += `</div>`;

function downloadIcs(id){
  const v = view(S.events.find(e => e.id===id)); const d = v.starts_on.replace(/-/g,'');
  const dt = v.start_time
    ? `DTSTART:${d}T${v.start_time.replace(':','')}00\r\nDTEND:${d}T${(v.end_time || plusHour(v.start_time)).replace(':','')}00`
    : `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addDays(v.starts_on,1).replace(/-/g,'')}`;
  const clean = s => String(s||'').replace(/[,;\\]/g, m => '\\'+m).replace(/\n/g,'\\n');
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilyCal//EN\r\nBEGIN:VEVENT\r\nUID:${id}@familycal\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\n${dt}\r\nSUMMARY:${clean((v.sticker?v.sticker+' ':'')+v.title)}\r\n${v.place?`LOCATION:${clean(v.place)}\r\n`:''}${v.notes?`DESCRIPTION:${clean(v.notes)}\r\n`:''}END:VEVENT\r\nEND:VCALENDAR`;
  location.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
}

        sticker: ev?.sticker || null, stickerManual: !!ev, countdown: !!ev?.countdown, cdManual: !!ev, };

function closeComposer(){ if(!$('#sheet').classList.contains('on')) $('#scrim').classList.remove('on'); $('#composer').classList.remove('on'); $('#composer').setAttribute('aria-hidden','true'); $('#cText').blur(); C = null; }

function draft(){
  const p = parseQuick($('#cText').value, {kind:C.kind, noDateTime:C.editing});
  let kind = C.kind;
  if(!C.kindManual) kind = p.listLike ? 'list' : p.people.length ? 'invite' : 'info';
  const extra = $('#cItems').value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
  let date = C.mDate !== undefined ? C.mDate : (p.date || ((kind==='list' && !C.editing && C.bDate===S.sel && !p.date) ? null : C.bDate));
  let start, end;
  if(C.mStart !== undefined){ start = C.mStart; end = C.mEnd ?? null; }
  else if(p.start){ start = p.start; end = C.mEnd !== undefined ? C.mEnd : p.end; }
  else { start = C.bStart; end = C.mEnd !== undefined ? C.mEnd : C.bEnd; }
  if(!date){ start = null; end = null; }
  if(end && start && end <= start) end = null;
  const title = p.title || (kind==='list' && (p.items.length || extra.length) ? 'List' : '');
  const sticker = C.stickerManual ? C.sticker : autoSticker(title + ' ' + (p.place||''));
  const countdown = !!date && (C.cdManual ? C.countdown : COUNTDOWN_RE.test(title));
  return { countdown, kind, title, date, start, end, people: p.people, place:p.place, items:[...p.items, ...extra], sticker, notes:$('#cNotes').value.trim() || null };
}

  if(d.place) p += `<span class="p">📍 ${esc(d.place)}</span>`;
  if(d.people.length) p += `<span class="p">${d.people.map(id => avatar(member(id),'sm')).join('')} ${d.people.length===S.members.length ? 'Everyone' : d.people.map(id => esc(firstName(member(id)?.name))).join(', ')}</span>`;
  $('#cPills').innerHTML = p;
  // quick dates
  const t = todayStr(); const q = [[t,'Today'],[addDays(t,1),'Tmrw']];
  for(let i=2;i<7;i++){ const dd = addDays(t,i); q.push([dd, parseYmd(dd).toLocaleDateString(undefined,{weekday:'short'})]); }
  $('#cQuick').innerHTML = (d.kind==='list' ? `<button class="${!d.date?'on':''}" data-qd="">No date</button>` : '') + q.map(([dd,l]) => `<button class="${d.date===dd?'on':''}" data-qd="${dd}">${l}</button>`).join('');
  // private + items
  $('#cPriv').classList.toggle('hidden', d.kind !== 'private');

  // stickers
  const auto = C.stickerManual ? null : d.sticker;
  const list = d.sticker && !STICKERS.includes(d.sticker) ? [d.sticker, ...STICKERS] : STICKERS;
  $('#cStk').innerHTML = list.map(s => `<button class="${s===d.sticker?'on':''} ${s===auto?'auto':''}" data-stk="${s}">${s}</button>`).join('');
  // suggestions
  renderSugg();

function renderSugg(){
  const el = $('#cText'), before = el.value.slice(0, el.selectionStart);
  const m = before.match(/([@#])([^\s@#]*)$/), box = $('#cSugg');
  if(!m){ box.innerHTML = ''; return; }

  if(m[1] === '@'){

    box.innerHTML = ms.map(x => `<button data-ins="@${esc(firstName(x.name))}">${avatar(x,'sm')}${esc(x.name)}</button>`).join('') +
      ('everyone'.startsWith(q) ? `<button class="place" data-ins="@everyone">👨‍👩‍👧‍👦 Everyone</button>` : '');
  } else {
    const places = [...new Set(S.events.map(e => view(e).place).filter(Boolean))].filter(p => p.toLowerCase().includes(q)).slice(0, 8);
    box.innerHTML = places.map(p => `<button class="place" data-ins="#${esc(p)}">📍 ${esc(p)}</button>`).join('');
  }
}
function insertToken(tok){
  const el = $('#cText'), pos = el.selectionStart, before = el.value.slice(0, pos).replace(/[@#][^\s@#]*$/, ''), after = el.value.slice(pos);
  el.value = before + tok + ' ' + after.replace(/^\s+/, '');

}
function autoGrow(){ const t = $('#cText'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

async function saveComposer(){
  const d = draft();
  if(!(d.title || d.items.length)){ $('#cText').classList.add('shake'); setTimeout(() => $('#cText').classList.remove('shake'), 500); return; }
  const btn = $('#cSave'); btn.disabled = true;
  const ev = { id:C.id || undefined, countdown:d.countdown, kind:d.kind, title:d.title || 'Untitled', notes:d.notes, place:d.place || null, starts_on:d.date,
    start_time:d.start, end_time:d.end, sticker:d.sticker || null, invitees:d.people };
  try{
    const saved = await B.saveEvent(ev);
    if(d.kind === 'list' && d.items.length) await B.addItems(saved.id, d.items);
    const wasEdit = C.editing; closeComposer();
    if(d.kind !== 'private' || d.people.length) B.notify(!wasEdit ? {type:'event', action:'created', event_id:saved.id, count:d.items.length}
      : (d.kind === 'list' && d.items.length) ? {type:'items', event_id:saved.id, texts:d.items} : {type:'event', action:'updated', event_id:saved.id});
    if(d.date){ S.sel = d.date; S.tab = 'cal'; setTab('cal'); }
    else if(d.kind === 'list'){ setTab('lists'); }

    toast(`${d.sticker || '✨'} ${wasEdit ? 'Saved' : 'Added'}${d.date ? ' to ' + dayLabel(d.date) : ''}`);
    const el = document.querySelector(`[data-open="${saved.id}"] .sticker`); if(el){ el.classList.add('slap'); }
    if(wasEdit) closeSheet();
  }catch(e){ btn.disabled = false; toast('⚠️ ' + e.message); }
}

async function act(fn, optimistic){

function toggleItem(id){
  const it = S.items.find(i => i.id === id); if(!it) return;
  const done = !it.done;
  act(() => B.setItem(id, {done, done_by: done ? S.me.id : null}), () => { it.done = done; });

function addItemsFromInput(input){
  const texts = input.value.split(',').map(s => s.trim()).filter(Boolean); if(!texts.length) return;
  const eid = input.dataset.additem; input.value = '';
  const tmp = texts.map((t,k) => ({id:'tmp'+Math.random(), event_id:eid, text:t, done:false, position:1e12 + k}));
  act(() => B.addItems(eid, texts).then(() => { B.notify({type:'items', event_id:eid, texts}); }), () => { S.items.push(...tmp); });
  setTimeout(() => { const n = document.querySelector(`[data-additem="${eid}"]`); n && n.focus(); }, 30);
}
function setRsvp(id, status){
  const cur = myRsvp({id}); const next = cur === status ? null : status;
  act(() => B.setRsvp(id, next).then(() => { if(next) B.notify({type:'rsvp', event_id:id, status:next}); }), () => { S.rsvps = S.rsvps.filter(r => !(r.event_id===id && r.member_id===S.me.id)); if(next) S.rsvps.push({event_id:id, member_id:S.me.id, status:next}); });
  if(next === 'yes') toast('👍 You’re in!');
}
function react(id, st){
  const on = !S.reactions.some(r => r.event_id===id && r.member_id===S.me.id && r.sticker===st);
  act(() => B.setReaction(id, st, on).then(() => { if(on) B.notify({type:'react', event_id:id, sticker:st}); }), () => { S.reactions = S.reactions.filter(r => !(r.event_id===id && r.member_id===S.me.id && r.sticker===st)); if(on) S.reactions.push({event_id:id, member_id:S.me.id, sticker:st}); });

}
async function deleteEvent(id){
