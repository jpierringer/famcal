<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f1d1a; --muted:#8a8378; --line:#ece6dc; --soft:#f3eee6;
  --accent:#ff6b4a; --accent-ink:#fff; --good:#16a34a; --bad:#dc2626;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151413; --card:#201e1c; --ink:#f3efe8; --muted:#9b958b; --line:#2e2b28; --soft:#2a2724;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font-family:inherit}
body{min-height:100dvh;padding-bottom:calc(84px + var(--safe-b));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Top ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 0}
.toprow{display:flex;align-items:center;gap:8px}
.month{position:relative;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:4px}
.month small{font-size:13px;color:var(--muted);font-weight:600}
.month input{position:absolute;inset:0;opacity:0;width:100%}
.spacer{flex:1}
.pill{padding:7px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,#999) 22%,var(--card));box-shadow:0 0 0 2px var(--c,#999) inset;flex:none}
.av.sm{width:24px;height:24px;font-size:13px;box-shadow:0 0 0 1.5px var(--c,#999) inset}
.av.lg{width:56px;height:56px;font-size:30px;box-shadow:0 0 0 3px var(--c,#999) inset}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 6px;touch-action:pan-y}
.day{display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;border-radius:14px;gap:2px}
.day .dw{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day .dn{font-size:17px;font-weight:700;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--card);box-shadow:var(--shadow)}
.day.sel .dn{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;opacity:.9}
.fchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));opacity:1}
.fchip .av{width:24px;height:24px;font-size:14px}

/* ---------- Main ---------- */
main{padding:4px 16px 20px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:6px 2px 12px}
.dayhead h2{margin:0;font-size:26px;letter-spacing:-.02em}
.dayhead span{color:var(--muted);font-weight:600}
.sub{margin:22px 2px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.card{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px 18px;margin:0 0 12px;overflow:visible}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.card .when{font-size:13px;font-weight:700;color:var(--c);display:flex;gap:6px;align-items:center}
.card .ttl{font-size:18px;font-weight:700;margin:2px 0 0;padding-right:46px;letter-spacing:-.01em;word-break:break-word}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;color:var(--muted);font-size:14px;align-items:center}
.gear{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:18px;display:grid;place-items:center;flex:none}
.gear:active{transform:scale(.94)}
.sheeth{margin:0 0 4px;font-size:22px}
.admincard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.admincard > div{flex:1}
.adminbar{display:flex;align-items:center;gap:10px}
.adminbar .hint{display:flex;align-items:center;gap:6px}
.adminrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-weight:600}
.adminrow > span{flex:1}
.adminrow input{width:22px;height:22px;accent-color:var(--accent)}
.mrow .pill.on{background:color-mix(in srgb,#f59e0b 22%,var(--soft))}
.pill.danger{color:#dc2626}
.kindtag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--muted)}
.sticker{position:absolute;top:-10px;right:10px;font-size:38px;line-height:1;transform:rotate(9deg);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1.5px -1.5px #fff,-1.5px 1.5px #fff;pointer-events:none}
.card:nth-of-type(even) .sticker{transform:rotate(-8deg)}
.people{display:flex;align-items:center}
.people .av{margin-right:-6px;position:relative}
.people .av.yes::after,.people .av.no::after{position:absolute;right:-3px;bottom:-3px;font-size:10px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.people .av.yes::after{content:"✓";background:var(--good)}
.people .av.no::after{content:"✕";background:var(--bad)}
.rsvp{display:flex;gap:8px;margin-top:10px}
.rsvp button{flex:1;padding:10px;border-radius:12px;font-weight:700;background:var(--soft)}
.rsvp .y{background:var(--good);color:#fff}
.mine{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.mine.yes{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.mine.no{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.reacts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.rc{display:inline-flex;align-items:center;gap:4px;font-size:16px;line-height:1;padding:4px 9px 4px 7px;border-radius:999px;background:var(--soft);transition:transform .15s}
.rc i{font-style:normal;font-size:12px;display:inline-flex;letter-spacing:-2px}
.rc.me{background:color-mix(in srgb,var(--accent) 12%,var(--card));box-shadow:0 0 0 1.5px var(--accent) inset}
.rc:active,.rtray button:active{transform:scale(.85)}
.rc.pop{animation:reactpop .55s cubic-bezier(.2,.9,.3,1.5)}
@keyframes reactpop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:none}}

/* ---------- Notifications ---------- */
.tog{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.tog > span{width:24px;text-align:center}
.tog .sw{margin-left:auto;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tog.on .sw{background:var(--good)}
.tog.on .sw::after{transform:translateX(18px)}
.nudge{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 8px 8px 14px;margin:0 0 14px;font-weight:700;font-size:15px}
.nudge .ni{font-size:20px}
.nudge .nt{flex:1}
.nudge .pill.on{background:var(--accent);color:#fff}
.nudge .nx{color:var(--muted);padding:6px 8px}
@media (min-width:1200px){ .nudge{max-width:560px} }

/* ================= Larger screens ================= */

  .wv-ev{position:absolute;display:flex;flex-direction:column;align-items:flex-start;text-align:left;overflow:visible;padding:5px 8px;border-radius:12px;
    background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--card)),color-mix(in srgb,var(--c) 13%,var(--card)));
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent),0 2px 6px color-mix(in srgb,var(--c) 18%,transparent);cursor:pointer;z-index:1}
  .wv-ev .in{display:flex;flex-direction:column;min-width:0;max-width:100%;max-height:100%;overflow:hidden;padding-right:16px}
  .wv-ev .st{position:absolute;right:-7px;top:-10px;font-size:27px;line-height:1;z-index:2;transform:rotate(10deg);transition:transform .2s cubic-bezier(.3,1.6,.5,1);pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1.5px -1.5px #fff,-1.5px 1.5px #fff}

  .wv-ev.busy{background:repeating-linear-gradient(-45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px);box-shadow:inset 3px 0 0 var(--c);cursor:default}

  /* month */

/* ---------- Screensaver / wall display ---------- */
.ss{--bg:#151413;--card:#201e1c;--ink:#f3efe8;--muted:#9b958b;--line:#2e2b28;--soft:#2a2724;--pw:min(100vw,clamp(340px,28vw,440px));
  position:fixed;inset:0;z-index:300;background:#0c0b0a;color:var(--ink);overflow:hidden;cursor:none;user-select:none;-webkit-user-select:none;
  opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.ss.on{opacity:1;visibility:visible;transition:opacity .35s ease}
.ssp{position:absolute;top:0;bottom:0;left:0;width:var(--pw);z-index:2;background:var(--bg);box-shadow:0 0 44px rgba(0,0,0,.55);
  padding:calc(18px + var(--safe-t)) 16px 0;transform:translateX(calc((100vw - var(--pw)) / 2));transition:transform 1.05s cubic-bezier(.22,.8,.2,1),opacity 1s}
.ss.go .ssp{transform:none}
#ssPanelIn{height:100%;overflow:hidden;-webkit-mask-image:linear-gradient(#000 calc(100% - 64px),transparent);mask-image:linear-gradient(#000 calc(100% - 64px),transparent)}
.sss{position:absolute;top:0;bottom:0;left:var(--pw);right:0;background:#000;opacity:0;transition:opacity 1.1s ease .45s,filter 2s}
.ss.go .sss{opacity:1}
.ss.night .sss{filter:brightness(.3)}
.ss.night .ssp{opacity:.55}
.ssl{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.ssl.in{opacity:1}
.ssl img.bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(38px) brightness(.55) saturate(1.2)}
.ssl .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ssl img.fg{animation:ssKB var(--kb,12s) ease-out forwards}
@keyframes ssKB{from{transform:scale(1)}to{transform:scale(1.06)}}
/* Scrapbook style */
.sbook{position:absolute;inset:0;overflow:hidden;perspective:2400px;background:#2a221c}
.sbpage{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;overflow:hidden;
  box-shadow:inset 0 0 140px rgba(110,80,40,.28),inset 14px 0 30px -12px rgba(60,40,20,.45)}
.sbpage.cream{background:radial-gradient(circle,rgba(130,100,60,.13) 1.2px,transparent 1.6px) 0 0/24px 24px,linear-gradient(135deg,#faf3e4,#efe3cb)}
.sbpage.kraft{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(8deg,rgba(90,60,30,.05) 0 2px,transparent 2px 7px),linear-gradient(135deg,#d6bc93,#c5a676)}
.sbpage.grid{background:linear-gradient(rgba(70,120,170,.13) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(70,120,170,.13) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(135deg,#fbf8f0,#f1ece0)}
.sbhead{position:absolute;left:3.5cqw;top:2.6cqh;color:#4b3b2c;font:700 max(30px,6.4cqmin)/1 Caveat,"Marker Felt","Bradley Hand","Segoe Print",cursive;transform:rotate(-2deg)}
.sbhead small{display:block;font-size:.55em;opacity:.7;margin-top:.25em}
.sbi{position:absolute;left:0;top:0;filter:drop-shadow(0 .5em .8em rgba(50,30,10,.32));will-change:transform}
.sbi.hero{z-index:5;filter:drop-shadow(0 .45em 1em rgba(0,0,0,.45))}
.sbi .paper{position:relative;background:linear-gradient(170deg,#fffef9,#f3efe4)}
.sbi .paper.k-corners,.sbi .paper.k-doodle{background:none}

/* ========================= Quick-add parser =========================
   "Soccer Sat 9-10am @Ava @Sam #Field 3"  →  title, date, time, people, place
   "Groceries: milk, eggs, bread"          →  list with items                 */
const WDN = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
const END = '(?=[\\s,.!?;]|$)';
const TOK = '(noon|midnight|\\d{1,2}(?::\\d{2})?\\s?(?:am|pm|a\\.m\\.|p\\.m\\.|a|p)?)';
const RANGE_RE = new RegExp('\\s(?:(?:at|from)\\s+)?' + TOK + '\\s?(?:-|–|to|until|til)\\s?' + TOK + END, 'i');
const SINGLE_RE = new RegExp('\\s((?:at|by)\\s+)?' + TOK + END, 'ig');

function hm(tok){
  tok = tok.toLowerCase().replace(/\./g,'').replace(/\s/g,'');
  if(tok==='noon') return {h:12,m:0,mer:'p',sure:true};
  if(tok==='midnight') return {h:0,m:0,mer:'a',sure:true};
  const x = tok.match(/^(\d{1,2})(?::(\d{2}))?(am|pm|a|p)?$/); if(!x) return null;
  const h=+x[1], m=+(x[2]||0); if(h>23||m>59) return null;
  return {h, m, mer: x[3] ? x[3][0] : null, sure: !!x[3] || !!x[2]};
}
function to24(o, mer){ let h=o.h; mer = o.mer || mer; if(mer && h<=12){ if(mer==='p' && h<12) h+=12; if(mer==='a' && h===12) h=0; } return pad(h)+':'+pad(o.m); }

function parseDate(h, r){
  const today = todayStr();
  const rules = [
    [/\s(?:on\s+)?(today|tonight)/i, () => today],
    [/\s(?:on\s+)?(tomorrow|tmrw|tmw)/i, () => addDays(today,1)],
    [/\s(?:in\s+)(\d{1,2})\s+days?/i, m => addDays(today, +m[1])],
    [/\s(?:on\s+|this\s+)?(next\s+)?(sunday|sun|monday|mon|tuesday|tues|tue|wednesday|weds|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat)/i, m => {
      const wd = WDN[m[2].toLowerCase()], cur = parseYmd(today).getDay();
      let diff = (wd - cur + 7) % 7; if(m[1] && diff===0) diff = 7; return addDays(today, diff); }],
    [/\s(?:on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/, m => mkDate(m[3], +m[1]-1, +m[2])],
    [/\s(?:on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sept|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?/i, m => mkDate(null, MON[m[1].toLowerCase()], +m[2])],
  ];
  // Use the LAST date phrase typed, so a title like "Sunday school Sun 9am" keeps "Sunday school"
  let best = null;
  for(const [re, fn] of rules){
    for(const m of h.matchAll(new RegExp(re.source + END, re.flags + 'g'))){
      const d = fn(m); if(!d) continue;
      const end = m.index + m[0].length;
      if(!best || end > best.end || (end === best.end && m[0].length > best.len)) best = {d, idx:m.index, len:m[0].length, end};
    }
  }
  if(!best) return h;
  r.date = best.d; r.dateText = h.slice(best.idx, best.end).trim();
  return h.slice(0, best.idx) + ' ' + h.slice(best.end);
}
function mkDate(y, mo, d){
  if(mo<0||mo>11||d<1||d>31) return null;
  const now = new Date(); let year = y ? (+y < 100 ? 2000 + +y : +y) : now.getFullYear();
  let dt = new Date(year, mo, d);
  if(!y && dt < new Date(now.getFullYear(), now.getMonth(), now.getDate()-30)) dt = new Date(year+1, mo, d);
  return ymd(dt);
}
function parseTime(h, r){
  const m = h.match(RANGE_RE);
  if(m){
    const a = hm(m[1]), b = hm(m[2]);
    if(a && b && (a.sure || b.sure)){
      let am = a.mer, bm = b.mer;
      if(!am && !bm && a.h < 8 && b.h <= 12){ am = bm = 'p'; }
      if(!am && bm){ am = to24(a,bm) <= to24(b,bm) ? bm : (bm==='p' ? 'a' : 'p'); }
      if(am && !bm){ bm = am; if(to24(b,bm) <= to24(a,am) && am==='a') bm = 'p'; }
      r.start = to24(a, am); r.end = to24(b, bm); r.timeText = m[0].trim();
      return h.replace(m[0], ' ');
    }
  }
  for(const s of h.matchAll(SINGLE_RE)){
    const o = hm(s[2]); if(!o) continue;
    const hasAt = !!s[1];
    if(!o.sure && !hasAt) continue;
    let mer = o.mer; if(!mer && o.h>=1 && o.h<8) mer = 'p';
    r.start = to24(o, mer); r.timeText = s[0].trim();
    return h.replace(s[0], ' ');
  }
  return h;
}
function splitList(raw){
  for(let i=0;i<raw.length;i++){
    if(raw[i]===':' && !(/\d/.test(raw[i-1]||'') && /\d/.test(raw[i+1]||''))) return [raw.slice(0,i), raw.slice(i+1)];
  }
  return [raw, null];
}
function parseQuick(raw, opts={}){
  const r = {date:null, start:null, end:null, people:[], place:null, title:'', items:[], listLike:false};
  let [head, tail] = splitList(raw);
  if(tail !== null){
    const its = tail.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    if(its.length >= 2 || opts.kind === 'list'){ r.items = its; r.listLike = its.length >= 2; }
    else head = raw;
  }
  let h = ' ' + head.replace(/\s+/g,' ') + ' ';
  h = h.replace(/@([A-Za-z][\w'’-]*)/g, (m, n) => {
    const low = n.toLowerCase();
    if(/^(all|everyone|everybody|family|fam)$/.test(low)){ S.members.forEach(x => r.people.includes(x.id) || r.people.push(x.id)); (r.tags = r.tags || []).push({tok:m, color:'#a855f7'}); return ' '; }
    const mm = S.members.find(x => firstName(x.name).toLowerCase() === low) || S.members.find(x => x.name.toLowerCase().startsWith(low));
    if(mm){ if(!r.people.includes(mm.id)) r.people.push(mm.id); (r.tags = r.tags || []).push({tok:m, color:mm.color}); return ' '; }
    return m;
  });
  if(!opts.noDateTime && !opts.noDate) h = parseDate(h, r);
  if(!opts.noDateTime && !opts.noTime) h = parseTime(h, r);
  const pm = h.match(/#([^@#]+)/);
  if(pm){ r.place = pm[1].trim().replace(/[,.;]+$/,'') || null; if(r.place) r.placeText = '#' + r.place; h = h.replace(pm[0], ' '); }
  let t = h.replace(/\s+/g,' ').trim();
  for(let i=0;i<3;i++) t = t.replace(/\s+(at|on|from|with|in|by|this|-|–)$/i,'').replace(/^(at|on)\s+/i,'');
  r.title = t;
  return r;
}

function LocalBackend(){
  const KEY = 'famcal-demo-v1';
  let db = null; try{ db = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!db) db = seed();
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} };
  save();
  function seed(){
    const t = todayStr(), now = new Date().toISOString();
    const M = [{id:'m1',name:'Dad',emoji:'🧔',color:'#3b82f6',is_admin:true},{id:'m2',name:'Mom',emoji:'👩',color:'#ec4899'},{id:'m3',name:'Ava',emoji:'👧',color:'#10b981'},{id:'m4',name:'Sam',emoji:'👦',color:'#f59e0b'}];

    const date = E({kind:'invite', owner_id:'m2', title:'Date night', starts_on:addDays(t,3), start_time:'19:00', sticker:'❤️', invitees:['m1'], notes:'Sitter is booked 🙌'});
    const bday = E({kind:'info', owner_id:'m2', title:"Sam's birthday", starts_on:addDays(t,5), sticker:'🎂', countdown:true});
    const trip = E({kind:'info', owner_id:'m1', title:'Disney trip', starts_on:addDays(t,47), sticker:'🏰', countdown:true, notes:'Flight leaves at 7am'});
    const items = (ev, arr) => arr.map(([text,done],k) => ({id:uid(), event_id:ev.id, family_id:'f1', text, done:!!done, done_by:done?'m2':null, position:k}));
    return {
      meId:'m1', family:{id:'f1', name:'Our Family', code:'DEMO42'}, members:M,
      events:[g, pack, soccer, date, bday, trip,
        E({kind:'info', owner_id:'m1', title:'Pizza night', starts_on:t, start_time:'18:00', sticker:'🍕'}),
        E({kind:'private', owner_id:'m2', title:'Surprise party planning', starts_on:t, start_time:'14:00', end_time:'15:00', sticker:'🎁'}),
        E({kind:'info', owner_id:'m3', title:'Piano lesson', starts_on:addDays(t,2), start_time:'16:00', sticker:'🎹', place:'Ms. Lee’s'}),
      ],
      items:[...items(g,[['Milk'],['Eggs'],['Bananas'],['Tortillas'],['Bread',1]]), ...items(pack,[['Tent'],['Sleeping bags'],['Headlamps',1],['Marshmallows']])],
      rsvps:[{event_id:soccer.id, member_id:'m3', family_id:'f1', status:'yes'}],
      reactions:[{event_id:bday.id, member_id:'m3', family_id:'f1', sticker:'🥳'},{event_id:bday.id, member_id:'m4', family_id:'f1', sticker:'🎉'}],
    };
  }
  function demoAdmin(a){
    const m = db.members.find(x => x.id === a.id);
    if(!m || !m.is_admin || m.removed_at) throw Object.assign(new Error('Only a calendar admin can do that'), {pin:true});
    if(!/^[0-9]{4,6}$/.test(a.pin || '')) throw Object.assign(new Error('Wrong PIN'), {pin:true});
  }
  if(!db.members.some(m => m.is_admin)){ db.members[0].is_admin = true; save(); }   // demo data saved before admins existed
  return {
    mode:'demo',
    async start(){ return db.meId; },
    async load(){
      return { family:db.family, members:db.members, meId:db.meId, privates:{},
        events: db.events.filter(e => !(e.is_private && e.owner_id!==db.meId && !(e.invitees||[]).includes(db.meId)))
          .map(e => e.kind==='private' && e.owner_id!==db.meId && !(e.invitees||[]).includes(db.meId) ? {...e, title:null, notes:null, place:null, sticker:null} : e),
        items:db.items.filter(i => { const e = db.events.find(x => x.id === i.event_id); return !(e && e.is_private && e.owner_id!==db.meId && !(e.invitees||[]).includes(db.meId)); }), rsvps:db.rsvps, reactions:db.reactions, custom:db.custom||[] };
    },
    async addSticker(c){ db.custom = db.custom||[]; if(!db.custom.some(x => x.emoji===c.emoji)) db.custom.push({id:uid(), ...c, created_at:new Date().toISOString()}); else Object.assign(db.custom.find(x => x.emoji===c.emoji), c); save(); },
    async deleteSticker(id){ db.custom = (db.custom||[]).filter(x => x.id!==id); save(); },
    async saveEvent(ev){
      if(ev.id){ const i = db.events.findIndex(x => x.id===ev.id); db.events[i] = {...db.events[i], ...ev}; }
      else { ev = {...ev, id:uid(), family_id:db.family.id, owner_id:db.meId, created_at:new Date().toISOString()}; db.events.push(ev); }
      save(); return ev;
    },
    async deleteEvent(id){ db.events = db.events.filter(e => e.id!==id); ['items','rsvps','reactions'].forEach(k => db[k] = db[k].filter(x => x.event_id!==id)); save(); },
    async addItems(eid, texts){ const base = Date.now(); texts.forEach((t,k) => db.items.push({id:uid(), event_id:eid, family_id:db.family.id, text:t, done:false, done_by:null, position:base+k})); save(); },
    async setItem(id, patch){ const it = db.items.find(i => i.id===id); if(it) Object.assign(it, patch); save(); },
    async deleteItem(id){ db.items = db.items.filter(i => i.id!==id); save(); },
    async setRsvp(eid, status){ db.rsvps = db.rsvps.filter(r => !(r.event_id===eid && r.member_id===db.meId)); if(status) db.rsvps.push({event_id:eid, member_id:db.meId, family_id:db.family.id, status}); save(); },
    async setReaction(eid, st, on){ db.reactions = db.reactions.filter(r => !(r.event_id===eid && r.member_id===db.meId && r.sticker===st)); if(on) db.reactions.push({event_id:eid, member_id:db.meId, family_id:db.family.id, sticker:st}); save(); },
    async updateMe(p){ Object.assign(db.members.find(m => m.id===db.meId), p); save(); },
    async updateFamily(p){ Object.assign(db.family, p); save(); },   // featured_list lives on the family too
    // demo has no PINs: any 4–6 digits unlock admin; the same safety rules as the database apply
    async adminVerify(a){ demoAdmin(a); },
    async addMember(m, a){ demoAdmin(a); db.members.push({id:uid(), name:m.name, emoji:m.emoji, color:m.color}); save(); },
    async removeMember(id, a){ demoAdmin(a); const m = db.members.find(x => x.id === id);
      if(id === db.meId) throw new Error('This device is signed in as that person. Sign in as someone else first.');
      if(m.is_admin && db.members.filter(x => x.is_admin && !x.removed_at).length <= 1) throw new Error('Make someone else an admin first');
      Object.assign(m, {removed_at:new Date().toISOString(), is_admin:false}); save(); },
    async restoreMember(id, pin, a){ demoAdmin(a); delete db.members.find(x => x.id === id).removed_at; save(); },
    async setAdmin(id, on, a){ demoAdmin(a); if(!on && !db.members.some(x => x.is_admin && !x.removed_at && x.id !== id)) throw new Error('The family needs at least one admin');
      db.members.find(x => x.id === id).is_admin = on; save(); },
    async setAllowJoin(on, a){ demoAdmin(a); db.family.allow_join = on; save(); },
    async newCode(a){ demoAdmin(a); db.family.code = Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join(''); save(); return db.family.code; },
    async switchMember(id){ db.meId = id; save(); },
    async reset(){ localStorage.removeItem(KEY); },
    notify(){},
    subscribe(){},
  };
}

/* Where shared photos are stored. Everything that touches the storage service goes through these three
   calls, so the photos could move to another provider (e.g. Cloudflare R2) without changing the rest of the app. */
const PHOTO_BUCKET = 'famcal-media';
const PHOTO_STORE = {
  async put(sb, path, blob){ const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:false, cacheControl:'31536000' }); if(error) throw new Error(error.message); },
  async links(sb, paths){                 // short-lived private links (1 hour); the bucket is never public
    if(!paths.length) return {};
    const { data, error } = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths, 3600); if(error) throw new Error(error.message);
    const out = {}; (data || []).forEach(x => { if(x.signedUrl) out[x.path] = x.signedUrl; }); return out;
  },
  async remove(sb, paths){ const { error } = await sb.storage.from(PHOTO_BUCKET).remove(paths); if(error) throw new Error(error.message); },
};
function adminOk(r){                         // admin functions answer {ok, error} so a wrong PIN still counts toward the lock
  if(r && r.ok) return r;
  const msg = (r && r.error) || 'Run the latest schema.sql in Supabase to use admin settings';
  throw Object.assign(new Error(msg), { pin: /Wrong PIN|Too many|Only a calendar admin/.test(msg) });
}
async function fnError(err){ try{ const j = await err.context.json(); return j.error || err.message; }catch(e){ return err.message || 'Notification service unavailable'; } }
function SupaBackend(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db:{ schema:SCHEMA }, auth:{ persistSession:true, autoRefreshToken:true } });
  let meId = null, famId = null;
  const ok = ({data, error}) => { if(error) throw new Error(error.message); return data; };
  const rpc = async (fn, args) => ok(await sb.rpc(fn, args));
  return {
    mode:'supabase',
    async start(){
      const { data:{ session } } = await sb.auth.getSession();
      if(!session) ok(await sb.auth.signInAnonymously());
      const d = ok(await sb.from('devices').select('member_id').maybeSingle());
      meId = d?.member_id || null; return meId;
    },
    preview: code => rpc('family_preview', {p_code:code}),
    async createFamily(f){ const r = await rpc('create_family', {p_family:f.family, p_name:f.name, p_emoji:f.emoji, p_color:f.color, p_pin:f.pin}); meId = r.member_id; return r; },
    async join(f){ const r = await rpc('join_family', {p_code:f.code, p_name:f.name, p_emoji:f.emoji, p_color:f.color, p_pin:f.pin}); meId = r.member_id; return r; },
    async claim(code, mid, pin){ const r = await rpc('claim_member', {p_code:code, p_member:mid, p_pin:pin}); if(!r.ok) throw new Error(r.error); meId = r.member_id; return r; },
    async load(){
      const since = addDays(todayStr(), -60);
      const [fam, members, events, items, rsvps, reactions, privs] = await Promise.all([
        sb.from('families').select('*').maybeSingle(),
        sb.from('members').select('*').order('created_at'),
        sb.from('events').select('*').or(`starts_on.is.null,starts_on.gte.${since}`),
        sb.from('list_items').select('*'),
        sb.from('rsvps').select('*'),
        sb.from('reactions').select('*'),
        sb.from('event_private').select('*'),
      ]).then(rs => rs.map(ok));
      famId = fam?.id;
      const cs = await sb.from('custom_stickers').select('*').order('created_at');   // optional table: app works without it
      const md = await sb.from('media').select('*').order('added_at');                 // optional table: shared photos
      const privates = {}; (privs||[]).forEach(p => privates[p.event_id] = p);
      return { family:fam, members, meId,
        events: events.map(e => ({...e, start_time:hhmm(e.start_time), end_time:hhmm(e.end_time), invitees:e.invitees||[]})),
        items, rsvps, reactions, privates, custom: cs.error ? [] : cs.data, customMissing: !!cs.error, media: md.error ? null : md.data };
    },
    async addSticker(c){ ok(await sb.from('custom_stickers').upsert({family_id:famId, created_by:meId, emoji:c.emoji, keywords:c.keywords}, {onConflict:'family_id,emoji'})); },
    async deleteSticker(id){ ok(await sb.from('custom_stickers').delete().eq('id', id)); },
    // ---- shared photos: database row + file in the private bucket (file access only via PHOTO_STORE) ----
    async addPhoto(p){
      const path = `${famId}/${p.id}.jpg`;
      await PHOTO_STORE.put(sb, path, p.blob);
      try{ ok(await sb.from('media').insert({id:p.id, family_id:famId, uploaded_by:meId, path, sha256:p.sha256, bytes:p.blob.size, width:p.width, height:p.height})); }
      catch(e){ PHOTO_STORE.remove(sb, [path]).catch(()=>{}); throw e; }        // no orphan files when the row is refused (cap, duplicate)
    },
    async removePhoto(row){ ok(await sb.from('media').delete().eq('id', row.id)); await PHOTO_STORE.remove(sb, [row.path]).catch(()=>{}); },
    photoLinks: paths => PHOTO_STORE.links(sb, paths),
    async saveEvent(ev){
      const priv = ev.kind === 'private' || !!ev.is_private;
      const row = { kind:ev.kind, title:priv?null:ev.title, notes:priv?null:ev.notes, place:priv?null:ev.place, sticker:priv?null:ev.sticker,
        starts_on:ev.starts_on, start_time:ev.start_time, end_time:ev.end_time, invitees:ev.invitees||[], countdown:!!ev.countdown, ...(ev.is_private ? {is_private:true} : (ev.id ? {is_private:false} : {})), updated_at:new Date().toISOString() };
      let id = ev.id;
      const write = r => id ? sb.from('events').update(r).eq('id', id) : sb.from('events').insert({...r, family_id:famId, owner_id:meId}).select('id').single();
      let res = await write(row);
      if(res.error && /is_private|private_has_no_details/.test(res.error.message)) throw new Error('Run the latest schema.sql in Supabase to use private lists');
      if(res.error && /countdown/.test(res.error.message)){   // database not updated yet: save without it
        const {countdown, ...rest} = row; res = await write(rest);
        toast('⚠️ Run the latest schema.sql in Supabase to save countdowns');
      }
      const saved = ok(res); if(!id) id = saved.id;
      if(priv) ok(await sb.from('event_private').upsert({event_id:id, owner_id:meId, title:ev.title, notes:ev.notes, place:ev.place, sticker:ev.sticker}));
      else if(ev.id) ok(await sb.from('event_private').delete().eq('event_id', id));
      return {...ev, id};
    },
    async deleteEvent(id){ ok(await sb.from('events').delete().eq('id', id)); },
    async addItems(eid, texts){ const base = Date.now()/1000; ok(await sb.from('list_items').insert(texts.map((t,k) => ({event_id:eid, family_id:famId, text:t, position:base + k/1000})))); },
    async setItem(id, patch){ ok(await sb.from('list_items').update(patch).eq('id', id)); },
    async deleteItem(id){ ok(await sb.from('list_items').delete().eq('id', id)); },
    async setRsvp(eid, status){
      if(status) ok(await sb.from('rsvps').upsert({event_id:eid, member_id:meId, family_id:famId, status, updated_at:new Date().toISOString()}));
      else ok(await sb.from('rsvps').delete().eq('event_id', eid).eq('member_id', meId));
    },
    async setReaction(eid, st, on){
      if(on) ok(await sb.from('reactions').upsert({event_id:eid, member_id:meId, family_id:famId, sticker:st}));
      else ok(await sb.from('reactions').delete().eq('event_id', eid).eq('member_id', meId).eq('sticker', st));
    },
    async updateMe(p){ ok(await sb.from('members').update(p).eq('id', meId)); },
    async updateFamily(p){ ok(await sb.from('families').update(p).eq('id', famId)); },
    // ---- admin: every call carries an admin's id + PIN; the database checks it each time ----
    async adminVerify(a){ adminOk(await rpc('admin_verify', {p_admin:a.id, p_admin_pin:a.pin})); },
    async addMember(m, a){ adminOk(await rpc('add_member', {p_name:m.name, p_emoji:m.emoji, p_color:m.color, p_pin:m.pin, p_admin:a.id, p_admin_pin:a.pin})); },
    async removeMember(id, a){ adminOk(await rpc('remove_member', {p_admin:a.id, p_admin_pin:a.pin, p_member:id})); },
    async restoreMember(id, pin, a){ adminOk(await rpc('restore_member', {p_admin:a.id, p_admin_pin:a.pin, p_member:id, p_pin:pin})); },
    async setAdmin(id, on, a){ adminOk(await rpc('set_admin', {p_admin:a.id, p_admin_pin:a.pin, p_member:id, p_on:on})); },
    async setAllowJoin(on, a){ adminOk(await rpc('set_allow_join', {p_admin:a.id, p_admin_pin:a.pin, p_on:on})); },
    async newCode(a){ return adminOk(await rpc('new_family_code', {p_admin:a.id, p_admin_pin:a.pin})).code; },
    async signOut(){ await sb.from('devices').delete().eq('user_id', (await sb.auth.getUser()).data.user.id); await sb.auth.signOut(); },
    notify(body){ sb.functions.invoke(PUSH_FN, {body}).then(r => { if(r.error) console.warn('notify', r.error); }).catch(()=>{}); },
    async savePush(sub, prefs){ const j = sub.toJSON(); await rpc('save_push_sub', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_prefs:prefs, p_ua:navigator.userAgent}); },
    async deletePush(endpoint){ await rpc('delete_push_sub', {p_endpoint:endpoint}); },
    async getPush(endpoint){ return ok(await sb.from('push_subs').select('prefs').eq('endpoint', endpoint).maybeSingle()); },
    async testPush(){ const r = await sb.functions.invoke(PUSH_FN, {body:{type:'test'}}); if(r.error) throw new Error(await fnError(r.error)); return r.data; },
    subscribe(onChange){
      const ch = sb.channel('famcal-live');
      ['events','event_private','list_items','rsvps','reactions','members','families','custom_stickers','media'].forEach(t =>
        ch.on('postgres_changes', {event:'*', schema:SCHEMA, table:t}, onChange));
      ch.subscribe();
      document.addEventListener('visibilitychange', () => { if(!document.hidden) onChange(); });
    },
  };
}

  const d = await B.load();
  Object.assign(S, { family:d.family, allMembers:d.members, members:d.members.filter(m => !m.removed_at), events:d.events, items:d.items, rsvps:d.rsvps, reactions:d.reactions, privates:d.privates,

const mqDesk = matchMedia('(min-width:900px)'), mqWide = matchMedia('(min-width:1200px)');
const isDesk = () => mqDesk.matches, isWide = () => mqWide.matches;
let cardMax = 6;

const weekStart = d => addDays(d, -parseYmd(d).getDay());
// Desktop calendar view: 'day' | 'week' | 'month' (remembered per browser)
S.view = (() => { try{ const v = localStorage.getItem('famcal-view'); return ['day','week','month'].includes(v) ? v : 'week'; }catch(e){ return 'week'; } })();
function setView(v){ S.view = v; try{ localStorage.setItem('famcal-view', v); }catch(e){} S.gridScroll = null; if(S.tab !== 'cal') setTab('cal'); else render(); }
const deskView = () => isDesk() && S.tab === 'cal' ? S.view : null;
function rangeLabel(){
  const v = deskView(); if(!v) return '';
  const f = (d, o) => d.toLocaleDateString(undefined, o);
  if(v === 'day') return f(parseYmd(S.sel), {weekday:'long', month:'short', day:'numeric'});
  if(v === 'month') return '';
  const a = parseYmd(weekStart(S.sel)), b = parseYmd(addDays(weekStart(S.sel), 6));
  return a.getMonth() === b.getMonth() ? `${f(a,{month:'short'})} ${a.getDate()} – ${b.getDate()}` : `${f(a,{month:'short',day:'numeric'})} – ${f(b,{month:'short',day:'numeric'})}`;
}
function inRange(d){
  const v = deskView();
  if(v === 'week') return d >= weekStart(S.sel) && d <= addDays(weekStart(S.sel), 6);
  if(v === 'month') return d.slice(0,7) === S.sel.slice(0,7);
  return d === S.sel;
}

function renderSide(){
  const el = $('#side');
  if(!isDesk() || !S.me){ el.innerHTML = ''; return; }
  const sel = parseYmd(S.sel), t = todayStr();
  const first = new Date(sel.getFullYear(), sel.getMonth(), 1), gs = addDays(ymd(first), -first.getDay());
  const ws = weekStart(S.sel), we = addDays(ws, 6);
  let mini = ['S','M','T','W','T','F','S'].map(d => `<span class="wd">${d}</span>`).join('');
  for(let i=0;i<42;i++){
    const d = addDays(gs, i), dt = parseYmd(d);
    if(i === 35 && dt.getMonth() !== sel.getMonth()) break;
    const cls = [dt.getMonth() !== sel.getMonth() ? 'out' : '', d === t ? 'today' : '', d === S.sel && S.tab==='cal' ? 'sel' : '',
                 deskView()==='week' && d >= ws && d <= we ? 'inwk' : ''].join(' ');
    mini += `<button class="${cls}" data-day="${d}">${dt.getDate()}${dayEvents(d).length ? '<i></i>' : ''}</button>`;
  }
  const lists = S.events.filter(e => e.kind==='list' && passesFilter(e) && (!e.starts_on || e.starts_on >= addDays(t,-7))).map(view)
    .sort((a,b) => (a.starts_on ? 1 : 0) - (b.starts_on ? 1 : 0) || String(a.starts_on).localeCompare(String(b.starts_on)));
  el.innerHTML = `
    <div class="brand"><img src="${APP_ICON}" alt=""><b>${esc(S.family?.name || 'Family')}</b><button class="gear" data-settings aria-label="Settings" title="Settings">⚙️</button><button data-me aria-label="Me" title="You">${avatar(S.me)}</button></div>
    <button class="newbtn" data-new>＋ New <kbd>N</kbd></button>
    <button class="snav ${S.tab==='cal'?'on':''}" data-tab="cal"><span>📅</span>Calendar</button>
    <button class="snav ${S.tab==='lists'?'on':''}" data-tab="lists"><span>☑️</span>Lists<small>${lists.length || ''}</small></button>
    <div class="shd">${esc(sel.toLocaleDateString(undefined,{month:'long', year:'numeric'}))}<span class="spacer"></span><button data-mnav="-1" aria-label="Previous month">‹</button><button data-mnav="1" aria-label="Next month">›</button></div>
    <div class="mini">${mini}</div>

/* ---------- Week view: time grid ---------- */
const HOUR_PX = 52;
const tMin = t => t ? +t.slice(0,2) * 60 + +t.slice(3,5) : null;
function layoutDay(evs){
  // place overlapping timed events side by side
  const items = evs.map(e => { const s = tMin(e.start_time), en = e.end_time && tMin(e.end_time) > s ? tMin(e.end_time) : s + 60; return {e, s, en}; })
    .sort((a,b) => a.s - b.s || b.en - a.en);
  let group = [], groupEnd = -1; const out = [];
  const flush = () => { const lanes = []; group.forEach(it => { let l = lanes.findIndex(end => end <= it.s); if(l < 0){ l = lanes.length; lanes.push(0); } lanes[l] = it.en; it.lane = l; });
    group.forEach(it => { it.lanes = lanes.length; out.push(it); }); group = []; };
  items.forEach(it => { if(it.s >= groupEnd && group.length) flush(); group.push(it); groupEnd = Math.max(groupEnd, it.en); });
  if(group.length) flush();
  return out;
}
const KIND_STK = {info:'💬', invite:'📨', list:'☑️', private:'🔒'};
const stickerOf = v => v.sticker || autoSticker(`${v.title || ''} ${v.place || ''}`) || KIND_STK[v.kind] || '🗓️';
function chipHTML(ev, withTime){
  const v = view(ev), o = member(v.owner_id) || {color:'#999'};
  if(hidden(v)) return `<div class="chip busy" style="--c:${esc(o.color)}" title="${esc(busyNames(v).text)}">🔒 ${esc(busyNames(v).text)}</div>`;
  const extra = v.kind === 'list' ? (() => { const it = itemsOf(v.id); return ` <small>${it.filter(i=>i.done).length}/${it.length}</small>`; })() : '';
  return `<button class="chip" style="--c:${esc(o.color)}" data-open="${v.id}" title="${esc(v.title)}"><span class="ce">${esc(stickerOf(v))}</span><span class="cx">${withTime && v.start_time ? `<b>${esc(fmtTime(v.start_time).replace(/:00/,''))}</b> ` : ''}${esc(v.title || 'Untitled')}${extra}</span></button>`;
}
function weekGrid(){
  const ws = weekStart(S.sel), t = todayStr(), days = [...Array(7)].map((_, i) => addDays(ws, i));
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  let head = '<div class="wv-corner"></div>', all = '<div class="wv-gut wv-alllbl">all day</div>', cols = '';
  days.forEach(d => {
    const dt = parseYmd(d), evs = dayEvents(d);
    head += `<button class="wv-dh ${d===t?'today':''} ${d===S.sel?'sel':''}" data-dayview="${d}"><span>${dt.toLocaleDateString(undefined,{weekday:'short'})}</span><b>${dt.getDate()}</b></button>`;
    const untimed = evs.filter(e => !e.start_time);
    all += `<div class="wv-all ${d===t?'today':''}">${untimed.slice(0,3).map(e => chipHTML(e)).join('')}${untimed.length > 3 ? `<button class="more" data-dayview="${d}">+${untimed.length-3} more</button>` : ''}${hasCountdownOn(d)}</div>`;
    const blocks = layoutDay(evs.filter(e => e.start_time)).map(({e, s, en, lane, lanes}) => {
      const v = view(e), o = member(v.owner_id) || {color:'#999'}, hid = hidden(v);
      const top = s / 60 * HOUR_PX, ht = Math.max((en - s) / 60 * HOUR_PX - 2, 20), w = 100 / lanes;
      const short = ht < 40, narrow = lanes > 1;
      return `<${hid ? 'div' : 'button'} class="wv-ev ${hid ? 'busy' : ''} ${short ? 'short' : ''} ${narrow ? 'narrow' : ''}" title="${hid ? '' : esc(v.title || '')}" style="--c:${esc(o.color)};top:${top}px;height:${ht}px;left:calc(${lane*w}% + 2px);width:calc(${w}% - 4px)" ${hid ? '' : `data-open="${v.id}"`}>
        ${hid ? `<span class="t">🔒 ${esc(busyNames(v).text)}</span>`
              : `<span class="st">${esc(stickerOf(v))}</span><span class="in"><span class="t">${esc(v.title || 'Untitled')}</span><span class="tm">${esc(fmtRange(v.start_time, v.end_time))}${v.place && !short ? ' · ' + esc(v.place) : ''}</span></span>`}
      </${hid ? 'div' : 'button'}>`;
    }).join('');
    cols += `<div class="wv-col ${d===t?'today':''}" data-slotday="${d}">${blocks}${d===t ? `<div class="wv-now" style="top:${nowMin/60*HOUR_PX}px"></div>` : ''}</div>`;
  });
  let gut = ''; for(let hr=1; hr<24; hr++) gut += `<span style="top:${hr*HOUR_PX}px">${fmtTime(pad(hr)+':00')}</span>`;
  return `<div class="wv cal-fit"><div class="wv-head">${head}</div><div class="wv-allrow">${all}</div>
    <div class="wv-body" id="wvBody"><div class="wv-grid" style="height:${24*HOUR_PX}px"><div class="wv-gut">${gut}</div>${cols}</div></div></div>`;
}

function restoreGridScroll(){
  const b = $('#wvBody'); if(!b) return;

    const first = mins.length ? Math.min(...mins) : 8 * 60;

// Today's events that have already ended (or, with no end time, started over an hour ago). All-day ones never count.
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function isOver(e, hm = nowHM()){
  if(e.starts_on !== todayStr() || !e.start_time || e.kind === 'list') return false;
  const st = hhmm(e.start_time), [h, m] = st.split(':').map(Number), en = hhmm(e.end_time);
  return (en && en > st ? en : pad(Math.min(23, h + 1)) + ':' + pad(m)) <= hm;
}
let showPast = false;                                   // the "earlier today" group stays folded unless opened
function dayList(d, empty){                             // the day's cards, with finished ones folded into one line on top
  const evs = dayEvents(d), done = d === todayStr() ? evs.filter(e => isOver(e)) : [], rest = evs.filter(e => !done.includes(e));
  let h = '';
  if(done.length){
    h += `<button class="pastfold ${showPast ? 'on' : ''}" data-pastfold aria-expanded="${showPast}"><span>✓ ${done.length} earlier today</span><i>${showPast ? 'Hide' : 'Show'}</i></button>`;
    if(showPast) h += `<div class="pastlist">${done.map(pastRow).join('')}</div>`;
  }
  h += rest.length ? rest.map(e => card(e)).join('')
    : done.length ? `<div class="empty" style="padding:22px 10px"><span class="big">🌙</span>That’s everything for today.</div>` : empty;
  return h;
}
function pastRow(ev){

let pastSig = '';                                       // re-draw today's view only when something has just finished
setInterval(() => {

// ---------- 1. highlight the words the app understood ----------
function looseMatch(text, start, needle){
  // compare ignoring case and extra spaces; returns end index or -1
  let i = start, j = 0; const T = text.toLowerCase(), N = needle.toLowerCase();
  while(j < N.length){
    if(/\s/.test(N[j])){ if(!/\s/.test(T[i] || '')) return -1; while(/\s/.test(T[i] || '')) i++; while(/\s/.test(N[j] || '')) j++; continue; }
    if(T[i] !== N[j]) return -1; i++; j++;
  }
  return i;
}
function findSpan(text, needle, last, taken){
  if(!needle) return null;
  const hits = [];
  for(let i = 0; i < text.length; i++){
    const e = looseMatch(text, i, needle);
    if(e > i && !taken.some(([a,b]) => i < b && e > a)) hits.push([i, e]);
  }
  return hits.length ? (last ? hits[hits.length-1] : hits[0]) : null;
}
function hlRanges(text, p){
  const out = [], taken = [];
  const add = (r, cls, color) => { if(r){ out.push({a:r[0], b:r[1], cls, color}); taken.push(r); } };
  (p.tags || []).forEach(t => add(findSpan(text, t.tok, false, taken), 'who', t.color));
  add(findSpan(text, p.placeText, false, taken), 'where');
  add(findSpan(text, p.timeText, false, taken), 'when');
  add(findSpan(text, p.dateText, true, taken), 'when');
  if(p.listLike){ const [head, tail] = splitList(text); add([head.length + 1 + (tail.length - tail.trimStart().length), text.replace(/\s+$/,'').length], 'items'); }
  return out.filter(r => r.b > r.a).sort((x, y) => x.a - y.a);
}
function renderHighlights(d){
  const text = $('#cText').value, ranges = hlRanges(text, d._p || {});
  C.hlSeen = C.hlSeen || new Set();
  let h = '', at = 0;
  ranges.forEach(r => {
    const word = text.slice(r.a, r.b), key = r.cls + ':' + word.toLowerCase();
    const fresh = !C.hlSeen.has(key); C.hlSeen.add(key);
    h += esc(text.slice(at, r.a)) + `<mark class="hl-${r.cls}${fresh ? ' pop' : ''}"${r.color ? ` style="--c:${esc(r.color)}"` : ''}>${esc(word)}</mark>`;
    at = r.b;
  });
  $('#cHl').innerHTML = h + esc(text.slice(at)) + '​';
}

const PUSH_DEFAULTS = {invites:true, replies:true, lists:true, family:false, reminders:true, morning:true};
const PUSH_PREFS = [['invites','📨','Invites to me'],['replies','👍','Replies & reactions to my events'],['lists','🛒','List updates'],
                    ['family','🗓️','Anything new on the calendar'],['reminders','⏰','Reminder 30 min before'],['morning','☀️','Morning summary at 7am']];
const P = { ios:false, standalone:false, supported:false, perm:'default', reg:null, sub:null, prefs:{...PUSH_DEFAULTS}, busy:false };
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4)), c => c.charCodeAt(0));

async function pushInit(){
  P.ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  P.standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  try{ P.reg = await navigator.serviceWorker.register('sw.js'); }catch(e){ return; }
  P.supported = 'PushManager' in window && 'Notification' in window;
  if(!P.supported) return;
  P.perm = Notification.permission;
  try{ P.sub = await P.reg.pushManager.getSubscription(); }catch(e){}
  if(P.sub && B.getPush){
    try{ const row = await B.getPush(P.sub.endpoint); if(row) P.prefs = {...PUSH_DEFAULTS, ...row.prefs}; }catch(e){}
    B.savePush(P.sub, P.prefs).catch(()=>{});   // keeps this phone linked to whoever is signed in
  }
  render();
}

function pushEnable(btn){
  if(P.busy) return;
  const asked = Notification.requestPermission();      // must happen right inside the tap (iOS rule)
  P.busy = true; if(btn) btn.disabled = true;
  asked.then(async perm => {
    P.perm = perm;
    if(perm !== 'granted'){ toast('🔕 Notifications not allowed'); return; }
    const reg = P.reg || await navigator.serviceWorker.ready;
    P.sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uBytes(VAPID_PUBLIC_KEY)});
    await B.savePush(P.sub, P.prefs);
    toast('🔔 Notifications on');
    B.testPush().catch(e => toast('⚠️ ' + e.message));
  }).catch(e => toast('⚠️ ' + e.message))
    .finally(() => { P.busy = false; render(); reopenSettings(); });
}
async function pushDisable(){
  const s = P.sub; P.sub = null;
  try{ await B.deletePush(s.endpoint); }catch(e){}
  try{ await s.unsubscribe(); }catch(e){}
  toast('🔕 Notifications off'); reopenSettings(); render();
}
function pushToggle(key){
  P.prefs[key] = !P.prefs[key]; reopenSettings();
  B.savePush(P.sub, P.prefs).catch(e => toast('⚠️ ' + e.message));
}
function pushSection(){
  if(B.mode === 'demo') return `<div class="privnote">Notifications work once the app is connected to Supabase.</div>`;
  if(P.ios && !P.standalone) return `<div class="privnote">📲 On iPhone, notifications only work in the Home Screen app: tap <b>Share</b> → <b>Add to Home Screen</b>, open <b>Family</b> from your Home Screen, then turn them on here.</div>`;
  if(!P.supported) return `<div class="privnote">This browser doesn't support notifications.</div>`;
  if(P.perm === 'denied') return `<div class="privnote">🔕 Notifications are blocked. ${P.ios ? 'Turn them on in iPhone <b>Settings → Notifications → Family</b>, then come back here.' : 'Allow them in this site’s settings in your browser.'}</div>`;
  if(!P.sub) return `<button class="btn primary" style="width:100%" data-pushon>🔔 Turn on notifications</button>
    <p class="hint" style="margin-top:8px">Get invites, replies, list updates and reminders on this ${P.ios ? 'phone' : 'device'}.</p>`;
  return PUSH_PREFS.map(([k,ic,txt]) => `<button class="tog ${P.prefs[k] ? 'on' : ''}" data-pref="${k}"><span>${ic}</span>${txt}<i class="sw"></i></button>`).join('') +
    `<div class="btns"><button class="btn" id="pushTest">Send a test</button><button class="btn danger" id="pushOff">Turn off</button></div>`;
}
function pushNudge(){
  if(B.mode !== 'supabase' || !P.supported || P.sub || P.perm !== 'default' || (P.ios && !P.standalone) || lsGet('famcal-nudge')) return '';
  return `<div class="nudge"><span class="ni">🔔</span><span class="nt">Get invites, replies &amp; reminders</span><button class="pill on" data-pushon>Turn on</button><button class="nx" data-nudgex aria-label="Dismiss">✕</button></div>`;

/* ========================= Admin (proof of identity) =========================
   Protected changes need an admin's PIN. It's checked by the database on EVERY change (not just here),
   so the lock can't be skipped. Unlocking doesn't change who this device is signed in as, so it works on
   the shared display too. It locks again after 3 minutes without an admin change, or when the screensaver starts. */
const ADMIN = { id:null, pin:'', until:0, pick:null };
const ADMIN_MS = 3 * 60000;
const adminOpen = () => !!ADMIN.id && Date.now() < ADMIN.until && isAdmin(member(ADMIN.id));
function adminLock(quiet){ const was = !!ADMIN.id; Object.assign(ADMIN, { id:null, pin:'', until:0 }); if(was && !quiet) toast('🔒 Admin locked'); }
function openAdminGate(err){
  if(adminOpen()) return openAdmin();
  const ad = admins();
  if(!ad.length) return toast('⚠️ Run the latest schema.sql in Supabase to use admin settings');
  if(!ad.some(m => m.id === ADMIN.pick)) ADMIN.pick = (ad.find(m => m.id === S.me.id) || ad[0]).id;
  const a = member(ADMIN.pick);
  openSheet(`<h3 class="sheeth">🔒 Admin</h3>
    <p style="color:var(--muted);margin:6px 0 8px">Adding or removing people needs an admin’s PIN.</p>
    ${ad.length > 1 ? `<div class="who">${ad.map(m => `<button class="${m.id === ADMIN.pick ? 'on' : ''}" data-adminpick="${m.id}">${avatar(m, 'lg')}${esc(firstName(m.name))}</button>`).join('')}</div>`
      : `<div style="text-align:center">${avatar(a, 'lg')}<div style="font-weight:800;margin-top:4px">${esc(a.name)}</div></div>`}
    <input class="field" id="adminPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="${B.mode === 'demo' ? 'Any 4 digits in the demo' : esc(firstName(a.name)) + '’s PIN'}" style="text-align:center;letter-spacing:.4em;font-size:24px;margin-top:12px">
    <div class="err">${esc(err || '')}</div>
    <div class="btns"><button class="btn" data-settings>Back</button><button class="btn primary" data-adminunlock>Unlock</button></div>`);
  $('#sheet').dataset.panel = 'admingate';
  setTimeout(() => { const i = $('#adminPin'); i && i.focus(); }, 80);
}
async function adminUnlock(btn){
  const pin = ($('#adminPin').value || '').trim(); if(!pin) return openAdminGate('Enter the PIN');
  btn.disabled = true;
  try{ await B.adminVerify({ id:ADMIN.pick, pin }); }catch(e){ return openAdminGate(e.message); }
  Object.assign(ADMIN, { id:ADMIN.pick, pin, until:Date.now() + ADMIN_MS }); openAdmin();
}
async function adminDo(fn, okMsg){              // run one protected change with the unlocked admin's PIN
  if(!adminOpen()){ adminLock(true); return openAdminGate('Locked after a few minutes. Enter the PIN again.'); }
  try{ const r = await fn({ id:ADMIN.id, pin:ADMIN.pin }); ADMIN.until = Date.now() + ADMIN_MS; await refresh(); if(okMsg) toast(okMsg); openAdmin(); return r; }
  catch(e){ if(e.pin){ adminLock(true); return openAdminGate(e.message); } toast('⚠️ ' + e.message); }
}
function openAdmin(){
  if(!adminOpen()) return openAdminGate();
  const a = member(ADMIN.id), gone = (S.allMembers || []).filter(m => m.removed_at), open = S.family?.allow_join !== false;
  const keep = $('#sheet').classList.contains('on') && $('#sheet').dataset.panel === 'admin' ? $('#sheet').scrollTop : 0;
  openSheet(`<div class="adminbar"><h3 class="sheeth" style="flex:1">🔓 Admin</h3><span class="hint" style="margin:0">${avatar(a, 'sm')} ${esc(firstName(a.name))}</span><button class="pill" data-adminlock>🔒 Lock</button></div>
    <div class="lbl">People with access</div>
    ${S.members.map(m => `<div class="mrow">${avatar(m)}<b style="flex:1">${esc(m.name)}${m.id === S.me.id ? ' <small class="hint">(this device)</small>' : ''}</b>
      <button class="pill ${isAdmin(m) ? 'on' : ''}" data-setadmin="${m.id}" aria-pressed="${isAdmin(m)}">${isAdmin(m) ? '⭐ Admin' : 'Make admin'}</button>
      ${m.id === S.me.id ? '' : `<button class="pill danger" data-rmmember="${m.id}">Remove</button>`}</div>`).join('')}
    <button class="btn" style="width:100%;margin-top:8px" id="addKid">＋ Add someone without a phone</button>
    ${gone.length ? `<div class="lbl">Removed</div>
    ${gone.map(m => `<div class="mrow" style="opacity:.75">${avatar(m)}<b style="flex:1">${esc(m.name)}</b><button class="pill" data-restore="${m.id}">Give access again</button></div>`).join('')}` : ''}
    <div class="lbl">Invite code</div>
    <label class="ssrow adminrow"><span>New people can join with the code</span><input type="checkbox" id="adminJoin" ${open ? 'checked' : ''}></label>
    <div class="hint" style="margin:4px 0 0">${open ? 'Anyone who has the code can add themselves to the family.' : 'Only an admin can add people. Family members can still sign in on a new phone with the code and their PIN.'}</div>
    <div class="codebox" style="margin-top:10px"><b>${esc(S.family?.code || '')}</b><button class="pill" id="adminNewCode">New code</button></div>
    <div class="hint" style="margin:6px 0 0">A new code stops the old one from working. Phones already signed in stay signed in.</div>
    <div class="btns"><button class="btn" data-settings>Back to settings</button></div>`);
  $('#sheet').dataset.panel = 'admin'; $('#sheet').scrollTop = keep;
}
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-feature]'); if(!t) return;
  setFeatured(t.dataset.feature, !isFeatured(S.events.find(x => x.id === t.dataset.feature)));
});
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-settings],[data-admin],[data-adminpick],[data-adminunlock],[data-adminlock],[data-setadmin],[data-rmmember],[data-restore],#adminNewCode'); if(!t) return;
  const d = t.dataset;
  if(d.settings !== undefined) openSettings();
  else if(d.admin !== undefined) openAdminGate();
  else if(d.adminpick){ const v = $('#adminPin')?.value || ''; ADMIN.pick = d.adminpick; openAdminGate(); $('#adminPin').value = v; }
  else if(d.adminunlock !== undefined) adminUnlock(t);

async function obAction(t){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const step = $('#onboard').dataset.step;
  if(t.dataset.obemoji){ OB.emoji = t.dataset.obemoji; return ob(step); }
  if(t.dataset.obtone){ OB.emoji = withTone(OB.emoji, setPickTone(t.dataset.obtone)); return ob(step); }
  if(t.dataset.obcolor){ OB.color = t.dataset.obcolor; return ob(step); }
  if(t.dataset.obpick){ OB.pick = t.dataset.obpick; return ob('pin'); }
  const a = t.dataset.ob; if(!a) return;
  t.disabled = true;
  try{
    if(a === 'doCreate'){ await B.createFamily({family:v('obFam'), name:v('obName'), emoji:OB.emoji, color:OB.color, pin:v('obPin')}); return finishOnboard(true); }
    if(a === 'doCode'){ OB.code = v('obCode').toUpperCase(); const f = await B.preview(OB.code); if(!f) return ob('code', 'Code not found'); OB.fam = f; return ob(f.members.length ? 'pick' : 'new'); }
    if(a === 'doClaim'){ await B.claim(OB.code, OB.pick, v('obPin')); return finishOnboard(); }
    if(a === 'doJoin'){ await B.join({code:OB.code, name:v('obName'), emoji:OB.emoji, color:OB.color, pin:v('obPin')}); return finishOnboard(); }
    ob(a);
  }catch(e){ ob(step, e.message); }
  finally{ t.disabled = false; }
}
async function finishOnboard(isNew){
  $('#onboard').classList.add('hidden');
  history.replaceState(null, '', location.pathname);
  await refresh(); B.subscribe(liveRefresh);
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if(isNew && tz) B.updateFamily({tz}).catch(()=>{});
  pushInit();
  if(isNew) setTimeout(openMe, 400);
  toast(`👋 Welcome, ${firstName(S.me.name)}!`);
}

    if(d.ins){ insertToken(d.ins); return; }
    if(d.help){ helper(d.help); return; }
    if(d.when){ applyWhen(d.when, d.wt); return; }
    if(d.stksug){ C.stickerManual = true; C.sticker = draft().sticker === d.stksug ? null : d.stksug; updateComposer(); return; }
    if(t.id === 'cLive' || t.id === 'cStkMore'){ toggleAllStickers(); return; }
    if(t.id === 'cClearTime'){ C.mStart = null; C.mEnd = null; updateComposer(); return; }
    if(t.id === 'cStkAdd'){ openStickerAdd(); return; }
    if(t.id === 'nsCancel'){ closeStickerAdd(); return; }
    if(t.id === 'nsSave'){ saveCustomSticker(); return; }

    if(t.id === 'cCountdown'){ C.countdown = !draft().countdown; C.cdManual = true; updateComposer(); return; }
    return;
  }
  if(d.viewas){ B.switchMember(d.viewas).then(() => { closeSheet(); S.filter.clear(); return refresh(); }).then(() => toast(`Now viewing as ${S.me.emoji} ${S.me.name}`)); return; }
  if(d.meemoji){ act(() => B.updateMe({emoji:d.meemoji}), () => { S.me.emoji = d.meemoji; }).then(openMe); return; }

  if(d.stop !== undefined) return;

  if(t.id === 'resetDemo'){ if(confirm('Reset demo data?')) B.reset().then(() => location.reload()); return; }
  if(t.id === 'signOut'){ if(confirm('Sign out on this phone? You can sign back in with the family code + your PIN.')) B.signOut().then(() => location.reload()); return; }

// swipe: week strip = ±1 week, day list = ±1 day
function swipe(el, fn){
  let x0, y0;
  el.addEventListener('touchstart', e => { if(e.target.closest('.pinned,.tray,.filters,input')){ x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => { if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dy) < 45) fn(dx < 0 ? 1 : -1); }, {passive:true});
}

[mqDesk, mqWide].forEach(m => m.addEventListener('change', () => { if(S.me) render(); }));

/* ========================= Screensaver / wall display =========================
   After the screen has been idle, a phone-sized "today" panel slides to the left and the rest of the
   screen plays this device's photos and videos. Any touch brings the normal app back.
   Settings + media live on THIS device only (localStorage + IndexedDB), so nothing touches Supabase storage. */
const SS = { on:false, cfg:null, media:[], order:[], idx:-1, idleT:null, tickT:null, advT:null, wake:null, since:0, swallow:0, fails:0, fs:false };
const SS_DEF = { enabled:false, idle:2, secs:10, sound:false, night:true, shared:false, homeId:null, homePin:'', display:false, style:'classic' };
function ssCfg(){
  if(!SS.cfg){ let c = {}; try{ c = JSON.parse(localStorage.getItem('famcal-ss') || '{}'); }catch(e){}
    if(c.display === undefined) c.display = !!(c.enabled || c.shared);     // screens set up before the "shared display" switch existed
    SS.cfg = { ...SS_DEF, ...c }; }
  return SS.cfg;
}
const ssOn = () => { const c = ssCfg(); return !!(c.display && c.enabled); };     // screensaver only ever runs on a shared display
function ssSave(patch){ Object.assign(ssCfg(), patch); try{ localStorage.setItem('famcal-ss', JSON.stringify(SS.cfg)); }catch(e){} ssArm(); if(patch.enabled && ssOn()){ ssPersist(); photoSync(); } }
function ssPersist(){ try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }

const SSDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('famcal-display', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('media', { keyPath:'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('media', mode), req = fn(t.objectStore('media'));
    t.oncomplete = () => res(req.result); t.onerror = t.onabort = () => rej(t.error); }); };
  return { all:() => tx('readonly', s => s.getAll()), put:r => tx('readwrite', s => s.put(r)), del:id => tx('readwrite', s => s.delete(id)), clear:() => tx('readwrite', s => s.clear()) };
})();
async function ssLoad(){ try{ SS.media = (await SSDB.all()).sort((a,b) => a.added - b.added); }catch(e){ SS.media = []; } if(SS.on) ssShuffle(); }

// Photos are shrunk to ~2000px before saving so a few hundred fit comfortably on the tablet.
/* iPhone photos (and Google Photos downloads of them) are often HEIC. Safari reads them natively;
   Chrome on Windows/Android can't, and Windows may not even label them as images. So: recognise them by
   name, try the browser first, and only if that fails load a small converter (heic2any) on first use. */
const HEIC_LIB = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
const isHeic = f => /\.(heic|heif)$/i.test(f.name || '') || /image\/hei[cf]/i.test(f.type || '');
const isImageFile = f => (f.type || '').startsWith('image/') || isHeic(f) || /\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(f.name || '');
const isVideoFile = f => (f.type || '').startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(f.name || '');
let heicLoading = null;
function loadHeic(){
  if(window.heic2any) return Promise.resolve(window.heic2any);
  return heicLoading || (heicLoading = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = HEIC_LIB; sc.async = true;
    sc.onload = () => window.heic2any ? res(window.heic2any) : rej(new Error('HEIC converter didn’t load'));
    sc.onerror = () => { heicLoading = null; rej(new Error('Couldn’t load the HEIC converter (check the internet connection)')); };
    document.head.appendChild(sc);
  }));
}
async function decodeImage(f){               // -> ImageBitmap, converting HEIC when the browser can't read it
  try{ return await createImageBitmap(f); }
  catch(e){
    if(!isHeic(f)) throw e;
    const heic2any = await loadHeic();
    const out = await heic2any({ blob:f, toType:'image/jpeg', quality:.92 });
    return createImageBitmap(Array.isArray(out) ? out[0] : out);
  }
}
async function ssShrink(f){
  let bmp; try{ bmp = await decodeImage(f); }catch(e){ if(isHeic(f)) throw e; return f; }
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  if(k === 1 && f.size < 600 * 1024){ bmp.close && bmp.close(); return f; }
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  return new Promise(r => c.toBlob(b => r(b || f), 'image/jpeg', .86));
}
async function ssAddFiles(files){
  let n = 0, bad = 0, t0 = Date.now();
  toast('Adding…');
  for(const f of files){
    try{
      if(isImageFile(f)) await SSDB.put({ id:uid(), type:'image', blob:await ssShrink(f), name:f.name, added:t0 + n++ });
      else if(isVideoFile(f) && f.size <= 200 * 1024 * 1024) await SSDB.put({ id:uid(), type:'video', blob:f, name:f.name, added:t0 + n++ });
      else bad++;
    }catch(e){ bad++; }
  }
  await ssLoad();
  toast(n ? `✓ Added ${n}${bad ? ` · ${bad} skipped (too big or unsupported)` : ''}` : '⚠️ Nothing added (videos over 200 MB are skipped)');
  reopenSettings();
}
// Google Photos / Drive / Dropbox "share" links open a web page, not a picture, so they can never show in the reel.
const ssIsPage = u => /^https?:\/\/(photos\.app\.goo\.gl|photos\.google\.com|goo\.gl\/photos|drive\.google\.com|(www\.)?dropbox\.com|1drv\.ms|onedrive\.live\.com|icloud\.com|share\.icloud\.com)\b/i.test(u);
// Google's picture servers return a small thumbnail unless a size is asked for.
function ssUrl(u){ try{ const x = new URL(u); if(/^lh\d*\.googleusercontent\.com$/.test(x.hostname) && !x.pathname.split('/').pop().includes('=')) return u.split(/[?#]/)[0] + '=w2000'; }catch(e){} return u; }
const ssProbe = (u, ms = 9000) => new Promise(res => { const i = new Image(), t = setTimeout(() => { i.src = ''; res(false); }, ms); i.referrerPolicy = 'no-referrer'; i.onload = () => { clearTimeout(t); res(true); }; i.onerror = () => { clearTimeout(t); res(false); }; i.src = ssUrl(u); });
async function ssAddLink(url){
  url = (url || '').trim(); if(!url) return;
  if(!/^https?:\/\//i.test(url)) return toast('⚠️ Paste a full link that starts with https://');
  if(ssIsPage(url)) return alert('That link opens a web page, not the picture itself, so it can’t play here.\n\nUse “＋ Photos & videos” instead. On an Android tablet the picker can choose straight from Google Photos.');
  const type = /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) ? 'video' : 'image';
  if(type === 'image'){ toast('Checking the link…'); if(!await ssProbe(url)) return alert('That link didn’t load as a picture. It has to open the photo file itself, not a web page.'); }
  await SSDB.put({ id:uid(), type, url, name:url, added:Date.now() });
  await ssLoad(); toast('✓ Link added'); reopenSettings();
}
async function ssPrune(){
  const links = SS.media.filter(m => m.url && m.type === 'image'); if(!links.length) return toast('No picture links to check');
  toast(`Checking ${links.length} links…`);
  const bad = []; let k = 0;
  const worker = async () => { while(k < links.length){ const m = links[k++]; if(!await ssProbe(m.url)) bad.push(m); } };
  await Promise.all([1,2,3,4,5,6].map(worker));
  for(const m of bad) await SSDB.del(m.id);
  await ssLoad();
  toast(bad.length ? `Removed ${bad.length} of ${links.length} links that wouldn’t load` : `✓ All ${links.length} links load`);
  reopenSettings();
}

/* ---------- Shared family photos ----------
   Any family phone or computer adds photos; every wall display in the family downloads them once into
   this device's photo store (IndexedDB) and plays them from there, so frames use almost no data and keep
   working offline. Videos stay on the device they were added on. */
const sharedPhotos = () => !!B?.addPhoto && !S.mediaMissing;
const photoCap = () => +(S.family?.photo_cap) || 300;
async function sha256Hex(blob){ const h = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
async function frameJpeg(file){              // ~1280px on the long side, under 1 MB (the bucket's limit)
  const bmp = await decodeImage(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  for(const q of [.82, .72, .6, .5]){
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if(b && b.size <= 1000 * 1024) return { blob:b, width:c.width, height:c.height };
  }
  throw new Error('photo too large');
}
function photoErr(e){
  const m = String(e?.message || e), cap = m.match(/photo_cap:(\d+)/);
  if(cap) return { stop:true, msg:`Your family has reached ${cap[1]} shared photos. Remove some to add more.` };
  if(/duplicate|sha256/i.test(m)) return { dup:true };
  return { msg:m };
}
async function photosAdd(files){
  const imgs = files.filter(isImageFile), vids = files.filter(f => !isImageFile(f));
  if(vids.length) await ssAddFiles(vids);                         // videos stay on this device
  if(!imgs.length) return;
  let added = 0, dup = 0, bad = 0, stopped = '', lastErr = '';
  const known = new Set(S.media.map(m => m.sha256)), cacheHere = ssOn();
  for(const [i, f] of imgs.entries()){
    if(S.media.length + added >= photoCap()){ stopped = `Your family has reached ${photoCap()} shared photos. Remove some to add more.`; break; }
    toast(`${isHeic(f) ? 'Converting' : 'Uploading'} ${i + 1} of ${imgs.length}…`);
    try{
      const sha = await sha256Hex(f);                               // hash of the original file: the same photo is never stored twice
      if(known.has(sha)){ dup++; continue; }
      const j = await frameJpeg(f), id = uid();
      await B.addPhoto({ id, blob:j.blob, sha256:sha, width:j.width, height:j.height });
      known.add(sha); added++;
      if(cacheHere) await SSDB.put({ id:'sh:' + id, mid:id, type:'image', blob:j.blob, name:f.name, shared:true, added:Date.now() });
    }catch(e){ const r = photoErr(e); if(r.dup){ dup++; continue; } if(r.stop){ stopped = r.msg; break; } bad++; lastErr = r.msg || ''; console.warn('photo upload', e); }
  }
  await refresh().catch(()=>{}); await ssLoad();
  const parts = [added ? `✓ Shared ${added} photo${added === 1 ? '' : 's'} with the family` : '', dup ? `${dup} already shared` : '', bad ? `${bad} couldn’t upload${/HEIC/i.test(lastErr) ? ` (${lastErr})` : ''}` : ''].filter(Boolean);
  toast(stopped ? (added ? `✓ Shared ${added}. ` : '') + stopped : parts.join(' · ') || 'Nothing new to add');
  if($('#sheet').dataset.panel === 'photos') openPhotos(); else reopenSettings();
}

const PSYNC = { busy:false, again:false, t:null };
function photoSyncSoon(){ clearTimeout(PSYNC.t); PSYNC.t = setTimeout(photoSync, 1200); }
async function photoSync(){                  // make this display's photo store match the family's shared photos
  if(!sharedPhotos() || !ssOn()) return;
  if(PSYNC.busy){ PSYNC.again = true; return; }
  PSYNC.busy = true;
  try{
    const local = await SSDB.all(), want = new Set(S.media.map(r => r.id));
    let changed = false;
    for(const m of local) if(m.mid && !want.has(m.mid)){ await SSDB.del(m.id); changed = true; }      // removed by someone in the family
    const have = new Set(local.filter(m => m.mid).map(m => m.mid));
    const missing = S.media.filter(r => !have.has(r.id));
    for(let i = 0; i < missing.length; i += 20){
      const batch = missing.slice(i, i + 20), links = await B.photoLinks(batch.map(r => r.path));
      await Promise.all(batch.map(async r => {
        const u = links[r.path]; if(!u) return;
        try{ const res = await fetch(u); if(!res.ok) return;
          await SSDB.put({ id:'sh:' + r.id, mid:r.id, type:'image', blob:await res.blob(), name:'', shared:true, added:Date.parse(r.added_at) || Date.now() }); changed = true; }catch(e){}
      }));
    }
    if(changed){ await ssLoad(); reopenSettings(); }
  }catch(e){ console.warn('photo sync', e); }
  finally{ PSYNC.busy = false; if(PSYNC.again){ PSYNC.again = false; photoSync(); } }
}
setInterval(() => { if(document.visibilityState === 'visible') photoSync(); }, 30 * 60000);   // safety net if a live update was missed

async function openPhotos(){                 // see and remove the family's shared photos
  const rows = [...S.media].reverse(), cached = new Map(SS.media.filter(m => m.mid).map(m => [m.mid, m]));
  const urls = {}; const blobs = [];
  rows.forEach(r => { const c = cached.get(r.id); if(c && c.blob){ const u = URL.createObjectURL(c.blob); urls[r.id] = u; blobs.push(u); } });
  const need = rows.filter(r => !urls[r.id]);
  if(need.length){ try{ const l = await B.photoLinks(need.map(r => r.path)); need.forEach(r => { if(l[r.path]) urls[r.id] = l[r.path]; }); }catch(e){} }
  openSheet(`<h3>Shared photos</h3><p style="color:var(--muted);margin:6px 0 12px">${S.media.length} of ${photoCap()} · every frame in the family shows these.</p>
    <input type="file" id="ssShared2" accept="image/*,.heic,.heif" multiple class="hidden">
    <div class="btns" style="margin:0 0 12px"><button class="btn primary" data-photoadd>＋ Add photos</button></div>
    ${rows.length ? `<div class="pgrid">${rows.map(r => { const m = member(r.uploaded_by);
      return `<div class="pcell">${urls[r.id] ? `<img src="${esc(urls[r.id])}" alt="" loading="lazy">` : '<span class="pmiss">🖼️</span>'}
        ${m ? `<span class="pby">${avatar(m, 'sm')}</span>` : ''}<button class="pdel" data-delphoto="${r.id}" aria-label="Remove photo">✕</button></div>`; }).join('')}</div>`
      : '<div class="empty"><span class="big">🖼️</span>No shared photos yet.</div>'}`);
  $('#sheet').dataset.panel = 'photos';
  $('#sheet').dataset.blobs = blobs.join(' ');
}
async function deletePhoto(id){
  const r = S.media.find(x => x.id === id); if(!r) return;
  if(!confirm('Remove this photo from every family frame?')) return;
  try{ await B.removePhoto(r); await SSDB.del('sh:' + id).catch(()=>{}); await refresh(); await ssLoad(); openPhotos(); toast('Photo removed'); }
  catch(e){ toast('⚠️ ' + e.message); }
}

/* ---------- The left panel ---------- */
function ssRow(e, mode, nowHM){
  const sec = isSecret(e), v = sec ? e : view(e), o = member(e.owner_id) || { color:'#999' };   // private details never go on a shared screen
  const names = sec ? busyNames(e) : null;
  const ids = sec ? names.ids : [e.owner_id, ...(e.invitees || [])].filter((x,i,a) => x && a.indexOf(x) === i);
  const title = sec ? '🔒 ' + names.text : `${stickerOf(v)} ${v.title || 'Untitled'}`;
  const st = hhmm(e.start_time);
  let past = false;
  if(mode === 'today' && st){ const [h,m] = st.split(':').map(Number); past = (hhmm(e.end_time) || pad(Math.min(23, h + 1)) + ':' + pad(m)) < nowHM; }
  const time = e.start_time ? fmtTime(e.start_time) : 'All day';
  const t = mode === 'today' ? esc(time) : `${esc(parseYmd(e.starts_on).toLocaleDateString(undefined, { weekday:'short', day:'numeric' }))}<small>${esc(time)}</small>`;
  return `<div class="ssr ${past ? 'past' : ''}" style="--c:${esc(o.color)}"><span class="t">${t}</span>
    <span class="m"><b>${esc(title)}</b>${!sec && v.place ? `<small>📍 ${esc(v.place)}</small>` : ''}</span>
    <span class="who">${ids.slice(0,3).map(id => avatar(member(id), 'sm')).join('')}</span></div>`;
}
function ssPanelRender(){
  const box = $('#ssPanelIn'); if(!box || !S.me) return;
  const now = new Date(), t = todayStr(), nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
  const tm = now.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }), mm = tm.match(/^(.*?)\s*([AP]M)$/i);
  const evs = d => S.events.filter(e => e.starts_on === d && e.kind !== 'list').sort(sortEv);
  const cds = countdowns().filter(e => !isSecret(e)).slice(0, 3);
  const feat = featuredList();
  const lists = S.events.filter(e => e.kind === 'list' && !e.starts_on && !isSecret(e) && e !== feat).slice(0, 4);
  const later = []; for(let i = 2; i <= 8 && later.length < 5; i++) evs(addDays(t, i)).forEach(e => later.length < 5 && later.push(e));

    ${tomorrow.length ? `<div class="sssec">Tomorrow</div>${tomorrow.map(e => ssRow(e, 'later', nowHM)).join('')}` : ''}

      return `<div class="sssec">⭐ ${esc(fv.sticker || '☑️')} ${esc(fv.title || 'List')}</div><div class="ssfeat">${left.length
