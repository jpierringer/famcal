  if(d.check){ toggleItem(d.check); return; }
  if(d.delitem){ act(() => B.deleteItem(d.delitem), () => { S.items = S.items.filter(i => i.id !== d.delitem); }); return; }
  if(d.react){ penGate(() => { react(d.id, d.react); openDetail(d.id, true); }); return; }
  if(d.reactpick){ S.reactOpen = S.reactOpen === d.reactpick ? null : d.reactpick; render(); return; }
  if(d.edit){ const ev = S.events.find(e => e.id === d.edit); if(ev?.repeat && d.occ) openScope('edit', d.edit, d.occ); else openComposer({id:d.edit}); return; }
  if(d.del){ const ev = S.events.find(e => e.id === d.del);
    if(ev?.repeat && d.occ) openScope('delete', d.del, d.occ); else penGate(() => deleteEvent(d.del), ev?.owner_id); return; }
  if(d.ics){ downloadIcs(d.ics); return; }
  if(d.try){ openComposer({text:d.try, kind:d.kind}); return; }

    if(t.id === 'cKindBtn'){ C.kindMenu = !C.kindMenu; updateComposer(); return; }

    if(d.kind){ C.kind = d.kind; C.kindManual = true; C.kindMenu = false; updateComposer(); return; }
    if(d.qd !== undefined){ C.mDate = d.qd || null; updateComposer(); return; }
    if(d.stk){ const cur = draft().sticker; C.stickerManual = true; C.sticker = cur === d.stk ? null : d.stk; updateComposer(); return; }
    if(d.ins){ if(d.inscal){ C.mCal = d.inscal; try{ localStorage.setItem('famcal-lastcal', d.inscal); }catch(err){} } insertToken(d.ins); renderSugg(); return; }
    if(d.help){ helper(d.help); return; }
    if(d.when){ applyWhen(d.when, d.wt); return; }
    if(d.stksug){ C.stickerManual = true; C.sticker = draft().sticker === d.stksug ? null : d.stksug; updateComposer(); return; }
    if(t.id === 'cLive' || t.id === 'cStkMore'){ toggleAllStickers(); return; }
    if(t.id === 'cClearTime'){ C.mStart = null; C.mEnd = null; updateComposer(); return; }
    if(t.id === 'cUntilClear'){ C.mUntil = null; updateComposer(); return; }
    if(t.id === 'cStkAdd'){ openStickerAdd(); return; }
    if(t.id === 'nsCancel'){ closeStickerAdd(); return; }
    if(t.id === 'nsSave'){ saveCustomSticker(); return; }

    if(isHumanAvatar(S.me.emoji)){ const e = withTone(S.me.emoji, t); act(() => B.updateMe({emoji:e}), () => { S.me.emoji = e; }).then(openMe); }

/* ========================= Screensaver / wall display =========================
   After the screen has been idle, a phone-sized "today" panel slides to the left and the rest of the
   screen plays this device's photos and videos. Any touch brings the normal app back.
   Settings + media live on THIS device only (localStorage + IndexedDB), so nothing touches Supabase storage. */
const SS = { on:false, cfg:null, media:[], order:[], idx:-1, idleT:null, tickT:null, advT:null, wake:null, since:0, swallow:0, fails:0, fs:false };
const SS_DEF = { enabled:false, idle:2, secs:10, sound:false, night:true, shared:false, homeId:null, homePin:'', display:false, style:'classic', looks:['bw','vintage','cartoon'], fx:'some' };
function ssCfg(){
  if(!SS.cfg){ let c = {}; try{ c = JSON.parse(localStorage.getItem('famcal-ss') || '{}'); }catch(e){}
    if(c.display === undefined) c.display = !!(c.enabled || c.shared);     // screens set up before the "shared display" switch existed
    SS.cfg = { ...SS_DEF, ...c }; }
  return SS.cfg;
}
const ssOn = () => { const c = ssCfg(); return !!(c.display && c.enabled); };     // screensaver only ever runs on a shared display
function ssSave(patch){ Object.assign(ssCfg(), patch); try{ localStorage.setItem('famcal-ss', JSON.stringify(SS.cfg)); }catch(e){} ssArm(); if(patch.enabled && ssOn()){ ssPersist(); photoSync(); } }
function ssPersist(){ try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }

const SSDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('famcal-display', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('media', { keyPath:'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('media', mode), req = fn(t.objectStore('media'));
    t.oncomplete = () => res(req.result); t.onerror = t.onabort = () => rej(t.error); }); };
  return { all:() => tx('readonly', s => s.getAll()), put:r => tx('readwrite', s => s.put(r)), del:id => tx('readwrite', s => s.delete(id)), clear:() => tx('readwrite', s => s.clear()) };
})();
async function ssLoad(){ try{ SS.media = (await SSDB.all()).sort((a,b) => a.added - b.added); }catch(e){ SS.media = []; } if(SS.on) ssShuffle(); }

// Photos are shrunk to ~2000px before saving so a few hundred fit comfortably on the tablet.
/* iPhone photos (and Google Photos downloads of them) are often HEIC. Safari reads them natively;
   Chrome on Windows/Android can't, and Windows may not even label them as images. So: recognise them by
   name, try the browser first, and only if that fails load a small converter (heic2any) on first use. */
const HEIC_LIB = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
const isHeic = f => /\.(heic|heif)$/i.test(f.name || '') || /image\/hei[cf]/i.test(f.type || '');
const isImageFile = f => (f.type || '').startsWith('image/') || isHeic(f) || /\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(f.name || '');
const isVideoFile = f => (f.type || '').startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(f.name || '');
let heicLoading = null;
function loadHeic(){
  if(window.heic2any) return Promise.resolve(window.heic2any);
  return heicLoading || (heicLoading = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = HEIC_LIB; sc.async = true;
    sc.onload = () => window.heic2any ? res(window.heic2any) : rej(new Error('HEIC converter didn’t load'));
    sc.onerror = () => { heicLoading = null; rej(new Error('Couldn’t load the HEIC converter (check the internet connection)')); };
    document.head.appendChild(sc);
  }));
}
async function decodeImage(f){               // -> ImageBitmap, converting HEIC when the browser can't read it
  try{ return await createImageBitmap(f); }
  catch(e){
    if(!isHeic(f)) throw e;
    const heic2any = await loadHeic();
    const out = await heic2any({ blob:f, toType:'image/jpeg', quality:.92 });
    return createImageBitmap(Array.isArray(out) ? out[0] : out);
  }
}
async function ssShrink(f){
  let bmp; try{ bmp = await decodeImage(f); }catch(e){ if(isHeic(f)) throw e; return f; }
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  if(k === 1 && f.size < 600 * 1024){ bmp.close && bmp.close(); return f; }
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  return new Promise(r => c.toBlob(b => r(b || f), 'image/jpeg', .86));
}
async function ssAddFiles(files){
  let n = 0, bad = 0, t0 = Date.now();
  toast('Adding…');
  for(const f of files){
    try{
      if(isImageFile(f)) await SSDB.put({ id:uid(), type:'image', blob:await ssShrink(f), name:f.name, added:t0 + n++ });
      else if(isVideoFile(f) && f.size <= 200 * 1024 * 1024) await SSDB.put({ id:uid(), type:'video', blob:f, name:f.name, added:t0 + n++ });
      else bad++;
    }catch(e){ bad++; }
  }
  await ssLoad();
  toast(n ? `✓ Added ${n}${bad ? ` · ${bad} skipped (too big or unsupported)` : ''}` : '⚠️ Nothing added (videos over 200 MB are skipped)');
  reopenSettings();
}
// Google Photos / Drive / Dropbox "share" links open a web page, not a picture, so they can never show in the reel.
const ssIsPage = u => /^https?:\/\/(photos\.app\.goo\.gl|photos\.google\.com|goo\.gl\/photos|drive\.google\.com|(www\.)?dropbox\.com|1drv\.ms|onedrive\.live\.com|icloud\.com|share\.icloud\.com)\b/i.test(u);
// Google's picture servers return a small thumbnail unless a size is asked for.
function ssUrl(u){ try{ const x = new URL(u); if(/^lh\d*\.googleusercontent\.com$/.test(x.hostname) && !x.pathname.split('/').pop().includes('=')) return u.split(/[?#]/)[0] + '=w2000'; }catch(e){} return u; }
const ssProbe = (u, ms = 9000) => new Promise(res => { const i = new Image(), t = setTimeout(() => { i.src = ''; res(false); }, ms); i.referrerPolicy = 'no-referrer'; i.onload = () => { clearTimeout(t); res(true); }; i.onerror = () => { clearTimeout(t); res(false); }; i.src = ssUrl(u); });
async function ssAddLink(url){
  url = (url || '').trim(); if(!url) return;
  if(!/^https?:\/\//i.test(url)) return toast('⚠️ Paste a full link that starts with https://');
  if(ssIsPage(url)) return alert('That link opens a web page, not the picture itself, so it can’t play here.\n\nUse “＋ Photos & videos” instead. On an Android tablet the picker can choose straight from Google Photos.');
  const type = /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) ? 'video' : 'image';
  if(type === 'image'){ toast('Checking the link…'); if(!await ssProbe(url)) return alert('That link didn’t load as a picture. It has to open the photo file itself, not a web page.'); }
  await SSDB.put({ id:uid(), type, url, name:url, added:Date.now() });
  await ssLoad(); toast('✓ Link added'); reopenSettings();
}
async function ssPrune(){
  const links = SS.media.filter(m => m.url && m.type === 'image'); if(!links.length) return toast('No picture links to check');
  toast(`Checking ${links.length} links…`);
  const bad = []; let k = 0;
  const worker = async () => { while(k < links.length){ const m = links[k++]; if(!await ssProbe(m.url)) bad.push(m); } };
  await Promise.all([1,2,3,4,5,6].map(worker));
  for(const m of bad) await SSDB.del(m.id);
  await ssLoad();
  toast(bad.length ? `Removed ${bad.length} of ${links.length} links that wouldn’t load` : `✓ All ${links.length} links load`);
  reopenSettings();
}

/* ---------- Shared family photos ----------
   Any family phone or computer adds photos; every wall display in the family downloads them once into
   this device's photo store (IndexedDB) and plays them from there, so frames use almost no data and keep
   working offline. Videos stay on the device they were added on. */
const sharedPhotos = () => !!B?.addPhoto && !S.mediaMissing && S.cals.length > 0;
const photoCap = calId => +(cal(calId || dispCal())?.photo_cap) || 300;
const album = calId => S.media.filter(r => r.family_id === calId);
function photoCalDefault(){ const c = S.photoCal; if(cal(c)) return c; if(ssCfg().display) return dispCal(); return defaultCal() || S.cals[0]?.id; }
async function sha256Hex(blob){ const h = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
async function frameJpeg(file){              // ~1280px on the long side, under 1 MB (the bucket's limit)
  const bmp = await decodeImage(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  for(const q of [.82, .72, .6, .5]){
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if(b && b.size <= 1000 * 1024) return { blob:b, width:c.width, height:c.height };
  }
  throw new Error('photo too large');
}
function photoErr(e){
  const m = String(e?.message || e), cap = m.match(/photo_cap:(\d+)/);
  if(cap) return { stop:true, msg:`Your family has reached ${cap[1]} shared photos. Remove some to add more.` };
  if(/duplicate|sha256/i.test(m)) return { dup:true };
  return { msg:m };
}
async function photosAdd(files){
  const imgs = files.filter(isImageFile), vids = files.filter(f => !isImageFile(f));
  if(vids.length) await ssAddFiles(vids);                         // videos stay on this device
  if(!imgs.length) return;
  const calId = photoCalDefault();
  if(!canWrite(calId)) return toast(`👀 You can view ${calName(calId)}’s photos but not add to them`);
  let added = 0, dup = 0, bad = 0, stopped = '', lastErr = '';
  const known = new Set(album(calId).map(m => m.sha256)), cacheHere = ssOn() && dispCals().includes(calId);
  for(const [i, f] of imgs.entries()){
    if(album(calId).length + added >= photoCap(calId)){ stopped = `${calName(calId)} has reached ${photoCap(calId)} shared photos. Remove some to add more.`; break; }
    toast(`${isHeic(f) ? 'Converting' : 'Uploading'} ${i + 1} of ${imgs.length}…`);
    try{
      const sha = await sha256Hex(f);                               // hash of the original file: the same photo is never stored twice
      if(known.has(sha)){ dup++; continue; }
      const j = await frameJpeg(f), id = uid();
      await B.addPhoto({ id, cal:calId, blob:j.blob, sha256:sha, width:j.width, height:j.height });
      known.add(sha); added++;
      if(cacheHere) await SSDB.put({ id:'sh:' + id, mid:id, type:'image', blob:j.blob, name:f.name, shared:true, added:Date.now() });
    }catch(e){ const r = photoErr(e); if(r.dup){ dup++; continue; } if(r.stop){ stopped = r.msg; break; } bad++; lastErr = r.msg || ''; console.warn('photo upload', e); }
  }
  await refresh().catch(()=>{}); await ssLoad();
  const parts = [added ? `✓ Added ${added} photo${added === 1 ? '' : 's'} to ${calName(calId)}` : '', dup ? `${dup} already shared` : '', bad ? `${bad} couldn’t upload${/HEIC/i.test(lastErr) ? ` (${lastErr})` : ''}` : ''].filter(Boolean);
  toast(stopped ? (added ? `✓ Shared ${added}. ` : '') + stopped : parts.join(' · ') || 'Nothing new to add');
  if($('#sheet').dataset.panel === 'photos') openPhotos(); else reopenSettings();
}

const PSYNC = { busy:false, again:false, t:null };
function photoSyncSoon(){ clearTimeout(PSYNC.t); PSYNC.t = setTimeout(photoSync, 1200); }
async function photoSync(){                  // make this display's photo store match the family's shared photos
  if(!sharedPhotos() || !ssOn()) return;
  if(PSYNC.busy){ PSYNC.again = true; return; }
  PSYNC.busy = true;
  try{
    const ids = dispCals(), mine = S.media.filter(r => ids.includes(r.family_id)), local = await SSDB.all(), want = new Set(mine.map(r => r.id));     // this screen plays its calendars' albums
    let changed = false;
    for(const m of local) if(m.mid && !want.has(m.mid)){ await SSDB.del(m.id); changed = true; }      // removed by someone in the family
    const have = new Set(local.filter(m => m.mid).map(m => m.mid));
    const missing = mine.filter(r => !have.has(r.id));
    for(let i = 0; i < missing.length; i += 20){
      const batch = missing.slice(i, i + 20), links = await B.photoLinks(batch.map(r => r.path));
      await Promise.all(batch.map(async r => {
        const u = links[r.path]; if(!u) return;
        try{ const res = await fetch(u); if(!res.ok) return;
          await SSDB.put({ id:'sh:' + r.id, mid:r.id, type:'image', blob:await res.blob(), name:'', shared:true, added:Date.parse(r.added_at) || Date.now() }); changed = true; }catch(e){}
      }));
    }
    if(changed){ await ssLoad(); reopenSettings(); }
  }catch(e){ console.warn('photo sync', e); }
  finally{ PSYNC.busy = false; if(PSYNC.again){ PSYNC.again = false; photoSync(); } }
}
setInterval(() => { if(document.visibilityState === 'visible') photoSync(); }, 30 * 60000);   // safety net if a live update was missed

    <input type="file" id="ssShared2" accept="image/*,.heic,.heif" multiple class="hidden">
    ${rw ? '<div class="btns" style="margin:0 0 12px"><button class="btn primary" data-photoadd>＋ Add photos</button></div>' : ''}

/* slide projector: a dark room, a warm slightly faded picture with soft edges, a flickering lamp and dust on the

let PJ_AUDIO = null;

  }catch(e){}
}

  if(reduce){ el.animate([{ opacity:0 }, { opacity:1 }], { duration:500, delay:250, fill:'backwards' }); return; }
  setTimeout(projClick, 120);
  el.animate([{ transform:'translateX(30%)', opacity:0 }, { transform:'translateX(30%)', opacity:0, offset:.4 }, { transform:'translateX(30%)', opacity:1, offset:.45 }, { transform:'translateX(-1.2%)', offset:.85 }, { transform:'none', opacity:1 }],
    { duration:560, easing:'cubic-bezier(.2,.7,.3,1)', fill:'backwards' });
  el.querySelector('.pic').animate([                    // focus hunting: soft, too sharp, a little soft again, then crisp
    { filter:'blur(9px)' }, { filter:'blur(9px)', offset:.3 }, { filter:'blur(0px)', offset:.58 }, { filter:'blur(2.2px)', offset:.75 }, { filter:'blur(0px)' }],
    { duration:1700, easing:'ease-in-out' });
}

/* Ken Burns: the photo fills the screen and drifts — a slow push in, pull back, pan or tilt — then dissolves into
   the next. Every move is planned so the photo's edges never show. Shared photos get a small documentary caption. */
function kenBurns(stage, layer, m, secs){
  const img = layer.querySelector('img'), W = stage.clientWidth, H = stage.clientHeight;
  const nw = img.naturalWidth || 4, nh = img.naturalHeight || 3, base = Math.max(W / nw, H / nh);
  const bw = nw * base, bh = nh * base;                // the photo's size when it just covers the screen
  Object.assign(img.style, { width:bw + 'px', height:bh + 'px', left:0, top:0 });
  const extraX = bw / W, extraY = bh / H;              // > 1 means there's spare photo to pan across
  let z1, z2, f1, f2;                                  // zoom and focus point (0–1 across the photo) at start and end
  if(extraY > 1.25){ const down = Math.random() < .6; z1 = z2 = 1.04; f1 = { x:.5, y:down ? .18 : .78 }; f2 = { x:.5, y:down ? .72 : .3 }; }      // tall: tilt
  else if(extraX > 1.25){ const right = Math.random() < .5; z1 = z2 = 1.04; f1 = { x:right ? .25 : .75, y:.45 }; f2 = { x:right ? .75 : .25, y:.45 }; } // wide: pan
  else{
    const zin = Math.random() < .6, fx = rnd(.3, .7), fy = rnd(.28, .55);         // a bit above middle, where faces tend to be
    z1 = zin ? 1.02 : rnd(1.22, 1.32); z2 = zin ? rnd(1.22, 1.32) : 1.02;
    f1 = zin ? { x:.5, y:.5 } : { x:fx, y:fy }; f2 = zin ? { x:fx, y:fy } : { x:.5, y:.5 };
  }
  const at = (z, f) => {                               // translate so focus f sits mid-screen, clamped to keep edges hidden
    const iw = bw * z, ih = bh * z;
    const tx = Math.min(0, Math.max(W - iw, W / 2 - f.x * iw)), ty = Math.min(0, Math.max(H - ih, H / 2 - f.y * ih));
    return `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) scale(${z.toFixed(3)})`;
  };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ img.style.transform = at(1, { x:.5, y:.45 }); }
  else img.animate([{ transform:at(z1, f1) }, { transform:at(z2, f2) }], { duration:(secs + 3.5) * 1000, easing:'cubic-bezier(.35,.1,.65,.9)', fill:'forwards' });
  lowerThird(layer, m, secs, true);
}
function lowerThird(layer, m, secs, uploaderToo){       // documentary caption: a family comment, or (Ken Burns) who added it
  const row = m.mid && S.media.find(r => r.id === m.mid), who = row && member(row.uploaded_by), note = photoNote(m);
  if(!note && !(uploaderToo && who)) return;
  const when = new Date(row?.added_at || m.added || Date.now()).toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const cap = document.createElement('div'); cap.className = 'kbcap' + (note ? ' note' : '');
  cap.innerHTML = note ? `<b>“${esc(note.text)}”</b><small>${esc(note.by)} · ${esc(when)}</small>` : `<b>from ${esc(firstName(who.name))}</b><small>${esc(when)}</small>`;
  cap.style.animationDelay = `1.4s, ${Math.max(3, secs - 1.6)}s`;
  layer.appendChild(cap);
}

/* ---------- Start / stop / idle ---------- */
async function ssWake(){ try{ if('wakeLock' in navigator && !SS.wake) SS.wake = await navigator.wakeLock.request('screen'); }catch(e){} }
function ssStart(manual){
  adminLock(true);                       // never leave admin unlocked on an unattended wall screen
  if(SS.on || !S.me) return;
  SS.on = true; SS.since = Date.now(); SS.fails = 0; clearTimeout(SS.idleT);
  if(PEN.who) penDown(true);
  const el = $('#ss');
  el.innerHTML = '<div class="ssp" id="ssPanel"><div id="ssPanelIn"></div></div><div class="sss" id="ssStage"></div><div class="ssfx" id="ssFx"></div>';
  el.classList.remove('go'); el.classList.add('on'); el.setAttribute('aria-hidden', 'false');
  ssPanelRender();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('go')));   // two frames so the browser sees the "before" position and animates the slide
  setTimeout(() => { if(SS.on){ ssShuffle(); ssNext(); } }, 750);
  SS.tickT = setInterval(ssPanelRender, 30000);
  ssWake();
  if(manual && el.requestFullscreen && !document.fullscreenElement){ SS.fs = true; el.requestFullscreen().catch(() => { SS.fs = false; }); }
}
function ssStop(byUser){
  if(!SS.on) return;
  SS.on = false; if(byUser) SS.swallow = Date.now() + 500;
  clearInterval(SS.tickT); clearTimeout(SS.advT); clearTimeout(SB.settleT); clearTimeout(PC.flipT); SB.page = null; PC.cur = null;
  const el = $('#ss'); el.classList.remove('on', 'go'); el.setAttribute('aria-hidden', 'true');
  setTimeout(() => { if(!SS.on){ el.querySelectorAll('[data-blob]').forEach(l => l.dataset.blob && URL.revokeObjectURL(l.dataset.blob)); el.innerHTML = ''; } }, 600);
  if(SS.wake){ SS.wake.release && SS.wake.release().catch(() => {}); SS.wake = null; }
  if(SS.fs && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  SS.fs = false; ssArm();
}
function ssArm(){
  clearTimeout(SS.idleT);
  const c = ssCfg(); if(!ssOn() || SS.on || !S.me) return;
  SS.idleT = setTimeout(() => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    const busy = C || typing || $('#sheet').classList.contains('on') || !$('#onboard').classList.contains('hidden');
    busy ? ssArm() : ssStart(false);          // never interrupt someone who is in the middle of adding an event
  }, c.idle * 60000);
}
let ssLast = 0;
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(n => window.addEventListener(n, e => {
  if(SS.on){ if(Date.now() - SS.since > 600){ e.stopPropagation(); ssStop(true); } return; }
  if(PEN.who) penBump();
  const now = Date.now(); if(now - ssLast > 1000){ ssLast = now; ssArm(); }
}, { capture:true, passive:true }));
window.addEventListener('click', e => { if(Date.now() < SS.swallow){ e.stopPropagation(); e.preventDefault(); } }, true);   // the tap that wakes the screen shouldn't also press a button underneath
document.addEventListener('visibilitychange', () => { if(SS.on && document.visibilityState === 'visible'){ SS.wake = null; ssWake(); } });
async function ssInit(force){
  await ssLoad();
  if(ssOn()){ ssPersist(); photoSync(); }
  if(force){ ssSave({ display:true, enabled:true }); ssStart(false); }   // ?display=1 → open straight into the wall display
  else ssArm();
}

/* ========================= Shared screen: "pick your pen" =========================
   On a wall display everyone shares one sign-in, so before anyone adds, edits or reacts they pick
   themselves (and enter their PIN). The screen then acts as that person until it has been idle
   for a minute, the screensaver starts, or they tap the ✏️ chip; then it goes back to the screen's own sign-in.
   Switching uses the same claim_member PIN check as signing in, so nobody can write as someone else without their PIN. */
const PEN = { who:null, next:null, timer:null, pickT:null, idleMs:60000 };
const penName = id => firstName((dispWriters().find(m => m.id === id) || member(id) || {}).name);
const penTag = () => PEN.who && member(PEN.who) ? ' · ✏️ ' + penName(PEN.who) : '';
function penRender(){
  const b = $('#penChip'); if(!b) return;
  const m = PEN.who && member(PEN.who);
  b.classList.toggle('hidden', !m);
  if(m) b.innerHTML = `✏️ ${esc(firstName(m.name))} <span>✕</span>`;
}
function penBump(){ clearTimeout(PEN.timer); if(PEN.who) PEN.timer = setTimeout(penIdle, PEN.idleMs); }
function penIdle(){ if(!PEN.who) return; if(C || $('#sheet').classList.contains('on')){ penBump(); return; } penDown(); }
function penGate(next, only){            // run `next` now if this person already holds the pen, otherwise ask who is writing
  if(!ssCfg().display || !ssCfg().shared || !S.me) return next();
  if(PEN.who && (!only || PEN.who === only)){ penBump(); return next(); }
  penPick(next, only);
}
function penPick(next, only){
  PEN.next = next;
  const pool = dispWriters(), list = only ? pool.filter(m => m.id === only) : pool;
  openSheet(`<h3>${only ? 'Edit as…' : 'Who’s holding the pen?'}</h3>
    <p style="color:var(--muted);margin:6px 0 4px">${only ? 'Only the person who made this can change it.' : 'Pick yourself so it’s saved under your name.'}</p>
    <div class="who">${list.map(m => `<button data-penpick="${m.id}">${avatar(m, 'lg')}${esc(firstName(m.name))}</button>`).join('')}</div>
    <div class="btns"><button class="btn" data-pencancel>Cancel</button></div>`);
  $('#sheet').dataset.panel = 'pen';
  clearTimeout(PEN.pickT); PEN.pickT = setTimeout(() => { if($('#sheet').dataset.panel === 'pen') penCancel(); }, 30000);   // never leave the picker open on the wall
}
function penPin(id, err){
  const m = member(id);
  openSheet(`<div style="text-align:center;margin-top:6px">${avatar(m, 'lg')}</div><h3 style="text-align:center">Hi ${esc(firstName(m.name))}!</h3>
    <p style="color:var(--muted);text-align:center;margin:0 0 10px">Enter your PIN</p>
    <input class="field" id="penPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" style="text-align:center;letter-spacing:.4em;font-size:24px">
    <div class="err">${esc(err || '')}</div>
    <div class="btns"><button class="btn" data-pencancel>Cancel</button><button class="btn primary" data-pengo="${id}">Start writing</button></div>`);
  $('#sheet').dataset.panel = 'pen';
  setTimeout(() => { const i = $('#penPin'); i && i.focus(); }, 80);
}
function penCancel(){ PEN.next = null; clearTimeout(PEN.pickT); closeSheet(); }
async function penTake(id, pin){
  try{
    if(B.mode === 'supabase') await B.claim(codeFor(id), id, pin);   // the database checks the PIN
    else await B.switchMember(id);                                      // demo mode has no PINs
    PEN.who = id; S.filter.clear(); await refresh();
  }catch(e){ return penPin(id, e.message); }
  clearTimeout(PEN.pickT); closeSheet(); penBump(); penRender();
  const next = PEN.next; PEN.next = null; if(next) setTimeout(next, 120);
}
async function penDown(quiet){
  if(!PEN.who) return;
  clearTimeout(PEN.timer); const c = ssCfg();
  try{
    if(c.homeId && S.me && S.me.id !== c.homeId){
      if(B.mode === 'supabase') await B.claim(codeFor(c.homeId), c.homeId, c.homePin); else await B.switchMember(c.homeId);
    }
    PEN.who = null; S.filter.clear(); await refresh(); penRender(); if(!quiet) toast('✏️ Pen down');
  }catch(e){ penBump(); toast('⚠️ Couldn’t switch back: ' + e.message); }
}
async function penEnable(box){                  // turning the shared-screen setting on: remember this sign-in as the screen's "home" one
  const me = S.me; let pin = '';
  if(B.mode === 'supabase'){
    pin = (prompt(`Enter ${me.name}'s PIN. This screen keeps it so it can switch back after someone writes an event.`) || '').trim();
    if(!pin){ box.checked = false; return; }
    try{ await B.claim(codeFor(me.id), me.id, pin); }catch(e){ box.checked = false; return toast('⚠️ ' + e.message); }
  }
  ssSave({ shared:true, homeId:me.id, homePin:pin }); toast('✏️ Ask who’s writing is on'); reopenSettings();
}
async function ssDisplay(on){
  if(on){ ssSave({ display:true }); toast('🖼️ Shared display on'); }
  else{ if(ssCfg().shared) await penOff(true); if(SS.on) ssStop(); ssSave({ display:false, enabled:false }); toast('Shared display off'); }
  reopenSettings();
}
async function penOff(quiet){ await penDown(true); ssSave({ shared:false, homeId:null, homePin:'' }); if(!quiet){ toast('Ask who’s writing is off'); reopenSettings(); } }
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-penpick],[data-pengo],[data-pencancel],#penChip'); if(!t) return;
  if(t.dataset.penpick){ B.mode === 'supabase' ? penPin(t.dataset.penpick) : penTake(t.dataset.penpick); }
  else if(t.dataset.pengo){ const v = ($('#penPin').value || '').trim(); if(!v) return penPin(t.dataset.pengo, 'Enter your PIN'); t.disabled = true; penTake(t.dataset.pengo, v); }
  else if(t.dataset.pencancel !== undefined) penCancel();
  else penDown();
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'penPin'){ e.preventDefault(); const b = document.querySelector('[data-pengo]'); b && b.click(); } });

/* ========================= Boot ========================= */
(async function boot(){
  const configured = SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase;
  B = configured ? SupaBackend() : LocalBackend();
  if(!configured) $('#demoBanner').classList.remove('hidden');
  try{
    const me = await B.start();
    const q0 = new URLSearchParams(location.search), viewTok = q0.get('view');
    if(viewTok && B.mode === 'supabase'){                 // a read-only link (e.g. Grandma)
      OB.token = viewTok;
      if(!me){ try{ OB.view = await B.linkPreview(viewTok); }catch(e){} return ob('view'); }
      try{ await B.redeemLink(viewTok); history.replaceState(null, '', location.pathname); setTimeout(() => toast(`👀 You can now see ${S.cals.find(c => c.id === OB.joined)?.name || 'that calendar'}`), 600); }
      catch(e){ setTimeout(() => toast('⚠️ ' + e.message), 600); history.replaceState(null, '', location.pathname); }
    }
    if(!me){
      const code = new URLSearchParams(location.search).get('code');
      if(code){ OB.code = code.toUpperCase(); try{ const f = await B.preview(OB.code); if(f){ OB.fam = f; return ob('pick'); } }catch(e){} return ob('code'); }
      return ob('welcome');
    }
    await refresh();
    B.subscribe(liveRefresh);
    const q = new URLSearchParams(location.search);
    if(q.get('tab') === 'lists') setTab('lists');
    if(q.has('add')) openComposer();
    if(q.get('open')) openFromLink(q.get('open'));
    if(q.get('code')){ const code = q.get('code').toUpperCase();          // already signed in: offer to join that calendar
      if(!S.cals.some(c => c.code === code)){ S.joinCode = code; setTimeout(openJoinCal, 300); } }
    if(q.has('tab') || q.has('add') || q.has('open') || q.has('code')) history.replaceState(null, '', location.pathname);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(B.mode === 'supabase' && tz) S.cals.filter(c => !c.tz && c.role === 'contributor').forEach(c => B.updateCalendar(c.id, {tz}).catch(()=>{}));
    pushInit();
    ssInit(q.get('display') === '1');
    wxInit();
  }catch(e){
    if(e.message === 'not-member') return ob('welcome');
    console.error(e);
    if(B.mode === 'supabase') ob('welcome', '');
    toast('⚠️ ' + e.message);
  }
})();
</script>
