const ssRefresh = () => { if(SS.on) ssPanelRender(); };

/* ---------- The photo / video reel ---------- */
// "Mix it up": a different style each time the slideshow has been through every photo once
function ssMixPick(){
  const all = SS_STYLES.map(s => s[0]).filter(k => k !== 'mix' && k !== SS.mix);
  SS.mix = all[Math.floor(Math.random() * all.length)];
}
const ssStyle = () => { const c = ssCfg(); if(c.style !== 'mix') return c.style; if(!SS.mix) ssMixPick(); return SS.mix; };
function ssShuffle(){
  if(ssCfg().style === 'mix') ssMixPick();
  const a = SS.media.map((_, i) => i);
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  SS.order = a; SS.idx = -1;
}
function ssNext(){
  clearTimeout(SS.advT);
  const stage = $('#ssStage'); if(!SS.on || !stage) return;
  if(!SS.media.length){
    stage.innerHTML = `<div class="ssempty"><span class="big">🖼️</span><b>${esc(S.family?.name || 'Family')}</b><span>Add photos in ⚙️ Settings → Family photos</span></div>`;
    return;
  }
  if(SS.fails > SS.media.length){                   // nothing would load: say why instead of showing a black screen
    stage.innerHTML = `<div class="ssempty"><span class="big">⚠️</span><b>Couldn’t load your photos</b><span>The saved links open web pages, not pictures.<br>Open ⚙️ Settings → Shared display and tap “Remove links that don’t load”,<br>then add photos there.</span></div>`;
    return;
  }
  if(++SS.idx >= SS.order.length){ ssShuffle(); SS.idx = 0; }
  const m = SS.media[SS.order[SS.idx]]; if(!m){ ssShuffle(); SS.advT = setTimeout(ssNext, 50); return; }
  const cfg = ssCfg(), url = m.url ? ssUrl(m.url) : URL.createObjectURL(m.blob);
  const st = ssStyle(), pola = st === 'polaroid', scrap = st === 'scrapbook', post = st === 'postcard', proj = st === 'projector';
  stage.classList.toggle('pola', pola);
  const layer = scrap ? scrapItem(m) : post ? postcardItem(m) : proj ? projSlide() : document.createElement('div');
  if(!scrap && !post && !proj) layer.className = pola ? 'polw' : 'ssl'; layer.dataset.blob = m.url ? '' : url;
  const frame = pola ? polaroidFrame(m) : layer;                         // where the picture goes
  let done = false;
  const skip = () => { if(done) return; done = true; SS.fails++; if(!m.url) URL.revokeObjectURL(url); SS.advT = setTimeout(ssNext, 50); };
  const show = fn => {
    if(done || !SS.on) return; done = true; SS.fails = 0;
    if(pola){ layer.appendChild(frame); polaroidIn(stage, layer, m, url); }
    else if(scrap) scrapIn(stage, layer, m);
    else if(post) postcardIn(stage, layer, m, url);
    else if(proj) projIn(stage, layer);
    else{
      if(layer.classList.contains('kbl')) kenBurns(stage, layer, m, cfg.secs);
      const old = [...stage.children]; stage.appendChild(layer); void layer.offsetWidth; layer.classList.add('in');
      setTimeout(() => old.forEach(ssDrop), layer.classList.contains('kbl') ? 2500 : 1600);
    }
    fn && fn();
  };
  if(m.type === 'video'){
    const v = document.createElement('video'); v.className = 'fg'; v.muted = !cfg.sound; v.playsInline = true; v.preload = 'auto'; v.src = url;
    (pola || scrap || post || proj ? frame.querySelector('.pic') : layer).appendChild(v);
    v.addEventListener('error', skip);
    v.addEventListener('canplay', () => show(() => {
      const go = () => { clearTimeout(SS.advT); SS.advT = setTimeout(ssNext, 800); };
      v.addEventListener('ended', () => { if(scrap) scrapSettle(layer);
        if(post){ postcardFlip(layer); clearTimeout(SS.advT); SS.advT = setTimeout(ssNext, 4200); } else go(); }, { once:true });
      SS.advT = setTimeout(ssNext, Math.min(((v.duration || 60) + 4) * 1000, 190000));   // safety net if "ended" never fires
      v.play().catch(() => { v.muted = true; v.play().catch(skip); });
    }), { once:true });
  } else {
    const bg = new Image(), fg = new Image(); bg.className = 'bg'; fg.className = 'fg'; bg.alt = fg.alt = '';
    fg.style.setProperty('--kb', (cfg.secs + 2) + 's');
    const kb = st === 'kenburns';
    if(pola || scrap || post || proj) frame.querySelector('.pic').appendChild(fg);
    else if(kb){ layer.classList.add('kbl'); layer.appendChild(fg); }
    else layer.append(bg, fg);
    fg.onload = () => show(() => { SS.advT = setTimeout(ssNext, cfg.secs * 1000);
      if(scrap){ clearTimeout(SB.settleT); SB.settleT = setTimeout(() => scrapSettle(layer), Math.max(2600, cfg.secs * 1000 * .55)); }
      if(post){ clearTimeout(PC.flipT); PC.flipT = setTimeout(() => postcardFlip(layer), Math.max(2600, cfg.secs * 1000 * .55)); } });
    fg.onerror = skip;
    bg.referrerPolicy = fg.referrerPolicy = 'no-referrer';
    bg.src = fg.src = url;
  }
}

function ssDrop(el){ [el, ...el.querySelectorAll('[data-blob]')].forEach(x => x.dataset && x.dataset.blob && URL.revokeObjectURL(x.dataset.blob)); el.remove(); }
/* ---------- Photo styles ----------
   classic:  full-screen crossfade with a slow zoom.

const SS_STYLES = [['classic', '🎞️ Classic fade'], ['polaroid', '📸 Polaroid'], ['scrapbook', '✂️ Scrapbook'], ['postcard', '💌 Postcard'], ['projector', '📽️ Slide projector'], ['kenburns', '🎬 Ken Burns'], ['mix', '🔀 Mix it up']];
const POLA_KEEP = 4;                                    // prints left in the pile under the new one
function polaroidFrame(m){
  const card = document.createElement('div'); card.className = 'pol';
  const row = m.mid && S.media.find(r => r.id === m.mid), who = row && member(row.uploaded_by);
  card.innerHTML = `<div class="pic"></div><div class="cap">${who ? `from ${esc(firstName(who.name))} ♥` : ''}</div>`;
  return card;
}
function polaroidIn(stage, layer, m, url){
  // soft blurred copy of the photo fills the space behind the pile
  let bd = stage.querySelector('.ssbd'); if(!bd){ bd = document.createElement('div'); bd.className = 'ssbd'; stage.prepend(bd); }
  if(m.type !== 'video'){ const b = new Image(); b.referrerPolicy = 'no-referrer'; b.alt = ''; b.src = url; bd.appendChild(b);
    requestAnimationFrame(() => b.classList.add('in')); setTimeout(() => [...bd.children].slice(0, -1).forEach(x => x.remove()), 1800); }
  [...stage.children].filter(x => !x.classList.contains('polw')).forEach(x => x !== bd && ssDrop(x));   // leftovers from another style
  const card = layer.firstElementChild, pile = [...stage.querySelectorAll('.polw:not(.out)')];
  stage.appendChild(layer);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W = stage.clientWidth, H = stage.clientHeight, side = Math.random() < .5 ? -1 : 1;
  const tilt = side * (14 + Math.random() * 16) * (Math.random() < .8 ? 1 : -1), dy = (Math.random() - .5) * H * .35;
  if(reduce) card.animate([{ opacity:0 }, { opacity:1 }], { duration:900, easing:'ease', fill:'both' });
  else card.animate([                                   // slides first; grows and straightens as it reaches the middle
    { transform:`translate(${side * W * .62}px, ${dy}px) rotate(${tilt}deg) scale(.4)`, opacity:0, easing:'cubic-bezier(.3,.55,.4,1)' },
    { opacity:1, offset:.1, easing:'cubic-bezier(.3,.55,.4,1)' },
    { transform:`translate(${side * W * .08}px, ${dy * .2}px) rotate(${tilt * .7}deg) scale(.55)`, offset:.5, easing:'cubic-bezier(.45,0,.3,1)' },
    { transform:`translate(${-side * W * .012}px, 0) rotate(${-tilt * .05}deg) scale(1.025)`, offset:.86, easing:'ease-out' },
    { transform:'translate(0,0) rotate(0deg) scale(1)', opacity:1 }

    if(depth === 1 && !reduce){ const r = (Math.random() < .5 ? -1 : 1) * (2.5 + Math.random() * 4.5), dx = (Math.random() - .5) * 40, dy = (Math.random() - .5) * 24;
      c.animate([{}, { transform:`translate(${dx}px, ${dy}px) rotate(${r}deg) scale(.96)`, filter:'brightness(.8)' }], { duration:1400, delay:1300, easing:'ease-out', fill:'forwards' }); }
    if(depth >= POLA_KEEP){ p.classList.add('out');
      p.animate([{ opacity:1 }, { opacity:0 }], { duration:900, delay:1600, fill:'forwards' }).onfinish = () => { if(p.dataset.blob) URL.revokeObjectURL(p.dataset.blob); p.remove(); }; }
  });
}

/* scrapbook: each photo first shows big in the middle, then gets stuck onto a paper page — taped, torn, in
   album corners or doodled around — with the odd sticker. When the page is full it turns and a fresh one starts. */
const SB = { page:null, slots:[], used:0, hero:null, settleT:0 };
const SB_TAPE = ['#f4a261', '#e76f51', '#2a9d8f', '#e9c46a', '#8ecae6', '#cdb4db', '#ffafcc', '#95d5b2'];
const SB_STICKERS = ['⭐', '💖', '🌈', '✨', '🌻', '🎉', '😊', '🦋', '🍀', '🎈', '🌟', '💛'];
const SB_INK = ['#e76f51', '#2a6f97', '#6a4c93', '#d62828', '#2d6a4f'];
const rnd = (a, b) => a + Math.random() * (b - a), pickOne = a => a[Math.floor(Math.random() * a.length)];
function tornEdge(){                                   // a ragged paper outline, in % so it fits any size
  const pts = [], j = () => rnd(0, 1.8).toFixed(2);
  for(let x = 0; x < 100; x += rnd(2.5, 6)) pts.push(`${x.toFixed(1)}% ${j()}%`);
  for(let y = 0; y < 100; y += rnd(2.5, 6)) pts.push(`${(100 - j()).toFixed(2)}% ${y.toFixed(1)}%`);
  for(let x = 100; x > 0; x -= rnd(2.5, 6)) pts.push(`${x.toFixed(1)}% ${(100 - j()).toFixed(2)}%`);
  for(let y = 100; y > 0; y -= rnd(2.5, 6)) pts.push(`${j()}% ${y.toFixed(1)}%`);
  return `polygon(${pts.join(',')})`;
}
function roughRect(){                                  // a hand-drawn box: wobbly lines that overshoot the corners
  const w = () => rnd(-1.2, 1.2).toFixed(1);
  return `M${-3 + +w()} ${w()} L${103 + +w()} ${w()} M${100 + +w()} ${-3 + +w()} L${100 + +w()} ${103 + +w()} M${103 + +w()} ${100 + +w()} L${-3 + +w()} ${100 + +w()} M${w()} ${103 + +w()} L${w()} ${-3 + +w()}`;
}
function scrapItem(m){
  const el = document.createElement('div'); el.className = 'sbi';
  const kind = pickOne(['tape', 'tape', 'torn', 'corners', 'doodle']);
  const row = m.mid && S.media.find(r => r.id === m.mid), who = row && member(row.uploaded_by);
  const ink = pickOne(SB_INK);
  let deco = '';
  if(kind === 'tape'){ const two = Math.random() < .5;
    deco = two ? `<i class="tape" style="--t:${pickOne(SB_TAPE)};left:-6%;top:-3%;rotate:-38deg"></i><i class="tape" style="--t:${pickOne(SB_TAPE)};right:-6%;top:-3%;rotate:38deg"></i>`
      : `<i class="tape" style="--t:${pickOne(SB_TAPE)};left:33%;top:-6%;rotate:${rnd(-6, 6).toFixed(1)}deg"></i>`; }
  if(kind === 'corners') deco = '<i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>';
  if(kind === 'doodle') deco = `<svg class="ddl" viewBox="0 0 100 100" preserveAspectRatio="none"><path pathLength="1" d="${roughRect()}" style="stroke:${ink}"/></svg>`;
  if(Math.random() < .35) deco += `<i class="sbst" style="${pickOne(['left:-7%;top:-7%', 'right:-7%;top:-7%', 'right:-6%;bottom:2%', 'left:-6%;bottom:2%'])};rotate:${rnd(-25, 25).toFixed(0)}deg">${pickOne(SB_STICKERS)}</i>`;
  el.innerHTML = `<div class="paper k-${kind}" data-kind="${kind}" ${kind === 'torn' ? `style="clip-path:${tornEdge()}"` : ''}><div class="pic"></div>${who ? `<div class="cap" style="color:${ink}">from ${esc(firstName(who.name))} ♥</div>` : ''}</div>${deco}`;

function scrapPage(stage){                             // a fresh page under the current one; the old one turns away
  let book = stage.querySelector('.sbook');
  if(!book){ [...stage.children].forEach(ssDrop); book = document.createElement('div'); book.className = 'sbook'; stage.appendChild(book); }
  const W = stage.clientWidth, H = stage.clientHeight, now = new Date();
  const pg = document.createElement('div'); pg.className = 'sbpage ' + pickOne(['cream', 'kraft', 'grid']);
  pg.innerHTML = `<div class="sbhead">${esc(S.family?.name || 'Our family')}<small>${esc(now.toLocaleDateString(undefined, { month:'long', year:'numeric' }))}</small></div>`;
  const old = SB.page && SB.page.isConnected ? SB.page : null;
  book.prepend(pg);
  if(old){
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    old.style.zIndex = 2;
    old.animate(reduce ? [{ opacity:1 }, { opacity:0 }] : [{ transform:'rotateY(0deg)', filter:'brightness(1)' }, { transform:'rotateY(-100deg)', filter:'brightness(.55)' }],
      { duration:reduce ? 700 : 1500, easing:'cubic-bezier(.55,0,.35,1)', fill:'forwards' }).onfinish = () => ssDrop(old);
  }

  for(let r = 0; r < 2; r++) for(let c = 0; c < 3; c++) slots.push({ x:cw * (c + .5) + rnd(-.1, .1) * cw, y:top + ch * (r + .5) + rnd(-.08, .08) * ch, w:cw, h:ch });
  for(let i = slots.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }

function scrapIn(stage, el, m){
  if(SB.hero && SB.hero !== el) scrapSettle(SB.hero);
  const turning = !SB.page || !SB.page.isConnected || SB.used >= SB.slots.length ? scrapPage(stage) : false;
  const W = stage.clientWidth, H = stage.clientHeight;
  const media = el.querySelector('img,video'), nw = media.naturalWidth || media.videoWidth || 4, nh = media.naturalHeight || media.videoHeight || 3;
  // laid out at the big size (so it's sharp in the middle) and scaled down to its spot on the page
  const k = Math.min(W * .6 / nw, H * .68 / nh), pw = Math.round(nw * k), ph = Math.round(nh * k), pad = Math.round(pw * .045);
  const pic = el.querySelector('.pic'); pic.style.width = pw + 'px'; pic.style.height = ph + 'px';
  const paper = el.querySelector('.paper'), kind = paper.dataset.kind;
  paper.style.padding = kind === 'corners' || kind === 'doodle' ? '0' : `${pad}px ${pad}px ${el.querySelector('.cap') ? 0 : pad}px`;
  const cap = el.querySelector('.cap'); if(cap){ cap.style.fontSize = Math.max(14, pw * .05) + 'px'; cap.style.height = Math.max(30, pw * .1) + 'px'; }
  el.style.fontSize = Math.max(22, pw * .13) + 'px';                         // sticker size
  const slot = SB.slots[SB.used++], fullW = pw + (kind === 'corners' || kind === 'doodle' ? 0 : pad * 2), fullH = ph + pad * 2 + (cap ? pw * .1 : 0);
  const sc = Math.min(slot.w * .86 / fullW, slot.h * .86 / fullH);
  el.style.left = slot.x + 'px'; el.style.top = slot.y + 'px';
  const hero = `translate(-50%,-50%) translate(${W / 2 - slot.x}px, ${H / 2 - slot.y + H * .03}px) rotate(0deg) scale(1)`;
  el.dataset.slot = `translate(-50%,-50%) rotate(${rnd(-9, 9).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
  el.style.transform = hero; el.classList.add('hero');
  SB.page.appendChild(el); SB.hero = el;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.animate(reduce ? [{ opacity:0 }, { opacity:1 }] : [
    { opacity:0, transform:hero.replace('rotate(0deg) scale(1)', `rotate(${rnd(-5, 5).toFixed(1)}deg) scale(1.12)`) },
    { opacity:1, transform:hero }], { duration:800, delay:turning ? 900 : 0, easing:'cubic-bezier(.2,.8,.3,1.2)', fill:'backwards' });
}
function scrapSettle(el){                              // fly from the middle into its spot, then stick down
  if(!el || !el.classList.contains('hero')) return;
  el.classList.remove('hero'); if(SB.hero === el) SB.hero = null;

}

/* postcard: each photo is dealt onto the table as a postcard, shown photo-side up, then flipped over. The back has
   a handwritten note taken from the calendar, a stamp and today's postmark. The next card sweeps the old one away. */
const PC = { cur:null, flipT:0, last:'' };
const PC_STAMPS = ['🏡', '🌻', '❤️', '🌈', '⭐', '🦋', '🌲', '☀️', '🎈', '🐝'];
const PC_INKS = ['#c0392b', '#1d4e89', '#2d6a4f', '#7b2cbf', '#b5651d'];
const PC_GENERIC = ['Wish you were here! 😊', 'Having a wonderful time at home.', 'Hugs from all of us ♥', 'Thinking of you!', 'Best. Family. Ever.', 'Remember this one? 📸', 'Home is our favorite place.', 'Love you all to the moon 🌙'];
function postcardNotes(){                              // little notes from what's on the calendar (never private things)
  const t = todayStr(), ok = e => !isSecret(e) && e.kind !== 'list', when = e => e.start_time ? ' at ' + fmtTime(e.start_time) : '';
  const notes = [];
  countdowns().filter(e => !isSecret(e)).slice(0, 3).forEach(e => { const v = view(e), n = daysUntil(e.starts_on);
    notes.push({ text: n === 0 ? `Today’s the day — ${v.title}! 🎉` : n === 1 ? `${v.title} is tomorrow!` : `Only ${n} more days until ${v.title}!`, stamp: stickerOf(v) }); });
  S.events.filter(e => e.starts_on === t && ok(e)).sort(sortEv).slice(0, 3).forEach(e => { const v = view(e);
    notes.push({ text: `Don’t forget: ${v.title}${when(e)} today.`, stamp: stickerOf(v) }); });
  S.events.filter(e => e.starts_on === addDays(t, 1) && ok(e)).sort(sortEv).slice(0, 2).forEach(e => { const v = view(e);
    notes.push({ text: `Tomorrow: ${v.title}${when(e)}.`, stamp: stickerOf(v) }); });
  const f = featuredList();
  if(f){ const left = itemsOf(f.id).filter(i => !i.done), v = view(f);
    if(left.length) notes.push({ text: `Please pick up: ${left.slice(0, 3).map(i => i.text).join(', ')}${left.length > 3 ? ` + ${left.length - 3} more` : ''}.`, stamp: v.sticker || '🛒' }); }
  return notes;
}
function postcardItem(m){
  const el = document.createElement('div'); el.className = 'pc';
  const row = m.mid && S.media.find(r => r.id === m.mid), who = row && member(row.uploaded_by);

  const notes = postcardNotes().filter(n => n.text !== PC.last);
  const note = notes.length && Math.random() < .75 ? pickOne(notes) : { text: pickOne(PC_GENERIC), stamp: pickOne(PC_STAMPS) };
  PC.last = note.text;
  const ink = pickOne(PC_INKS), now = new Date();
  const mon = now.toLocaleDateString('en-US', { month:'short' }).toUpperCase(), day = now.getDate(), yr = now.getFullYear();
  const ring = `${fam.toUpperCase()} ★ HOME ★ `;
  el.innerHTML = `<div class="pcin">
    <div class="face front"><div class="pic"></div></div>
    <div class="face back">
      <div class="pchead">POST CARD</div>
      <div class="pcmsg" style="color:${ink}">${esc(note.text)}<div class="pcsig">— Love, ${esc(who ? firstName(who.name) : fam)}</div></div>
      <div class="pcdiv"></div>
      <div class="pcright">
        <div class="pcstamp"><div class="pci" style="--s:${pickOne(['#f6d5c3', '#d7e8f5', '#e3f0d8', '#f7e7b4', '#ead9f2'])}"><span>${esc(note.stamp || pickOne(PC_STAMPS))}</span><small>FAMILY POST</small></div></div>
        <svg class="pcmark" viewBox="0 0 220 120"><defs><path id="pcr${el.dataset.n = Math.random().toString(36).slice(2, 7)}" d="M60 60 m-44 0 a44 44 0 1 1 88 0 a44 44 0 1 1 -88 0"/></defs>
          <circle cx="60" cy="60" r="52"/><circle cx="60" cy="60" r="31"/>
          <text class="ring"><textPath href="#pcr${el.dataset.n}">${esc(ring.repeat(2).slice(0, 34))}</textPath></text>
          <text x="60" y="56" class="mid">${mon} ${day}</text><text x="60" y="74" class="mid sm">${yr}</text>
          <path class="wave" d="M118 34 q12 -8 24 0 t24 0 t24 0 t24 0 M118 52 q12 -8 24 0 t24 0 t24 0 t24 0 M118 70 q12 -8 24 0 t24 0 t24 0 t24 0 M118 88 q12 -8 24 0 t24 0 t24 0 t24 0"/></svg>
        <div class="pcaddr" style="color:${ink}"><span>Everyone at home</span><span>${esc(fam)}</span><span>♥</span></div>
      </div>

  return el;
}
function postcardIn(stage, el, m, url){
  let bd = stage.querySelector('.ssbd');
  if(!bd || !stage.querySelector('.pc')){ [...stage.children].forEach(ssDrop); bd = document.createElement('div'); bd.className = 'ssbd'; stage.appendChild(bd); }
  if(m.type !== 'video'){ const b = new Image(); b.referrerPolicy = 'no-referrer'; b.alt = ''; b.src = url; bd.appendChild(b);
    requestAnimationFrame(() => b.classList.add('in')); setTimeout(() => [...bd.children].slice(0, -1).forEach(x => x.remove()), 1800); }
  const W = stage.clientWidth, H = stage.clientHeight;
  const media = el.querySelector('img,video'), nw = media.naturalWidth || media.videoWidth || 3, nh = media.naturalHeight || media.videoHeight || 2;
  const a = Math.min(1.5, Math.max(.75, nw / nh)), k = Math.min(W * .7 / a, H * .72);       // postcards stay between 3:4 and 3:2
  const cw = Math.round(k * a), chh = Math.round(k);
  el.style.width = cw + 'px'; el.style.height = chh + 'px'; el.style.fontSize = Math.max(cw, chh) / 30 + 'px';
  el.classList.toggle('tall', a < 1);
  const old = PC.cur && PC.cur.isConnected ? PC.cur : null;
  stage.appendChild(el); PC.cur = el;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, rest = rnd(-2.5, 2.5).toFixed(1);
  el.style.transform = `translate(-50%,-50%) rotate(${rest}deg)`;
  el.animate(reduce ? [{ opacity:0 }, { opacity:1 }] : [
    { transform:`translate(-50%,-50%) translate(${W * .7}px, ${H * .25}px) rotate(${rnd(14, 24).toFixed(1)}deg) scale(.85)` },
    { transform:`translate(-50%,-50%) translate(-${W * .012}px, 0) rotate(${(-rest * .5).toFixed(1)}deg) scale(1.01)`, offset:.8 },
    { transform:`translate(-50%,-50%) rotate(${rest}deg)` }], { duration:1500, easing:'cubic-bezier(.25,.8,.3,1)' });
  if(old){ clearTimeout(PC.flipT); old.style.zIndex = 0;
    old.animate(reduce ? [{ opacity:1 }, { opacity:0 }] : [{ transform:old.style.transform, opacity:1 },
      { transform:`translate(-50%,-50%) translate(-${W * .75}px, ${-H * .12}px) rotate(-${rnd(12, 22).toFixed(0)}deg) scale(.85)`, opacity:.2 }],
      { duration:1300, delay:120, easing:'cubic-bezier(.5,0,.75,.4)', fill:'forwards' }).onfinish = () => ssDrop(old); }
}
function postcardFlip(el){                             // turn it over to read the back
  if(!el || !el.isConnected || el.classList.contains('flipped')) return;
  el.classList.add('flipped');
  const v = el.querySelector('video'); if(v) v.pause();
}

/* slide projector: a dark room, a warm slightly faded picture with soft edges, a flickering lamp and dust on the
   lens. Each change blinks the shutter, clacks the old slide out and the new one in, then hunts for focus. */
function projSlide(){ const el = document.createElement('div'); el.className = 'pslide'; el.innerHTML = '<div class="pic"></div><i class="hot"></i>'; return el; }
let PJ_AUDIO = null;
function projClick(){                                  // a synthesized carousel "ka-chunk" (only when sound is on)
  if(!ssCfg().sound) return;
  try{
    const ac = PJ_AUDIO || (PJ_AUDIO = new (window.AudioContext || window.webkitAudioContext)()); if(ac.state === 'suspended') ac.resume();
    const hit = (t, dur, freq, vol) => {
      const n = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = n.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = n; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2; g.gain.value = vol;
      src.connect(f).connect(g).connect(ac.destination); src.start(ac.currentTime + t);
    };
    hit(0, .05, 2400, .5); hit(.05, .09, 420, .9); hit(.30, .06, 1800, .35);
  }catch(e){}
}
function projRoom(stage){
  let room = stage.querySelector('.proj'); if(room) return room;
  [...stage.children].forEach(ssDrop);
  room = document.createElement('div'); room.className = 'proj';
  room.innerHTML = '<div class="pscreen"><div class="pshut"></div><canvas class="pdust"></canvas></div>';
  stage.appendChild(room);
  const cv = room.querySelector('.pdust'), cx = cv.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = 0, hair = null;
  const tick = t => {                                  // a few specks of dust and the odd hair, redrawn ~12 times a second
    if(!room.isConnected || !SS.on) return;
    requestAnimationFrame(tick);
    if(reduce || t - last < 85) return; last = t;
    const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight; if(!w) return;
    cx.clearRect(0, 0, w, h);
    const n = Math.random() < .35 ? 0 : 1 + Math.floor(Math.random() * 4);
    for(let i = 0; i < n; i++){ cx.fillStyle = `rgba(20,14,8,${rnd(.25, .6)})`; cx.beginPath(); cx.arc(rnd(0, w), rnd(0, h), rnd(.6, 2.4), 0, 7); cx.fill(); }
    if(!hair && Math.random() < .012) hair = { x:rnd(.1, .9) * w, y:rnd(.1, .9) * h, a:rnd(0, 6.3), l:rnd(.04, .12) * w, life:rnd(8, 22) };
    if(hair){ cx.strokeStyle = 'rgba(25,18,10,.55)'; cx.lineWidth = 1.3; cx.beginPath(); cx.moveTo(hair.x, hair.y);
      cx.quadraticCurveTo(hair.x + Math.cos(hair.a) * hair.l * .6 + 8, hair.y + Math.sin(hair.a) * hair.l * .6 - 8, hair.x + Math.cos(hair.a) * hair.l, hair.y + Math.sin(hair.a) * hair.l); cx.stroke();
      hair.x += rnd(-1, 1); hair.y += rnd(-1, 1); if(--hair.life <= 0) hair = null; }
    if(Math.random() < .04){ cx.fillStyle = 'rgba(255,248,230,.07)'; cx.fillRect(rnd(0, w), 0, rnd(1, 2.5), h); }   // a faint scratch
  };
  requestAnimationFrame(tick);
  return room;
}
function projIn(stage, el){
  const room = projRoom(stage), scr = room.querySelector('.pscreen'), shut = room.querySelector('.pshut');
  const W = stage.clientWidth, H = stage.clientHeight;
  const media = el.querySelector('img,video'), nw = media.naturalWidth || media.videoWidth || 3, nh = media.naturalHeight || media.videoHeight || 2;
  const k = Math.min(W * .84 / nw, H * .8 / nh), sw = Math.round(nw * k), sh = Math.round(nh * k);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const old = [...scr.querySelectorAll('.pslide')];
  // the light on the screen takes the new slide's shape while the shutter is closed
  shut.animate([{ opacity:0 }, { opacity:.96, offset:.25 }, { opacity:.96, offset:.6 }, { opacity:0 }], { duration:reduce ? 600 : 820, easing:'ease-in-out' });
  setTimeout(() => { scr.style.width = sw + 'px'; scr.style.height = sh + 'px'; }, reduce ? 150 : 200);
  old.forEach(o => { if(!reduce) o.animate([{ transform:'none' }, { transform:'translateX(-34%)' }], { duration:260, easing:'cubic-bezier(.6,0,.9,.5)', fill:'forwards' });
    setTimeout(() => ssDrop(o), 300); });
  scr.insertBefore(el, shut);
  if(reduce){ el.animate([{ opacity:0 }, { opacity:1 }], { duration:500, delay:250, fill:'backwards' }); return; }
  setTimeout(projClick, 120);
  el.animate([{ transform:'translateX(30%)', opacity:0 }, { transform:'translateX(30%)', opacity:0, offset:.4 }, { transform:'translateX(30%)', opacity:1, offset:.45 }, { transform:'translateX(-1.2%)', offset:.85 }, { transform:'none', opacity:1 }],
    { duration:560, easing:'cubic-bezier(.2,.7,.3,1)', fill:'backwards' });
  el.querySelector('.pic').animate([                    // focus hunting: soft, too sharp, a little soft again, then crisp
    { filter:'blur(9px)' }, { filter:'blur(9px)', offset:.3 }, { filter:'blur(0px)', offset:.58 }, { filter:'blur(2.2px)', offset:.75 }, { filter:'blur(0px)' }],
    { duration:1700, easing:'ease-in-out' });
}

/* Ken Burns: the photo fills the screen and drifts — a slow push in, pull back, pan or tilt — then dissolves into
   the next. Every move is planned so the photo's edges never show. Shared photos get a small documentary caption. */
function kenBurns(stage, layer, m, secs){
  const img = layer.querySelector('img'), W = stage.clientWidth, H = stage.clientHeight;
  const nw = img.naturalWidth || 4, nh = img.naturalHeight || 3, base = Math.max(W / nw, H / nh);
  const bw = nw * base, bh = nh * base;                // the photo's size when it just covers the screen
  Object.assign(img.style, { width:bw + 'px', height:bh + 'px', left:0, top:0 });
  const extraX = bw / W, extraY = bh / H;              // > 1 means there's spare photo to pan across
  let z1, z2, f1, f2;                                  // zoom and focus point (0–1 across the photo) at start and end
  if(extraY > 1.25){ const down = Math.random() < .6; z1 = z2 = 1.04; f1 = { x:.5, y:down ? .18 : .78 }; f2 = { x:.5, y:down ? .72 : .3 }; }      // tall: tilt
  else if(extraX > 1.25){ const right = Math.random() < .5; z1 = z2 = 1.04; f1 = { x:right ? .25 : .75, y:.45 }; f2 = { x:right ? .75 : .25, y:.45 }; } // wide: pan
  else{
    const zin = Math.random() < .6, fx = rnd(.3, .7), fy = rnd(.28, .55);         // a bit above middle, where faces tend to be
    z1 = zin ? 1.02 : rnd(1.22, 1.32); z2 = zin ? rnd(1.22, 1.32) : 1.02;
    f1 = zin ? { x:.5, y:.5 } : { x:fx, y:fy }; f2 = zin ? { x:fx, y:fy } : { x:.5, y:.5 };
  }
  const at = (z, f) => {                               // translate so focus f sits mid-screen, clamped to keep edges hidden
    const iw = bw * z, ih = bh * z;
    const tx = Math.min(0, Math.max(W - iw, W / 2 - f.x * iw)), ty = Math.min(0, Math.max(H - ih, H / 2 - f.y * ih));
    return `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) scale(${z.toFixed(3)})`;
  };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ img.style.transform = at(1, { x:.5, y:.45 }); }
  else img.animate([{ transform:at(z1, f1) }, { transform:at(z2, f2) }], { duration:(secs + 3.5) * 1000, easing:'cubic-bezier(.35,.1,.65,.9)', fill:'forwards' });
  const row = m.mid && S.media.find(r => r.id === m.mid), who = row && member(row.uploaded_by);
  if(who){
    const when = new Date(row.added_at || m.added || Date.now()).toLocaleDateString(undefined, { month:'long', year:'numeric' });
    const cap = document.createElement('div'); cap.className = 'kbcap';
    cap.innerHTML = `<b>from ${esc(firstName(who.name))}</b><small>${esc(when)}</small>`;
    cap.style.animationDelay = `1.4s, ${Math.max(3, secs - 1.6)}s`;
    layer.appendChild(cap);
  }
}

/* ---------- Start / stop / idle ---------- */
async function ssWake(){ try{ if('wakeLock' in navigator && !SS.wake) SS.wake = await navigator.wakeLock.request('screen'); }catch(e){} }
function ssStart(manual){
  adminLock(true);                       // never leave admin unlocked on an unattended wall screen
  if(SS.on || !S.me) return;
  SS.on = true; SS.since = Date.now(); SS.fails = 0; clearTimeout(SS.idleT);
  if(PEN.who) penDown(true);
  const el = $('#ss');
  el.innerHTML = '<div class="ssp" id="ssPanel"><div id="ssPanelIn"></div></div><div class="sss" id="ssStage"></div>';
  el.classList.remove('go'); el.classList.add('on'); el.setAttribute('aria-hidden', 'false');
  ssPanelRender();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('go')));   // two frames so the browser sees the "before" position and animates the slide
  setTimeout(() => { if(SS.on){ ssShuffle(); ssNext(); } }, 750);
  SS.tickT = setInterval(ssPanelRender, 30000);
  ssWake();
  if(manual && el.requestFullscreen && !document.fullscreenElement){ SS.fs = true; el.requestFullscreen().catch(() => { SS.fs = false; }); }
}
function ssStop(byUser){
  if(!SS.on) return;
  SS.on = false; if(byUser) SS.swallow = Date.now() + 500;
  clearInterval(SS.tickT); clearTimeout(SS.advT); clearTimeout(SB.settleT); clearTimeout(PC.flipT); SB.page = null; PC.cur = null;
  const el = $('#ss'); el.classList.remove('on', 'go'); el.setAttribute('aria-hidden', 'true');
  setTimeout(() => { if(!SS.on){ el.querySelectorAll('[data-blob]').forEach(l => l.dataset.blob && URL.revokeObjectURL(l.dataset.blob)); el.innerHTML = ''; } }, 600);
  if(SS.wake){ SS.wake.release && SS.wake.release().catch(() => {}); SS.wake = null; }
  if(SS.fs && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  SS.fs = false; ssArm();
}
function ssArm(){
  clearTimeout(SS.idleT);
  const c = ssCfg(); if(!ssOn() || SS.on || !S.me) return;
  SS.idleT = setTimeout(() => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    const busy = C || typing || $('#sheet').classList.contains('on') || !$('#onboard').classList.contains('hidden');
    busy ? ssArm() : ssStart(false);          // never interrupt someone who is in the middle of adding an event
  }, c.idle * 60000);
}
let ssLast = 0;
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(n => window.addEventListener(n, e => {
  if(SS.on){ if(Date.now() - SS.since > 600){ e.stopPropagation(); ssStop(true); } return; }
  if(PEN.who) penBump();
  const now = Date.now(); if(now - ssLast > 1000){ ssLast = now; ssArm(); }
}, { capture:true, passive:true }));
window.addEventListener('click', e => { if(Date.now() < SS.swallow){ e.stopPropagation(); e.preventDefault(); } }, true);   // the tap that wakes the screen shouldn't also press a button underneath
document.addEventListener('visibilitychange', () => { if(SS.on && document.visibilityState === 'visible'){ SS.wake = null; ssWake(); } });
async function ssInit(force){
  await ssLoad();
  if(ssOn()){ ssPersist(); photoSync(); }
  if(force){ ssSave({ display:true, enabled:true }); ssStart(false); }   // ?display=1 → open straight into the wall display
  else ssArm();
}

/* ========================= Shared screen: "pick your pen" =========================
   On a wall display everyone shares one sign-in, so before anyone adds, edits or reacts they pick
   themselves (and enter their PIN). The screen then acts as that person until it has been idle
   for a minute, the screensaver starts, or they tap the ✏️ chip; then it goes back to the screen's own sign-in.
   Switching uses the same claim_member PIN check as signing in, so nobody can write as someone else without their PIN. */
const PEN = { who:null, next:null, timer:null, pickT:null, idleMs:60000 };
const penTag = () => PEN.who && member(PEN.who) ? ' · ✏️ ' + firstName(member(PEN.who).name) : '';
function penRender(){
  const b = $('#penChip'); if(!b) return;
  const m = PEN.who && member(PEN.who);
  b.classList.toggle('hidden', !m);
  if(m) b.innerHTML = `✏️ ${esc(firstName(m.name))} <span>✕</span>`;
}
function penBump(){ clearTimeout(PEN.timer); if(PEN.who) PEN.timer = setTimeout(penIdle, PEN.idleMs); }
function penIdle(){ if(!PEN.who) return; if(C || $('#sheet').classList.contains('on')){ penBump(); return; } penDown(); }
function penGate(next, only){            // run `next` now if this person already holds the pen, otherwise ask who is writing
  if(!ssCfg().display || !ssCfg().shared || !S.me) return next();
  if(PEN.who && (!only || PEN.who === only)){ penBump(); return next(); }
  penPick(next, only);
}
function penPick(next, only){
  PEN.next = next;
  const list = only ? S.members.filter(m => m.id === only) : S.members;
  openSheet(`<h3>${only ? 'Edit as…' : 'Who’s holding the pen?'}</h3>
    <p style="color:var(--muted);margin:6px 0 4px">${only ? 'Only the person who made this can change it.' : 'Pick yourself so it’s saved under your name.'}</p>
    <div class="who">${list.map(m => `<button data-penpick="${m.id}">${avatar(m, 'lg')}${esc(firstName(m.name))}</button>`).join('')}</div>
    <div class="btns"><button class="btn" data-pencancel>Cancel</button></div>`);
  $('#sheet').dataset.panel = 'pen';
  clearTimeout(PEN.pickT); PEN.pickT = setTimeout(() => { if($('#sheet').dataset.panel === 'pen') penCancel(); }, 30000);   // never leave the picker open on the wall
}
function penPin(id, err){
  const m = member(id);
  openSheet(`<div style="text-align:center;margin-top:6px">${avatar(m, 'lg')}</div><h3 style="text-align:center">Hi ${esc(firstName(m.name))}!</h3>
    <p style="color:var(--muted);text-align:center;margin:0 0 10px">Enter your PIN</p>
    <input class="field" id="penPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" style="text-align:center;letter-spacing:.4em;font-size:24px">
    <div class="err">${esc(err || '')}</div>
    <div class="btns"><button class="btn" data-pencancel>Cancel</button><button class="btn primary" data-pengo="${id}">Start writing</button></div>`);
  $('#sheet').dataset.panel = 'pen';
  setTimeout(() => { const i = $('#penPin'); i && i.focus(); }, 80);
}
function penCancel(){ PEN.next = null; clearTimeout(PEN.pickT); closeSheet(); }
async function penTake(id, pin){
  try{
    if(B.mode === 'supabase') await B.claim(S.family.code, id, pin);   // the database checks the PIN
    else await B.switchMember(id);                                      // demo mode has no PINs
    PEN.who = id; S.filter.clear(); await refresh();
  }catch(e){ return penPin(id, e.message); }
  clearTimeout(PEN.pickT); closeSheet(); penBump(); penRender();
  const next = PEN.next; PEN.next = null; if(next) setTimeout(next, 120);
}
async function penDown(quiet){
  if(!PEN.who) return;
  clearTimeout(PEN.timer); const c = ssCfg();
  try{
    if(c.homeId && S.me && S.me.id !== c.homeId){
      if(B.mode === 'supabase') await B.claim(S.family.code, c.homeId, c.homePin); else await B.switchMember(c.homeId);
    }
    PEN.who = null; S.filter.clear(); await refresh(); penRender(); if(!quiet) toast('✏️ Pen down');
  }catch(e){ penBump(); toast('⚠️ Couldn’t switch back: ' + e.message); }
}
async function penEnable(box){                  // turning the shared-screen setting on: remember this sign-in as the screen's "home" one
  const me = S.me; let pin = '';
  if(B.mode === 'supabase'){
    pin = (prompt(`Enter ${me.name}'s PIN. This screen keeps it so it can switch back after someone writes an event.`) || '').trim();
    if(!pin){ box.checked = false; return; }
    try{ await B.claim(S.family.code, me.id, pin); }catch(e){ box.checked = false; return toast('⚠️ ' + e.message); }
  }
  ssSave({ shared:true, homeId:me.id, homePin:pin }); toast('✏️ Ask who’s writing is on'); reopenSettings();
}
async function ssDisplay(on){
  if(on){ ssSave({ display:true }); toast('🖼️ Shared display on'); }
  else{ if(ssCfg().shared) await penOff(true); if(SS.on) ssStop(); ssSave({ display:false, enabled:false }); toast('Shared display off'); }
  reopenSettings();
}
async function penOff(quiet){ await penDown(true); ssSave({ shared:false, homeId:null, homePin:'' }); if(!quiet){ toast('Ask who’s writing is off'); reopenSettings(); } }
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-penpick],[data-pengo],[data-pencancel],#penChip'); if(!t) return;
  if(t.dataset.penpick){ B.mode === 'supabase' ? penPin(t.dataset.penpick) : penTake(t.dataset.penpick); }
  else if(t.dataset.pengo){ const v = ($('#penPin').value || '').trim(); if(!v) return penPin(t.dataset.pengo, 'Enter your PIN'); t.disabled = true; penTake(t.dataset.pengo, v); }
  else if(t.dataset.pencancel !== undefined) penCancel();
  else penDown();
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'penPin'){ e.preventDefault(); const b = document.querySelector('[data-pengo]'); b && b.click(); } });

/* ========================= Boot ========================= */
(async function boot(){
  const configured = SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase;
  B = configured ? SupaBackend() : LocalBackend();
  if(!configured) $('#demoBanner').classList.remove('hidden');
  try{
    const me = await B.start();
    if(!me){
      const code = new URLSearchParams(location.search).get('code');
      if(code){ OB.code = code.toUpperCase(); try{ const f = await B.preview(OB.code); if(f){ OB.fam = f; return ob('pick'); } }catch(e){} return ob('code'); }
      return ob('welcome');
    }
    await refresh();
    B.subscribe(liveRefresh);
    const q = new URLSearchParams(location.search);
    if(q.get('tab') === 'lists') setTab('lists');
    if(q.has('add')) openComposer();
    if(q.get('open')) openFromLink(q.get('open'));
    if(q.has('tab') || q.has('add') || q.has('open')) history.replaceState(null, '', location.pathname);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(B.mode === 'supabase' && S.family && !S.family.tz && tz) B.updateFamily({tz}).catch(()=>{});
    pushInit();
    ssInit(q.get('display') === '1');
  }catch(e){
    if(e.message === 'not-member') return ob('welcome');
    console.error(e);
    if(B.mode === 'supabase') ob('welcome', '');
    toast('⚠️ ' + e.message);
  }
})();
</script>
