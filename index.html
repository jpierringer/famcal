<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f1d1a; --muted:#8a8378; --line:#ece6dc; --soft:#f3eee6;
  --accent:#ff6b4a; --accent-ink:#fff; --good:#16a34a; --bad:#dc2626;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151413; --card:#201e1c; --ink:#f3efe8; --muted:#9b958b; --line:#2e2b28; --soft:#2a2724;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font-family:inherit}
body{min-height:100dvh;padding-bottom:calc(84px + var(--safe-b));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Top ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 0}
.toprow{display:flex;align-items:center;gap:8px}
.month{position:relative;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:4px}
.month small{font-size:13px;color:var(--muted);font-weight:600}
.month input{position:absolute;inset:0;opacity:0;width:100%}
.spacer{flex:1}
.pill{padding:7px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,#999) 22%,var(--card));box-shadow:0 0 0 2px var(--c,#999) inset;flex:none}
.av.sm{width:24px;height:24px;font-size:13px;box-shadow:0 0 0 1.5px var(--c,#999) inset}
.av.lg{width:56px;height:56px;font-size:30px;box-shadow:0 0 0 3px var(--c,#999) inset}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 6px;touch-action:pan-y}
.day{display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;border-radius:14px;gap:2px}
.day .dw{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day .dn{font-size:17px;font-weight:700;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--card);box-shadow:var(--shadow)}
.day.sel .dn{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;opacity:.9}
.fchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));opacity:1}
.fchip .av{width:24px;height:24px;font-size:14px}

/* ---------- Main ---------- */
main{padding:4px 16px 20px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:6px 2px 12px}
.dayhead h2{margin:0;font-size:26px;letter-spacing:-.02em}
.dayhead .wxd{margin-left:auto;font-weight:800;color:var(--ink,inherit);white-space:nowrap}
.dayhead .wxd small{font-weight:700;color:var(--muted)}
.wxe{white-space:nowrap}
.wxw{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.wxwhere{display:flex;align-items:center;gap:10px;padding:10px 2px 4px}
.wxwhere span{flex:1}
.wxpick{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;background:var(--soft);margin-top:6px;font-weight:700}
.wxpick small{margin-left:6px;color:var(--muted);font-weight:600}
.sswx{display:flex;align-items:center;gap:12px;margin:-4px 2px 8px}
.sswn{font-size:clamp(26px,2.6vw,34px);white-space:nowrap}
.sswn b{font-weight:800;letter-spacing:-.02em}
.sswt{font-size:13px;font-weight:700;color:var(--muted);line-height:1.3}
.sswd{display:flex;gap:6px;margin:0 0 14px}
.sswd span{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;background:rgba(127,127,127,.12);font-size:18px}
.sswd small{font-size:11px;font-weight:700;color:var(--muted)}
.sswd b{font-size:13px;font-weight:800}
.dayhead span{color:var(--muted);font-weight:600}
.sub{margin:22px 2px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.card{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px 18px;margin:0 0 12px;overflow:visible}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.card .when{font-size:13px;font-weight:700;color:var(--c);display:flex;gap:6px;align-items:center}
.card .ttl{font-size:18px;font-weight:700;margin:2px 0 0;padding-right:46px;letter-spacing:-.01em;word-break:break-word}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;color:var(--muted);font-size:14px;align-items:center}
.gear{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:18px;display:grid;place-items:center;flex:none}
.gear:active{transform:scale(.94)}
.sheeth{margin:0 0 4px;font-size:22px}
.admincard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.admincard > div{flex:1}
.adminbar{display:flex;align-items:center;gap:10px}
.adminbar .hint{display:flex;align-items:center;gap:6px}
.adminrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-weight:600}
.adminrow > span{flex:1}
.adminrow input{width:22px;height:22px;accent-color:var(--accent)}
.mrow .pill.on{background:color-mix(in srgb,#f59e0b 22%,var(--soft))}
.pill.danger{color:#dc2626}
.kindtag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--muted)}
.sticker{position:absolute;top:-10px;right:10px;font-size:38px;line-height:1;transform:rotate(9deg);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1.5px -1.5px #fff,-1.5px 1.5px #fff;pointer-events:none}
.card:nth-of-type(even) .sticker{transform:rotate(-8deg)}
.people{display:flex;align-items:center}
.people .av{margin-right:-6px;position:relative}
.people .av.yes::after,.people .av.no::after{position:absolute;right:-3px;bottom:-3px;font-size:10px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.people .av.yes::after{content:"✓";background:var(--good)}
.people .av.no::after{content:"✕";background:var(--bad)}

.addr{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted)}

.reacts span{font-size:13px;padding:2px 7px;border-radius:999px;background:var(--soft)}

.busy{background:repeating-linear-gradient(-45deg,var(--card),var(--card) 10px,var(--soft) 10px,var(--soft) 20px)}

.items{list-style:none;margin:8px 0 0;padding:0}

.try{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);font-weight:600}

/* ---------- Bottom nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-around;padding:8px 24px calc(8px + var(--safe-b));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}

  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1.5px -1.5px #fff,-1.5px 1.5px #fff;filter:drop-shadow(0 3px 3px rgba(0,0,0,.22))}

@media (prefers-color-scheme: dark){ .sugg button.whenchip{color:#93c5fd} }
.big::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}

.stknew{margin:12px 0 4px;padding:14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.stknew-top{display:flex;gap:12px;align-items:flex-start}
.stknew .field{margin-bottom:6px}
.stkprev{flex:none;width:58px;height:58px;display:grid;place-items:center;font-size:38px;border-radius:16px;background:var(--soft);filter:grayscale(1);opacity:.4;transform:rotate(-6deg)}
.stkprev.ok{filter:none;opacity:1;text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff}
.fs{font-size:28px;width:40px;text-align:center}
/* ---------- Countdowns ---------- */
.cds{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px;margin:-8px -2px 8px;scrollbar-width:none}
.cds::-webkit-scrollbar{display:none}
.cd{position:relative;flex:none;min-width:118px;max-width:170px;display:flex;flex-direction:column;align-items:flex-start;padding:12px 14px 12px;border-radius:20px;color:#fff;text-align:left;
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 30%,transparent)}
.cd b{font-size:34px;line-height:1;font-weight:900;letter-spacing:-.03em}
.cd small{font-size:12px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.cd .ct{font-size:14px;font-weight:700;margin-top:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cds-st{position:absolute;top:-10px;right:-4px;font-size:30px;transform:rotate(10deg);text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.cdb{margin-left:auto;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);white-space:nowrap}
.card .when{flex-wrap:wrap}
.card:has(.sticker) .cdb{margin-right:34px}
.cdbig{display:flex;align-items:center;gap:12px;margin:14px 0 2px;padding:14px 16px;border-radius:18px;color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.cdbig b{font-size:46px;line-height:1;font-weight:900;letter-spacing:-.03em}
.cdbig span{font-size:17px;font-weight:800;display:flex;flex-direction:column}
.cdbig small{font-size:13px;font-weight:700;opacity:.9}
.p.cdp{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.sbcd{font-size:13px;color:var(--c);font-weight:900}
/* ---------- Notifications ---------- */
.tog{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.tog > span{width:24px;text-align:center}
.tog .sw{margin-left:auto;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tog.on .sw{background:var(--good)}
.tog.on .sw::after{transform:translateX(18px)}
.nudge{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 8px 8px 14px;margin:0 0 14px;font-weight:700;font-size:15px}
.nudge .ni{font-size:20px}
.nudge .nt{flex:1}
.nudge .pill.on{background:var(--accent);color:#fff}
.nudge .nx{color:var(--muted);padding:6px 8px}
@media (min-width:1200px){ .nudge{max-width:560px} }

/* ================= Larger screens ================= */
.side,.desk{display:none}
@media (hover:hover){
  .card[data-open],.row[data-open],.pin,.sbrow{cursor:pointer;transition:box-shadow .15s,transform .15s}
  .card[data-open]:hover,.row[data-open]:hover{box-shadow:0 2px 4px rgba(40,30,10,.08),0 10px 26px rgba(40,30,10,.10);transform:translateY(-1px)}
}

  .desk{display:inline-flex}

  .navs{gap:4px}

  /* sidebar */

  .brand img{width:36px;height:36px;border-radius:10px}
  .brand b{flex:1;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .newbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);margin-bottom:8px}
  .newbtn:hover{filter:brightness(1.05)}

  .snav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;font-weight:700;color:var(--muted)}
  .snav span{font-size:18px}
  .snav small{margin-left:auto;font-weight:700}

  .snav.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .shd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 6px 6px;display:flex;align-items:center}
  .shd .spacer{flex:1}
  .shd button{width:26px;height:26px;border-radius:8px;font-size:16px;color:var(--ink)}
  .shd button:hover{background:var(--soft)}
  .mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .mini .wd{font-size:11px;font-weight:800;color:var(--muted);padding:2px 0 4px}
  .mini button{position:relative;aspect-ratio:1;border-radius:50%;font-size:13px;font-weight:600;display:grid;place-items:center}
  .mini button:hover{background:var(--soft)}
  .mini button.out{color:color-mix(in srgb,var(--muted) 60%,transparent)}
  .mini button.inwk{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:8px}
  .mini button.today{color:var(--accent);font-weight:800}
  .mini button.sel{background:var(--accent);color:#fff;border-radius:50%}
  .mini button i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent);opacity:.7}
  .mini button.sel i{background:#fff}
  .sbrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;font-weight:600;width:100%;text-align:left}
  .sbrow:hover{background:var(--soft)}
  .sbrow.on{background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:0 0 0 1.5px var(--c) inset}
  .sbrow .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbrow small{color:var(--muted);font-weight:700}

  /* day view + coming up side by side (900–1199) */

  .lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 16px;align-items:start}
  .top.onlists .navs,.top.onlists .range{display:none!important}

  /* detail = right-hand panel */

  .sheet.on{transform:none}
  .sheet .bigsticker{top:22px}

  .composer.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}

/* ---------- Desktop Day / Week / Month views ---------- */
@media (min-width:900px){
  .viewsw{background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin-left:6px}
  .viewsw button{padding:6px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
  .viewsw button:hover{color:var(--ink)}
  .viewsw button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .top.onlists .viewsw{display:none!important}

  .chip{display:flex;align-items:center;gap:5px;width:100%;text-align:left;font-size:13px;font-weight:700;line-height:1.2;padding:2px 9px 2px 3px;margin:0 0 4px;border-radius:999px;
    background:color-mix(in srgb,var(--c) 17%,var(--card));color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 30%,transparent)}
  .chip .ce{flex:none;font-size:19px;line-height:1;width:24px;height:24px;display:grid;place-items:center;transform:rotate(-8deg);transition:transform .2s;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));text-shadow:1.5px 0 #fff,-1.5px 0 #fff,0 1.5px #fff,0 -1.5px #fff}
  .chip:hover .ce{transform:rotate(10deg) scale(1.2)}
  .chip .cx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.busy{padding-left:9px}
  .chip b{color:var(--c);font-weight:800}
  .chip small{color:var(--muted);font-weight:700}
  .chip:hover{background:color-mix(in srgb,var(--c) 26%,var(--card))}
  .chip.busy{background:repeating-linear-gradient(-45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px);color:var(--muted);cursor:default}
  .more{font-size:12px;font-weight:800;color:var(--muted);padding:1px 7px;border-radius:6px}
  .more:hover{color:var(--accent);background:var(--soft)}

  /* week */
  .wv{display:flex;flex-direction:column;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .wv-head,.wv-allrow{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
  .wv-dh{display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;gap:2px;border-left:1px solid var(--line)}
  .wv-dh span{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
  .wv-dh b{font-size:22px;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;letter-spacing:-.02em}
  .wv-dh:hover b{background:var(--soft)}
  .wv-dh.today span{color:var(--accent)}
  .wv-dh.today b{background:var(--accent);color:#fff}
  .wv-all{padding:5px 4px 2px;border-left:1px solid var(--line);min-height:34px;max-height:112px;overflow:hidden}
  .wv-alllbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
  .wv-all.today,.wv-col.today{background:color-mix(in srgb,var(--accent) 4%,transparent)}
  .wv-body{flex:1;overflow-y:auto;position:relative;scrollbar-width:thin}
  .wv-grid{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));position:relative}
  .wv-gut{position:relative}
  .wv-gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--muted)}
  .wv-col{position:relative;border-left:1px solid var(--line);cursor:copy;
    background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 52px)}
  .wv-ev{position:absolute;display:flex;flex-direction:column;align-items:flex-start;text-align:left;overflow:visible;padding:5px 8px;border-radius:12px;
    background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--card)),color-mix(in srgb,var(--c) 13%,var(--card)));
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent),0 2px 6px color-mix(in srgb,var(--c) 18%,transparent);cursor:pointer;z-index:1}
  .wv-ev .in{display:flex;flex-direction:column;min-width:0;max-width:100%;max-height:100%;overflow:hidden;padding-right:16px}
  .wv-ev .st{position:absolute;right:-7px;top:-10px;font-size:27px;line-height:1;z-index:2;transform:rotate(10deg);transition:transform .2s cubic-bezier(.3,1.6,.5,1);pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px -1.5px #fff,1.5px -1.5px #fff,-1.5px 1.5px #fff}
  .wv-ev:hover .st{transform:rotate(-8deg) scale(1.25)}
  .wv-ev.short .st{font-size:21px;top:50%;margin-top:-12px}
  .wv-ev.short{justify-content:center}
  .wv-ev.short .in{flex-direction:row;align-items:baseline;gap:6px;padding-right:18px}
  .wv-ev.short .t{white-space:nowrap;display:block;flex:0 1 auto}
  .wv-ev.short .tm{flex:0 0 auto}
  .wv-ev.short.narrow .tm{display:none}
  .wv-ev.narrow .st{font-size:20px;right:-6px;top:-9px}
  .wv-ev.narrow .in{padding-right:8px}
  .wv-col:last-child .wv-ev .st{right:-2px}
  .wv-ev:hover{background:color-mix(in srgb,var(--c) 28%,var(--card));z-index:3}
  .wv-ev .t{font-size:13px;font-weight:750;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .wv-ev .tm{font-size:11.5px;font-weight:650;color:color-mix(in srgb,var(--c) 70%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .wv-ev.short{flex-direction:row;align-items:center;gap:6px;padding:1px 7px}
  .wv-ev.short .t{-webkit-line-clamp:1;font-size:12px}
  .wv-ev.short .tm{font-size:11px}
  .wv-ev.narrow{padding:3px 5px}
  .wv-ev.narrow .t{font-size:12px;word-break:break-word}
  .wv-ev.busy{background:repeating-linear-gradient(-45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px);box-shadow:inset 3px 0 0 var(--c);cursor:default}
  .wv-ev.busy .t{color:var(--muted)}

  .wv-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef4444}

  /* month */
  .mv{display:flex;flex-direction:column;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .mv-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}

  .mv-grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(var(--weeks),minmax(0,1fr))}
  .mv-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;overflow:hidden;min-width:0;cursor:default}
  .mv-cell:nth-child(7n){border-right:0}
  .mv-cell.out{background:color-mix(in srgb,var(--soft) 45%,transparent)}
  .mv-cell.out .mv-dn{color:var(--muted)}
  .mv-cell.sel{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
  .mv-top{display:flex;align-items:center;margin-bottom:3px}
  .mv-dn{min-width:28px;height:28px;padding:0 6px;border-radius:14px;font-weight:750;font-size:14px}
  .mv-dn:hover{background:var(--soft)}
  .mv-cell.today .mv-dn{background:var(--accent);color:#fff}
  .mv-add{margin-left:auto;width:26px;height:26px;border-radius:8px;color:var(--muted);font-size:17px;opacity:0;transition:opacity .12s}
  .mv-cell:hover .mv-add{opacity:1}
  .mv-add:hover{background:var(--soft);color:var(--accent)}
}

/* ---------- Screensaver / wall display ---------- */
.ss{--bg:#151413;--card:#201e1c;--ink:#f3efe8;--muted:#9b958b;--line:#2e2b28;--soft:#2a2724;--pw:min(100vw,clamp(340px,28vw,440px));
  position:fixed;inset:0;z-index:300;background:#0c0b0a;color:var(--ink);overflow:hidden;cursor:none;user-select:none;-webkit-user-select:none;
  opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.ss.on{opacity:1;visibility:visible;transition:opacity .35s ease}
.ssp{position:absolute;top:0;bottom:0;left:0;width:var(--pw);z-index:2;background:var(--bg);box-shadow:0 0 44px rgba(0,0,0,.55);
  padding:calc(18px + var(--safe-t)) 16px 0;transform:translateX(calc((100vw - var(--pw)) / 2));transition:transform 1.05s cubic-bezier(.22,.8,.2,1),opacity 1s}
.ss.go .ssp{transform:none}
#ssPanelIn{height:100%;overflow:hidden;-webkit-mask-image:linear-gradient(#000 calc(100% - 64px),transparent);mask-image:linear-gradient(#000 calc(100% - 64px),transparent)}
.sss{position:absolute;top:0;bottom:0;left:var(--pw);right:0;background:#000;opacity:0;transition:opacity 1.1s ease .45s,filter 2s}
.ss.go .sss{opacity:1}

  return {h, m, mer: x[3] ? x[3][0] : null, sure: !!x[3] || !!x[2]};

// "+church" → the calendar you add to whose name (or a word in it) starts with that
function findCal(low){
  const w = (S.cals || []).filter(c => c.role === 'contributor'), flat = x => x.name.toLowerCase().replace(/\s+/g, '');

}
function eventsOn(d, src){
  const out = [];
  for(const e of (src || S.events)){
    if(!e.repeat){ if(e.starts_on === d) out.push(e); }
    else if(occursOn(e, d)) out.push({ ...e, starts_on:d, _occ:d });
  }
  return out;
}
const openAttr = v => `data-open="${v.id}"${v._occ ? ` data-occ="${v._occ}"` : ''}`;
function repeatLabel(e, short){
  if(!e || !e.repeat || !e.starts_on) return '';
  const ds = repDays(e).slice().sort((a, b) => a - b).map(i => DOW_SHORT[i]);
  const dl = ds.length > 2 ? ds.slice(0, -1).join(', ') + ' & ' + ds.at(-1) : ds.join(' & ');
  const n = nthOf(e.starts_on);
  let t = { daily:'Every day', weekdays:'Every weekday', weekly:`Every ${dl}`, biweekly:`Every other ${dl}`,
    monthly_date:`Monthly on the ${ordinal(+e.starts_on.slice(8, 10))}`, monthly_day:`Monthly on the ${n === 5 ? 'last' : ordinal(n)} ${DOW_SHORT[dowOf(e.starts_on)]}` }[e.repeat] || 'Repeats';
  if(!short && e.repeat_until) t += ` until ${shortDate(e.repeat_until)}`;
  return t;
}
function firstOcc(rep, base){                          // the first day on/after base that fits what was typed
  const ok = d => rep.days && rep.days.length ? rep.days.includes(dowOf(d))
    : rep.dom ? +d.slice(8, 10) === rep.dom
    : rep.nth ? dowOf(d) === rep.dow && (rep.nth === 5 ? isLastWd(d) : Math.ceil(+d.slice(8, 10) / 7) === rep.nth)
    : rep.repeat === 'weekdays' ? dowOf(d) > 0 && dowOf(d) < 6 : true;
  for(let i = 0; i < 400; i++){ const d = addDays(base, i); if(ok(d)) return d; }
  return base;
}
function icsRule(e){
  if(!e.repeat) return '';
  const days = repDays(e).map(i => DOW_ICS[i]).join(','), n = nthOf(e.starts_on);
  let r = { daily:'FREQ=DAILY', weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly:`FREQ=WEEKLY;BYDAY=${days}`, biweekly:`FREQ=WEEKLY;INTERVAL=2;BYDAY=${days}`,
    monthly_date:`FREQ=MONTHLY;BYMONTHDAY=${+e.starts_on.slice(8, 10)}`, monthly_day:`FREQ=MONTHLY;BYDAY=${n === 5 ? -1 : n}${DOW_ICS[dowOf(e.starts_on)]}` }[e.repeat];
  if(e.repeat_until) r += `;UNTIL=${e.repeat_until.replace(/-/g, '')}T235959`;
  return `RRULE:${r}\r\n`;
}

    const r = db.cm.find(x => x.family_id === a.cal && x.member_id === a.id && !x.removed_at);

    async addSticker(c){ db.custom = db.custom||[]; const f = c.family_id; const x = db.custom.find(y => y.emoji===c.emoji && (y.family_id || 'f1') === f);
      if(x) Object.assign(x, c); else db.custom.push({id:uid(), ...c, created_at:new Date().toISOString()}); save(); },
    async deleteSticker(id){ db.custom = (db.custom||[]).filter(x => x.id!==id); save(); },
    async patchEvent(id, patch){ Object.assign(db.events.find(x => x.id === id), patch); save(); },
    async saveEvent(ev){
      if(ev.id){ const i = db.events.findIndex(x => x.id===ev.id); const moved = ev.family_id && ev.family_id !== db.events[i].family_id;
        db.events[i] = {...db.events[i], ...ev};
        if(moved) ['items','rsvps','reactions'].forEach(k => db[k].forEach(x => { if(x.event_id === ev.id) x.family_id = ev.family_id; })); }
      else { ev = {...ev, id:uid(), family_id:ev.family_id || db.cals[0].id, owner_id:db.meId, created_at:new Date().toISOString()}; db.events.push(ev); }
      save(); return ev;
    },
    async deleteEvent(id){ db.events = db.events.filter(e => e.id!==id && e.series_id!==id); ['items','rsvps','reactions'].forEach(k => db[k] = db[k].filter(x => x.event_id!==id)); save(); },
    async addItems(eid, texts){ const base = Date.now(); texts.forEach((t,k) => db.items.push({id:uid(), event_id:eid, family_id:evCal(eid), text:t, done:false, done_by:null, position:base+k})); save(); },
    async setItem(id, patch){ const it = db.items.find(i => i.id===id); if(it) Object.assign(it, patch); save(); },
    async deleteItem(id){ db.items = db.items.filter(i => i.id!==id); save(); },
    async setRsvp(eid, status){ db.rsvps = db.rsvps.filter(r => !(r.event_id===eid && r.member_id===db.meId)); if(status) db.rsvps.push({event_id:eid, member_id:db.meId, family_id:evCal(eid), status}); save(); },
    async setReaction(eid, st, on){ db.reactions = db.reactions.filter(r => !(r.event_id===eid && r.member_id===db.meId && r.sticker===st)); if(on) db.reactions.push({event_id:eid, member_id:db.meId, family_id:evCal(eid), sticker:st}); save(); },
    async updateMe(p){ Object.assign(db.members.find(m => m.id===db.meId), p); save(); },
    async updateCalendar(calId, p){ Object.assign(db.cals.find(c => c.id === calId), p); save(); },     // time zone, featured list
    async setCalPrefs(calId, p){ Object.assign(row(calId, db.meId), p); save(); },                       // your color, show / hide
    async createCalendar(c){ const id = uid(); db.cals.push({id, name:c.name, emoji:c.emoji || '📅', color:c.color || CAL_COLORS[db.cals.length % 8], code:code6(), allow_join:true, featured_list:null});
      db.cm.push({family_id:id, member_id:db.meId, role:'contributor', is_admin:true, color:null, shown:true, removed_at:null}); save(); return { family_id:id }; },
    async joinCalendar(code){ const c = db.cals.find(x => x.code === code.toUpperCase().trim()); if(!c) throw new Error('Calendar code not found');
      const r = row(c.id, db.meId); if(r && r.removed_at) throw new Error('An admin took you off this calendar. Ask them to add you back.');
      if(r) r.role = 'contributor'; else db.cm.push({family_id:c.id, member_id:db.meId, role:'contributor', is_admin:false, color:null, shown:true, removed_at:null}); save(); return { family_id:c.id, name:c.name }; },
    async leaveCalendar(calId){ const r = row(calId, db.meId);
      if(r.is_admin && !db.cm.some(x => x.family_id === calId && x.is_admin && !x.removed_at && x.member_id !== db.meId))
        throw new Error(db.cm.some(x => x.family_id === calId && !x.removed_at && x.member_id !== db.meId) ? 'Make someone else an admin first' : 'You’re the only one on it. Delete the calendar instead.');
      Object.assign(r, {removed_at:new Date().toISOString(), is_admin:false}); save(); },
    async linkPreview(){ return null; },
    // demo has no PINs: any 4–6 digits unlock admin; the same safety rules as the database apply
    async adminVerify(a){ demoAdmin(a); },
    async addMember(m, a){ demoAdmin(a); const id = uid(); db.members.push({id, name:m.name, emoji:m.emoji, color:m.color}); db.cm.push({family_id:a.cal, member_id:id, role:'contributor', is_admin:false, color:null, shown:true, removed_at:null}); save(); },
    async addExisting(mid, role, a){ demoAdmin(a); const r = row(a.cal, mid); if(r && !r.removed_at) throw new Error('Already on this calendar');
      if(r) Object.assign(r, {removed_at:null, role, is_admin:false}); else db.cm.push({family_id:a.cal, member_id:mid, role, is_admin:false, color:null, shown:true, removed_at:null}); save(); },
    async removeMember(id, a){ demoAdmin(a); const r = row(a.cal, id);
      if(id === db.meId) throw new Error('This device is signed in as that person. Sign in as someone else first.');
      if(r.is_admin && db.cm.filter(x => x.family_id === a.cal && x.is_admin && !x.removed_at).length <= 1) throw new Error('Make someone else an admin first');
      Object.assign(r, {removed_at:new Date().toISOString(), is_admin:false}); save(); },
    async restoreMember(id, pin, a){ demoAdmin(a); row(a.cal, id).removed_at = null; save(); },
    async setAdmin(id, on, a){ demoAdmin(a); const r = row(a.cal, id);
      if(on && r.role !== 'contributor') throw new Error('Viewers can’t be admins. Let them add things first.');
      if(!on && !db.cm.some(x => x.family_id === a.cal && x.is_admin && !x.removed_at && x.member_id !== id)) throw new Error('The calendar needs at least one admin');
      r.is_admin = on; save(); },
    async setRole(id, role, a){ demoAdmin(a); const r = row(a.cal, id); if(role === 'viewer' && r.is_admin) throw new Error('Take away admin first'); r.role = role; save(); },
    async setAllowJoin(on, a){ demoAdmin(a); db.cals.find(c => c.id === a.cal).allow_join = on; save(); },
    async newCode(a){ demoAdmin(a); const c = db.cals.find(x => x.id === a.cal); c.code = code6(); save(); return c.code; },
    async updateCal(p, a){ demoAdmin(a); Object.assign(db.cals.find(c => c.id === a.cal), p); save(); },
    async deleteCal(a){ demoAdmin(a); db.cals = db.cals.filter(c => c.id !== a.cal); db.cm = db.cm.filter(r => r.family_id !== a.cal); db.events = db.events.filter(e => e.family_id !== a.cal); save(); },
    async createLink(label, days, a){ demoAdmin(a); const token = 'demo' + code6(); db.links.push({id:uid(), family_id:a.cal, token, label, expires_at: days > 0 ? new Date(Date.now() + days * 864e5).toISOString() : null, disabled:false, created_at:new Date().toISOString()}); save(); return token; },
    async listLinks(a){ demoAdmin(a); return db.links.filter(l => l.family_id === a.cal).map(l => ({...l, viewers:[]})).reverse(); },
    async setLink(id, on, a){ demoAdmin(a); db.links.find(l => l.id === id).disabled = !on; save(); },
    async switchMember(id){ db.meId = id; save(); },
    async reset(){ localStorage.removeItem(KEY); },
    notify(){},
    subscribe(){},
  };
}

/* Where shared photos are stored. Everything that touches the storage service goes through these three
   calls, so the photos could move to another provider (e.g. Cloudflare R2) without changing the rest of the app. */
const PHOTO_BUCKET = 'famcal-media';
const PHOTO_STORE = {
  async put(sb, path, blob){ const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:false, cacheControl:'31536000' }); if(error) throw new Error(error.message); },
  async links(sb, paths){                 // short-lived private links (1 hour); the bucket is never public
    if(!paths.length) return {};
    const { data, error } = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths, 3600); if(error) throw new Error(error.message);
    const out = {}; (data || []).forEach(x => { if(x.signedUrl) out[x.path] = x.signedUrl; }); return out;
  },
  async remove(sb, paths){ const { error } = await sb.storage.from(PHOTO_BUCKET).remove(paths); if(error) throw new Error(error.message); },
};
function adminOk(r){                         // admin functions answer {ok, error} so a wrong PIN still counts toward the lock
  if(r && r.ok) return r;
  const msg = (r && r.error) || 'Run the latest schema.sql in Supabase to use admin settings';
  throw Object.assign(new Error(msg), { pin: /Wrong PIN|Too many|Only a calendar admin|not on that calendar/.test(msg) });
}
async function fnError(err){ try{ const j = await err.context.json(); return j.error || err.message; }catch(e){ return err.message || 'Notification service unavailable'; } }
function SupaBackend(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db:{ schema:SCHEMA }, auth:{ persistSession:true, autoRefreshToken:true } });
  let meId = null;
  const evCal = eid => S.evAll.find(e => e.id === eid)?.family_id;          // every row is filed under its event's calendar
  const ok = ({data, error}) => { if(error) throw new Error(error.message); return data; };
  const rpc = async (fn, args) => ok(await sb.rpc(fn, args));
  return {
    mode:'supabase',
    async start(){
      const { data:{ session } } = await sb.auth.getSession();
      if(!session) ok(await sb.auth.signInAnonymously());
      const d = ok(await sb.from('devices').select('member_id').maybeSingle());
      meId = d?.member_id || null; return meId;
    },
    preview: code => rpc('family_preview', {p_code:code}),
    async createFamily(f){ const r = await rpc('create_family', {p_family:f.family, p_name:f.name, p_emoji:f.emoji, p_color:f.color, p_pin:f.pin}); meId = r.member_id; return r; },
    async join(f){ const r = await rpc('join_family', {p_code:f.code, p_name:f.name, p_emoji:f.emoji, p_color:f.color, p_pin:f.pin}); meId = r.member_id; return r; },
    async claim(code, mid, pin){ const r = await rpc('claim_member', {p_code:code, p_member:mid, p_pin:pin}); if(!r.ok) throw new Error(r.error); meId = r.member_id; return r; },
    async load(){
      const since = addDays(todayStr(), -60);
      const cr = await sb.rpc('my_calendars');
      if(cr.error) throw new Error(/my_calendars/.test(cr.error.message) ? 'Run the latest schema.sql in Supabase (calendars update)' : cr.error.message);
      const [cm, members, events, items, rsvps, reactions, privs] = await Promise.all([
        sb.from('cal_members').select('*'),
        sb.from('members').select('*').order('created_at'),
        sb.from('events').select('*').or(`starts_on.is.null,starts_on.gte.${since}`),
        sb.from('list_items').select('*'),
        sb.from('rsvps').select('*'),
        sb.from('reactions').select('*'),
        sb.from('event_private').select('*'),
      ]).then(rs => rs.map(ok));
      const cs = await sb.from('custom_stickers').select('*').order('created_at');   // optional table: app works without it
      const md = await sb.from('media').select('*').order('added_at');                 // optional table: shared photos
      const pc = await sb.from('media_comments').select('*').order('created_at');      // optional table: photo comments
      const privates = {}; (privs||[]).forEach(p => privates[p.event_id] = p);
      return { cals:cr.data || [], cm, members, meId,
        events: events.map(e => ({...e, start_time:hhmm(e.start_time), end_time:hhmm(e.end_time), invitees:e.invitees||[]})),
        items, rsvps, reactions, privates, custom: cs.error ? [] : cs.data, customMissing: !!cs.error, media: md.error ? null : md.data, photoNotes: pc.error ? [] : pc.data };
    },
    async addSticker(c){ ok(await sb.from('custom_stickers').upsert({family_id:c.family_id, created_by:meId, emoji:c.emoji, keywords:c.keywords}, {onConflict:'family_id,emoji'})); },
    async deleteSticker(id){ ok(await sb.from('custom_stickers').delete().eq('id', id)); },
    // ---- shared photos: database row + file in the private bucket (file access only via PHOTO_STORE) ----
    async addPhoto(p){
      const path = `${p.cal}/${p.id}.jpg`;                                  // each calendar's album is its own folder
      await PHOTO_STORE.put(sb, path, p.blob);
      try{ ok(await sb.from('media').insert({id:p.id, family_id:p.cal, uploaded_by:meId, path, sha256:p.sha256, bytes:p.blob.size, width:p.width, height:p.height})); }
      catch(e){ PHOTO_STORE.remove(sb, [path]).catch(()=>{}); throw e; }        // no orphan files when the row is refused (cap, duplicate)
    },
    async addPhotoComment(mediaId, body){ ok(await sb.from('media_comments').insert({media_id:mediaId, family_id:S.media.find(m => m.id === mediaId)?.family_id, author_id:meId, body})); },
    async deletePhotoComment(id){ ok(await sb.from('media_comments').delete().eq('id', id)); },
    async removePhoto(row){ ok(await sb.from('media').delete().eq('id', row.id)); await PHOTO_STORE.remove(sb, [row.path]).catch(()=>{}); },
    photoLinks: paths => PHOTO_STORE.links(sb, paths),
    async saveEvent(ev){
      const priv = ev.kind === 'private' || !!ev.is_private;
      const row = { kind:ev.kind, title:priv?null:ev.title, notes:priv?null:ev.notes, place:priv?null:ev.place, sticker:priv?null:ev.sticker,
        starts_on:ev.starts_on, start_time:ev.start_time, end_time:ev.end_time, invitees:ev.invitees||[], countdown:!!ev.countdown, ...(ev.family_id ? {family_id:ev.family_id} : {}), ...(ev.is_private ? {is_private:true} : (ev.id ? {is_private:false} : {})), updated_at:new Date().toISOString(),
        ...(ev.repeat || ev.clearRepeat ? { repeat:ev.repeat || null, repeat_days:ev.repeat_days || null, repeat_until:ev.repeat_until || null } : {}),
        ...(ev.series_id ? { series_id:ev.series_id, series_date:ev.series_date } : {}) };
      let id = ev.id;
      const write = r => id ? sb.from('events').update(r).eq('id', id) : sb.from('events').insert({...r, owner_id:meId}).select('id').single();
      let res = await write(row);
      if(res.error && /is_private|private_has_no_details/.test(res.error.message)) throw new Error('Run the latest schema.sql in Supabase to use private lists');
      if(res.error && /repeat|series_/.test(res.error.message)) throw new Error('Run the latest schema.sql in Supabase to use repeating events');
      if(res.error && /countdown/.test(res.error.message)){   // database not updated yet: save without it
        const {countdown, ...rest} = row; res = await write(rest);
        toast('⚠️ Run the latest schema.sql in Supabase to save countdowns');
      }
      const saved = ok(res); if(!id) id = saved.id;
      if(priv) ok(await sb.from('event_private').upsert({event_id:id, owner_id:meId, title:ev.title, notes:ev.notes, place:ev.place, sticker:ev.sticker}));
      else if(ev.id) ok(await sb.from('event_private').delete().eq('event_id', id));
      return {...ev, id};
    },
    async deleteEvent(id){ ok(await sb.from('events').delete().eq('id', id)); },
    async patchEvent(id, patch){ const r = await sb.from('events').update(patch).eq('id', id); if(r.error && /repeat/.test(r.error.message)) throw new Error('Run the latest schema.sql in Supabase to use repeating events'); ok(r); },
    async addItems(eid, texts){ const base = Date.now()/1000; ok(await sb.from('list_items').insert(texts.map((t,k) => ({event_id:eid, family_id:evCal(eid), text:t, position:base + k/1000})))); },

    // ---- admin: every call names the calendar and carries an admin's id + PIN; the database checks it each time ----

    subscribe(onChange){
      const ch = sb.channel('famcal-live');
      ['events','event_private','list_items','rsvps','reactions','members','families','cal_members','custom_stickers','media','media_comments'].forEach(t =>
        ch.on('postgres_changes', {event:'*', schema:SCHEMA, table:t}, onChange));

async function refresh(){
  const d = await B.load();
  Object.assign(S, { cals:d.cals || [], cm:d.cm || [], allMembers:d.members, evAll:d.events, items:d.items, rsvps:d.rsvps, reactions:d.reactions, privates:d.privates,
    custom:(d.custom||[]).map(c => ({...c, words:(c.keywords||'').split(',').map(w => w.trim()).filter(Boolean)})), customMissing:!!d.customMissing,
    media:d.media || [], mediaMissing: !d.media, photoNotes:d.photoNotes || [] });
  NICKS.clear(); S.cm.forEach(r => r.nickname && NICKS.add(r.nickname));
  S.me = (S.allMembers || []).find(m => m.id === d.meId);
  if(!S.me) throw new Error('not-member');
  S.family = S.cals[0] || null;                          // older single-calendar code paths
  applyView();
  render();
  if(S.openId) S.events.some(e => e.id===S.openId) ? openDetail(S.openId, true) : closeSheet();
  photoSyncSoon();
}
let rT; const liveRefresh = () => { clearTimeout(rT); rT = setTimeout(() => refresh().catch(e => { if(e.message === 'not-member') location.reload(); }), 250); };   // removed from the family → back to the sign-in screen

const mqDesk = matchMedia('(min-width:900px)'), mqWide = matchMedia('(min-width:1200px)');
const isDesk = () => mqDesk.matches, isWide = () => mqWide.matches;
let cardMax = 6;
function render(){ renderTop(); renderMain(); renderSide(); ssRefresh(); penRender(); }
const weekStart = d => addDays(d, -parseYmd(d).getDay());
// Desktop calendar view: 'day' | 'week' | 'month' (remembered per browser)
S.view = (() => { try{ const v = localStorage.getItem('famcal-view'); return ['day','week','month'].includes(v) ? v : 'week'; }catch(e){ return 'week'; } })();
function setView(v){ S.view = v; try{ localStorage.setItem('famcal-view', v); }catch(e){} S.gridScroll = null; if(S.tab !== 'cal') setTab('cal'); else render(); }
const deskView = () => isDesk() && S.tab === 'cal' ? S.view : null;
function rangeLabel(){
  const v = deskView(); if(!v) return '';
  const f = (d, o) => d.toLocaleDateString(undefined, o);
  if(v === 'day') return f(parseYmd(S.sel), {weekday:'long', month:'short', day:'numeric'});
  if(v === 'month') return '';
  const a = parseYmd(weekStart(S.sel)), b = parseYmd(addDays(weekStart(S.sel), 6));
  return a.getMonth() === b.getMonth() ? `${f(a,{month:'short'})} ${a.getDate()} – ${b.getDate()}` : `${f(a,{month:'short',day:'numeric'})} – ${f(b,{month:'short',day:'numeric'})}`;
}
function inRange(d){
  const v = deskView();
  if(v === 'week') return d >= weekStart(S.sel) && d <= addDays(weekStart(S.sel), 6);
  if(v === 'month') return d.slice(0,7) === S.sel.slice(0,7);
  return d === S.sel;
}

function renderSide(){
  const el = $('#side');
  if(!isDesk() || !S.me){ el.innerHTML = ''; return; }
  const sel = parseYmd(S.sel), t = todayStr();
  const first = new Date(sel.getFullYear(), sel.getMonth(), 1), gs = addDays(ymd(first), -first.getDay());
  const ws = weekStart(S.sel), we = addDays(ws, 6);
  let mini = ['S','M','T','W','T','F','S'].map(d => `<span class="wd">${d}</span>`).join('');
  for(let i=0;i<42;i++){
    const d = addDays(gs, i), dt = parseYmd(d);
    if(i === 35 && dt.getMonth() !== sel.getMonth()) break;
    const cls = [dt.getMonth() !== sel.getMonth() ? 'out' : '', d === t ? 'today' : '', d === S.sel && S.tab==='cal' ? 'sel' : '',
                 deskView()==='week' && d >= ws && d <= we ? 'inwk' : ''].join(' ');
    mini += `<button class="${cls}" data-day="${d}">${dt.getDate()}${dayEvents(d).length ? '<i></i>' : ''}</button>`;
  }
  const lists = S.events.filter(e => e.kind==='list' && passesFilter(e) && (!e.starts_on || e.starts_on >= addDays(t,-7))).map(view)
    .sort((a,b) => (a.starts_on ? 1 : 0) - (b.starts_on ? 1 : 0) || String(a.starts_on).localeCompare(String(b.starts_on)));
  el.innerHTML = `
    <div class="brand"><img src="${APP_ICON}" alt="">${multiCal() ? '' : `<b>${esc(S.cals[0]?.name || 'Calendar')}</b>`}${sharedPhotos() ? '<button class="gear" data-photos aria-label="Family photos" title="Family photos">🖼️</button>' : ''}<button class="gear" data-settings aria-label="Settings" title="Settings">⚙️</button><button data-me aria-label="Me" title="You">${avatar(S.me)}</button></div>
    ${writableCals().length ? '<button class="newbtn" data-new>＋ New <kbd>N</kbd></button>' : ''}
    <button class="snav ${S.tab==='cal'?'on':''}" data-tab="cal"><span>📅</span>Calendar</button>
    <button class="snav ${S.tab==='lists'?'on':''}" data-tab="lists"><span>☑️</span>Lists<small>${lists.length || ''}</small></button>
    <div class="shd">${esc(sel.toLocaleDateString(undefined,{month:'long', year:'numeric'}))}<span class="spacer"></span><button data-mnav="-1" aria-label="Previous month">‹</button><button data-mnav="1" aria-label="Next month">›</button></div>
    <div class="mini">${mini}</div>
    ${S.tab === 'cal' ? featuredLists().map(e => `<div class="sfeat">${featuredCard(10, e)}</div>`).join('') : ''}
    ${(() => { const cds = countdowns(); return cds.length ? `<div class="shd">Countdowns</div>${cds.slice(0,6).map(e => { const n = daysUntil(e.starts_on);
      return `<button class="sbrow" data-open="${e.id}"><span class="ls">${esc(e.sticker||'⏳')}</span><span class="grow">${esc(e.title)}</span><b class="sbcd" style="--c:${esc(evColor(e))}">${n === 0 ? '🎉' : n + 'd'}</b></button>`; }).join('')}` : ''; })()}
    ${multiCal() ? `<div class="shd">Calendars</div>${S.cals.map(c => `<div class="sbrow calside" style="--c:${esc(calColor(c.id))}"><button class="sbtog ${calShown(c.id) ? 'shown' : ''}" data-calchip="${c.id}" aria-pressed="${c.shown !== false}" title="Show / hide"><i class="cdot"></i></button><button class="grow sbname" data-calsheet="${c.id}">${esc(c.emoji || '📅')} ${esc(c.name)}${c.role === 'viewer' ? ' <small>👀</small>' : ''}</button></div>`).join('')}` : ''}
    ${S.members.length > 1 ? `<div class="shd">People${S.filter.size ? '<span class="spacer"></span><button data-clearfilter style="width:auto;padding:0 6px;font-size:12px;color:var(--accent)">Show all</button>' : ''}</div>
      ${S.members.map(m => `<button class="sbrow ${S.filter.has(m.id)?'on':''}" style="--c:${esc(m.color)}" data-filter="${m.id}">${avatar(m,'sm')}<span class="grow">${esc(m.name)}${m.id===S.me.id?' <small>(you)</small>':''}</span></button>`).join('')}` : ''}

      return `<button class="sbrow" data-open="${e.id}"><span class="ls">${esc(e.sticker||'☑️')}</span><span class="grow">${esc(e.title)}${isFeatured(e) ? ' ⭐' : ''}</span><small>${left ? left+' left' : '✓'}</small></button>`; }).join('')}` : ''}
    <div class="sfoot"><kbd>N</kbd> new · <kbd>D</kbd><kbd>W</kbd><kbd>M</kbd> day/week/month · <kbd>←</kbd><kbd>→</kbd> move · <kbd>T</kbd> today · <kbd>S</kbd> screensaver</div>`;

function renderTop(){
  const sel = parseYmd(S.sel);
  $('#monthTxt').textContent = sel.toLocaleDateString(undefined, {month:'long'}) + (sel.getFullYear() !== new Date().getFullYear() ? ' ' + sel.getFullYear() : '');
  $('#jump').value = S.sel;
  $('#meBtn').innerHTML = avatar(S.me);
  $('#photoBtn').classList.toggle('hidden', !sharedPhotos());
  $('#todayBtn').classList.toggle('hidden', inRange(todayStr()));
  document.querySelectorAll('.viewsw button').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  $('#rangeTxt').textContent = rangeLabel();
  document.querySelector('.top').classList.toggle('onlists', S.tab === 'lists');
  const start = addDays(S.sel, -sel.getDay()), t = todayStr();
  let w = '';
  for(let i=0;i<7;i++){
    const d = addDays(start, i), dt = parseYmd(d);
    const cols = [...new Set(dayEvents(d).map(evColor))].slice(0,3);
    w += `<button class="day ${d===S.sel?'sel':''} ${d===t?'today':''}" data-day="${d}">
      <span class="dw">${dt.toLocaleDateString(undefined,{weekday:'narrow'})}</span><span class="dn">${dt.getDate()}</span>
      <span class="dots">${cols.map(c => `<i style="--c:${c}"></i>`).join('')}</span></button>`;
  }
  $('#week').innerHTML = w;
  $('#week').classList.toggle('hidden', S.tab !== 'cal');

    `<button class="fchip calchip ${calShown(c.id) ? 'shown' : ''}" style="--c:${esc(calColor(c.id))}" data-calchip="${c.id}" aria-pressed="${calShown(c.id)}"><i class="cdot"></i>${esc(c.emoji || '📅')} ${esc(c.name)}</button>`).join('') + '<span class="fsep"></span>' : '')
    + (S.members.length > 1 ? S.members.map(m =>
    `<button class="fchip ${S.filter.has(m.id)?'on':''}" style="--c:${esc(m.color)}" data-filter="${m.id}">${avatar(m)}${esc(firstName(shownName(m)))}</button>`).join('') : '');

const noCalHTML = () => `<div class="nocal"><span class="big">📅</span><h2>You’re not on a calendar yet</h2>

  cardMax = 6;

  if(S.tab === 'cal'){
    h += pushNudge();

      const pins = S.events.filter(e => e.kind==='list' && !e.starts_on && passesFilter(e) && !isFeatured(e)).map(view);
      if(pins.length) h += `<div class="pinned">${pins.map(e => { const it = itemsOf(e.id), left = it.filter(i=>!i.done).length;
        return `<button class="pin" data-open="${e.id}">${esc(e.sticker||'☑️')} ${esc(e.title)} <small>${left ? left+' left' : 'done ✓'}</small></button>`; }).join('')}</div>`;
    }

    h += dayList(S.sel, `<div class="empty"><span class="big">🌤️</span>Nothing planned.<br>

    h += featuredLists().map(e => `<div class="featslot">${featuredCard(8, e)}</div>`).join('');      // featured lists sit between the day and what's coming up
    const up = [];

    if(up.length) h += `<div class="sub">Coming up</div>` + up.map(rowHTML).join('');
  } else {
    const lists = S.events.filter(e => e.kind==='list' && passesFilter(e) && (!e.starts_on || e.starts_on >= addDays(todayStr(),-7)))
      .sort((a,b) => (a.starts_on ? 1 : 0) - (b.starts_on ? 1 : 0) || String(a.starts_on).localeCompare(String(b.starts_on)));

function countdownStrip(){
  const cds = countdowns(); if(!cds.length) return '';
  return `<div class="cds">${cds.map(e => { const n = daysUntil(e.starts_on);
    return `<button class="cd" style="--c:${esc(evColor(e))}" data-open="${e.id}">${e.sticker ? `<span class="cds-st">${esc(e.sticker)}</span>` : ''}
      ${n === 0 ? '<b>🎉</b><small>Today!</small>' : `<b>${n}</b><small>day${n>1?'s':''} to go</small>`}<span class="ct">${esc(e.title)}</span></button>`; }).join('')}</div>`;
}
function renderDesk(){
  let h = '';
  const empty = `<div class="empty"><span class="big">🌤️</span>Nothing planned.<br><button class="try" data-try="Pizza night 6pm @everyone">Try “Pizza night 6pm @everyone” 🍕</button></div>`;
  if(S.tab === 'lists'){
    cardMax = 12;
    const lists = S.events.filter(e => e.kind==='list' && passesFilter(e) && (!e.starts_on || e.starts_on >= addDays(todayStr(),-7)))
      .sort((a,b) => (a.starts_on ? 1 : 0) - (b.starts_on ? 1 : 0) || String(a.starts_on).localeCompare(String(b.starts_on)));
    h += `<div class="dayhead"><h2>Lists</h2><span>${lists.length}</span></div>`;
    h += lists.length ? `<div class="lists-grid">${lists.map(e => card(e)).join('')}</div>` : `<div class="empty"><span class="big">🛒</span>No lists yet.<br><button class="try" data-try="Groceries: milk, eggs, bread" data-kind="list">Try “Groceries: milk, eggs, bread”</button></div>`;
  } else if(S.view === 'week'){
    $('#main').innerHTML = pushNudge() + weekGrid(); fitCal(); restoreGridScroll(); return;
  } else if(S.view === 'month'){
    $('#main').innerHTML = pushNudge() + monthGrid(); fitCal(); return;
  } else {
    cardMax = 8;
    h += pushNudge() + countdownStrip();
    const evs = dayEvents(S.sel), up = [];
    for(let i=1; i<=30 && up.length<12; i++) dayEvents(addDays(S.sel,i)).forEach(e => up.length<12 && up.push(e));
    h += `<div class="split"><div><div class="dayhead"><h2>${dayLabel(S.sel)}</h2><span>${shortDate(S.sel)}</span>${wxDayTag(S.sel)}</div>${dayList(S.sel, empty)}</div>
      <div><div class="sub">Coming up</div>${up.length ? up.map(rowHTML).join('') : '<p style="color:var(--muted)">Nothing else on the calendar yet.</p>'}</div></div>`;
  }
  $('#main').innerHTML = h;

/* ---------- Week view: time grid ---------- */
const HOUR_PX = 52;
const tMin = t => t ? +t.slice(0,2) * 60 + +t.slice(3,5) : null;
function layoutDay(evs){
  // place overlapping timed events side by side
  const items = evs.map(e => { const s = tMin(e.start_time), en = e.end_time && tMin(e.end_time) > s ? tMin(e.end_time) : s + 60; return {e, s, en}; })
    .sort((a,b) => a.s - b.s || b.en - a.en);
  let group = [], groupEnd = -1; const out = [];
  const flush = () => { const lanes = []; group.forEach(it => { let l = lanes.findIndex(end => end <= it.s); if(l < 0){ l = lanes.length; lanes.push(0); } lanes[l] = it.en; it.lane = l; });
    group.forEach(it => { it.lanes = lanes.length; out.push(it); }); group = []; };
  items.forEach(it => { if(it.s >= groupEnd && group.length) flush(); group.push(it); groupEnd = Math.max(groupEnd, it.en); });
  if(group.length) flush();
  return out;
}

}
function weekGrid(){

    const blocks = layoutDay(evs.filter(e => e.start_time)).map(({e, s, en, lane, lanes}) => {

}

/* ========================= Weather (Open-Meteo: free, no account, no key) =========================
   Per device: uses the device's location when it's been allowed, otherwise a chosen city, otherwise Kohler, WI. */
const WX_HOME = { name:'Kohler, WI', lat:43.7397, lon:-87.7815 };
const WX = { data:null, key:'', busy:false };
function wxCfg(){ let c = {}; try{ c = JSON.parse(localStorage.getItem('famcal-wx') || '{}'); }catch(e){} return { on:true, unit:'F', mode:'auto', place:WX_HOME, geo:null, ...c }; }

function wxWhere(){ const c = wxCfg(); return c.mode === 'auto' && c.geo ? { name:'Your location', lat:c.geo.lat, lon:c.geo.lon, here:true } : c.place || WX_HOME; }
const WX_CODES = [[[0], '☀️', 'Clear'], [[1], '🌤️', 'Mostly clear'], [[2], '⛅', 'Partly cloudy'], [[3], '☁️', 'Cloudy'], [[45, 48], '🌫️', 'Fog'],
  [[51, 53, 55, 56, 57], '🌦️', 'Drizzle'], [[61, 63, 65, 66, 67], '🌧️', 'Rain'], [[71, 73, 75, 77], '🌨️', 'Snow'], [[80, 81, 82], '🌦️', 'Showers'],
  [[85, 86], '🌨️', 'Snow showers'], [[95, 96, 99], '⛈️', 'Thunderstorms']];
function wxIcon(code, night){ const r = WX_CODES.find(x => x[0].includes(code)); const i = r ? r[1] : '🌡️'; return night && (code === 0 || code === 1) ? (code === 0 ? '🌙' : '☁️') : i; }
const wxWord = code => (WX_CODES.find(x => x[0].includes(code)) || [0, 0, ''])[2];
const deg = t => t == null ? '' : Math.round(t) + '°';
function wxDay(d){ const w = WX.data; if(!wxCfg().on || !w) return null; const i = w.daily.time.indexOf(d); if(i < 0) return null;
  return { code:w.daily.weather_code[i], hi:w.daily.temperature_2m_max[i], lo:w.daily.temperature_2m_min[i], pop:w.daily.precipitation_probability_max[i] }; }
function wxAt(d, hm){ const w = WX.data; if(!wxCfg().on || !w || !hm) return null; const i = w.hourly.time.indexOf(`${d}T${hm.slice(0, 2)}:00`); if(i < 0) return null;
  const h = +hm.slice(0, 2); return { code:w.hourly.weather_code[i], t:w.hourly.temperature_2m[i], pop:w.hourly.precipitation_probability[i], night:h < 6 || h >= 18 }; }
function wxNow(){ const w = WX.data; return wxCfg().on && w && w.current ? { code:w.current.weather_code, t:w.current.temperature_2m, night:!w.current.is_day } : null; }
const wxDayTag = d => { const x = wxDay(d); return x ? `<span class="wxd" title="${esc(wxWord(x.code))}">${wxIcon(x.code)} ${deg(x.hi)}<small> / ${deg(x.lo)}</small>${x.pop >= 40 ? `<small> 💧${x.pop}%</small>` : ''}</span>` : ''; };
function wxEventTag(e){                                 // a small forecast on timed events in the next week
  if(!e.starts_on || !e.start_time || e.starts_on < todayStr() || e.starts_on > addDays(todayStr(), 7) || isOver(e)) return '';
  const x = wxAt(e.starts_on, e.start_time); if(!x) return '';

async function wxLoad(force){
  const c = wxCfg(); if(!c.on || WX.busy) return;
  const at = wxWhere(), key = `${at.lat.toFixed(2)},${at.lon.toFixed(2)},${c.unit}`;
  if(!force && WX.data && WX.key === key && Date.now() - WX.data._at < 30 * 60000) return;
  if(!WX.data){ try{ const k = JSON.parse(localStorage.getItem('famcal-wxc') || 'null'); if(k && k.key === key){ WX.data = k.data; WX.key = key; wxPaint(); } }catch(e){} }
  WX.busy = true;
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${at.lat}&longitude=${at.lon}&current=temperature_2m,weather_code,is_day`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m,weather_code,precipitation_probability`
      + `&temperature_unit=${c.unit === 'C' ? 'celsius' : 'fahrenheit'}&timezone=auto&forecast_days=14`;
    const r = await fetch(u); if(!r.ok) throw new Error('weather ' + r.status);
    const d = await r.json(); d._at = Date.now();
    WX.data = d; WX.key = key;
    try{ localStorage.setItem('famcal-wxc', JSON.stringify({ key, data:d })); }catch(e){}
    wxPaint();
  }catch(e){ /* offline: keep whatever forecast we had */ }
  finally{ WX.busy = false; }
}

}

// Today's events that have already ended (or, with no end time, started over an hour ago). All-day ones never count.
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function isOver(e, hm = nowHM()){
  if(e.starts_on !== todayStr() || !e.start_time || e.kind === 'list') return false;
  const st = hhmm(e.start_time), [h, m] = st.split(':').map(Number), en = hhmm(e.end_time);
  return (en && en > st ? en : pad(Math.min(23, h + 1)) + ':' + pad(m)) <= hm;
}
let showPast = false;                                   // the "earlier today" group stays folded unless opened
function dayList(d, empty){                             // the day's cards, with finished ones folded into one line on top
  const evs = dayEvents(d), done = d === todayStr() ? evs.filter(e => isOver(e)) : [], rest = evs.filter(e => !done.includes(e));
  let h = '';
  if(done.length){
    h += `<button class="pastfold ${showPast ? 'on' : ''}" data-pastfold aria-expanded="${showPast}"><span>✓ ${done.length} earlier today</span><i>${showPast ? 'Hide' : 'Show'}</i></button>`;
    if(showPast) h += `<div class="pastlist">${done.map(pastRow).join('')}</div>`;
  }
  h += rest.length ? rest.map(e => card(e)).join('')
    : done.length ? `<div class="empty" style="padding:22px 10px"><span class="big">🌙</span>That’s everything for today.</div>` : empty;
  return h;
}
function pastRow(ev){
  const v = view(ev), o = member(v.owner_id) || {color:'#999'}, hid = hidden(v);
  return `<div class="prow" ${hid ? '' : `${openAttr(v)}`} style="--c:${esc(evColor(v))}"><span class="pt">${esc(fmtTime(v.start_time))}</span>

}
let pastSig = '';                                       // re-draw today's view only when something has just finished
setInterval(() => {
  if(document.visibilityState !== 'visible' || S.tab !== 'cal' || S.sel !== todayStr() || (typeof C !== 'undefined' && C)) return;
  if(isDesk() && deskView() !== 'day') return;
  const sig = dayEvents(todayStr()).filter(e => isOver(e)).map(e => e.id).join();
  if(sig !== pastSig){ pastSig = sig; renderMain(); }
}, 30000);
document.addEventListener('click', e => { if(e.target.closest && e.target.closest('[data-pastfold]')){ showPast = !showPast; renderMain(); } });

function downloadIcs(id){
  const v = view(S.events.find(e => e.id===id)); const d = v.starts_on.replace(/-/g,'');
  const dt = v.start_time
    ? `DTSTART:${d}T${v.start_time.replace(':','')}00\r\nDTEND:${d}T${(v.end_time || plusHour(v.start_time)).replace(':','')}00`
    : `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addDays(v.starts_on,1).replace(/-/g,'')}`;
  const clean = s => String(s||'').replace(/[,;\\]/g, m => '\\'+m).replace(/\n/g,'\\n');
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilyCal//EN\r\nBEGIN:VEVENT\r\nUID:${id}@familycal\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\n${dt}\r\nSUMMARY:${clean((v.sticker?v.sticker+' ':'')+v.title)}\r\n${v.place?`LOCATION:${clean(v.place)}\r\n`:''}${v.notes?`DESCRIPTION:${clean(v.notes)}\r\n`:''}END:VEVENT\r\nEND:VCALENDAR`.replace('\r\nSUMMARY:', '\r\n' + icsRule(v) + 'SUMMARY:').replace('\r\n\r\nSUMMARY', '\r\nSUMMARY');
  location.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
}

function draft(){
  const text = $('#cText').value;
  const pc = parseQuick(text, {kind:C.kind, noDateTime:true}).cal;              // a typed +Calendar wins over the menu
  const calId = (C.scope === 'one' ? C.bCal : pc || C.mCal || C.bCal) || defaultCal();
  C.curCal = calId;
  let p;
  if(C.editing){
    // Editing: words already in the title (e.g. "Sunday school") must not move the event,
    // but a day or time the person types now should be picked up.
    const a = parseQuick(text, {kind:C.kind, cal:calId}), o = C.origDT || {};
    const useDate = !!a.date && a.date !== o.date;
    const useTime = !!a.start && (a.start !== o.start || a.end !== o.end);
    p = parseQuick(text, {kind:C.kind, cal:calId, noDate:!useDate, noTime:!useTime});
    if(useDate && C.mDate !== undefined) C.mDate = undefined;                       // newest input wins
    if(useTime && C.mStart !== undefined){ C.mStart = undefined; C.mEnd = undefined; }
  } else p = parseQuick(text, {kind:C.kind, cal:calId});
  let kind = C.kind;
  if(!C.kindManual) kind = p.listLike ? 'list' : p.people.length ? 'invite' : 'info';
  const extra = $('#cItems').value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
  let date = C.mDate !== undefined ? C.mDate : (p.date || ((kind==='list' && !C.editing && C.bDate===S.sel && !p.date) ? null : C.bDate));
  let start, end;
  if(C.mStart !== undefined){ start = C.mStart; end = C.mEnd ?? null; }
  else if(p.start){ start = p.start; end = C.mEnd !== undefined ? C.mEnd : p.end; }
  else { start = C.bStart; end = C.mEnd !== undefined ? C.mEnd : C.bEnd; }
  let rep = null;                                         // repeating: picked from the menu, typed, or what it already was
  if(kind !== 'list' && !C.noRepeat){
    rep = C.mRep !== undefined ? C.mRep : p.repeat ? { ...p.repeat } : C.bRep;
    if(rep && C.mUntil !== undefined) rep = { ...rep, until:C.mUntil };
    if(rep){ if(!date) date = C.bDate || todayStr(); if(C.mDate === undefined || !rep.days) date = firstOcc(rep, date);
      if(rep.until && rep.until < date) rep = { ...rep, until:date }; }
  }
  if(!date){ start = null; end = null; }
  if(end && start && end <= start) end = null;
  const title = p.title || (kind==='list' && (p.items.length || extra.length) ? 'List' : '');
  const sticker = C.stickerManual ? C.sticker : autoSticker(title + ' ' + (p.place||''));
  const countdown = !!date && !rep && (C.cdManual ? C.countdown : COUNTDOWN_RE.test(title));
  const isPrivate = kind === 'list' && !!C.listPrivate;
  return { _p:p, cal:calId, rep, isPrivate, countdown, kind, title, date, start, end, people: p.people, place:p.place, items:[...p.items, ...extra], sticker, notes:$('#cNotes').value.trim() || null };
}

function looseMatch(text, start, needle){
  // compare ignoring case and extra spaces; returns end index or -1
  let i = start, j = 0; const T = text.toLowerCase(), N = needle.toLowerCase();
  while(j < N.length){
    if(/\s/.test(N[j])){ if(!/\s/.test(T[i] || '')) return -1; while(/\s/.test(T[i] || '')) i++; while(/\s/.test(N[j] || '')) j++; continue; }
    if(T[i] !== N[j]) return -1; i++; j++;
  }
  return i;
}
function findSpan(text, needle, last, taken){
  if(!needle) return null;
  const hits = [];
  for(let i = 0; i < text.length; i++){
    const e = looseMatch(text, i, needle);
    if(e > i && !taken.some(([a,b]) => i < b && e > a)) hits.push([i, e]);
  }
  return hits.length ? (last ? hits[hits.length-1] : hits[0]) : null;
}
function hlRanges(text, p){
  const out = [], taken = [];
  const add = (r, cls, color) => { if(r){ out.push({a:r[0], b:r[1], cls, color}); taken.push(r); } };
  (p.tags || []).forEach(t => add(findSpan(text, t.tok, false, taken), 'who', t.color));
  add(findSpan(text, p.placeText, false, taken), 'where');
  add(findSpan(text, p.timeText, false, taken), 'when');
  add(findSpan(text, p.dateText, true, taken), 'when');
  add(findSpan(text, p.repeatText, false, taken), 'when');
  add(findSpan(text, p.untilText, false, taken), 'when');
  add(findSpan(text, p.startText, false, taken), 'when');
  if(p.listLike){ const [head, tail] = splitList(text); add([head.length + 1 + (tail.length - tail.trimStart().length), text.replace(/\s+$/,'').length], 'items'); }
  return out.filter(r => r.b > r.a).sort((x, y) => x.a - y.a);
}
function renderHighlights(d){
  const text = $('#cText').value, ranges = hlRanges(text, d._p || {});
  C.hlSeen = C.hlSeen || new Set();
  let h = '', at = 0;
  ranges.forEach(r => {
    const word = text.slice(r.a, r.b), key = r.cls + ':' + word.toLowerCase();
    const fresh = !C.hlSeen.has(key); C.hlSeen.add(key);
    h += esc(text.slice(at, r.a)) + `<mark class="hl-${r.cls}${fresh ? ' pop' : ''}"${r.color ? ` style="--c:${esc(r.color)}"` : ''}>${esc(word)}</mark>`;
    at = r.b;
  });
  $('#cHl').innerHTML = h + esc(text.slice(at)) + '​';
}

function insertAtCaret(str){
  // helper buttons always add to the end of the sentence (before a list's "items" part)
  const el = $('#cText'), [head, tail] = splitList(el.value);
  const base = head.replace(/\s+$/, ''), sep = base ? ' ' : '';
  el.value = base + sep + str + (tail !== null ? ':' + tail : '');
  const np = (base + sep + str).length; el.focus(); el.setSelectionRange(np, np);
  updateComposer(); autoGrow(); renderSugg();
}
function helper(kind){
  C.whenOpen = kind === 'when' ? !C.whenOpen : false;
  if(kind === 'cal'){                                            // swap any calendar already typed for a fresh "+"
    const t = $('#cText'); t.value = t.value.replace(/(^|\s)\+[A-Za-z][\w'’-]*/g, (m, sp, i) => findCal(m.trim().slice(1).toLowerCase()) ? sp : m).replace(/\s{2,}/g, ' ');
    insertAtCaret('+');
  }

  document.querySelectorAll('#cHelpers .hb').forEach(b => b.classList.toggle('on', b.dataset.help === 'when' && C.whenOpen));

function applyWhen(phrase, type){
  const el = $('#cText'), p = draft()._p || {}, text = el.value;
  const span = findSpan(text, type === 'date' ? p.dateText : p.timeText, type === 'date', []);
  let out, caret;
  if(span) out = text.slice(0, span[0]) + phrase + text.slice(span[1]);
  else {
    const [head, tail] = splitList(text);
    const base = head.replace(/\s+$/, ''); const sep = base ? ' ' : '';
    out = base + sep + phrase + (tail !== null ? ':' + tail : '');
  }
  caret = splitList(out)[0].replace(/\s+$/, '').length;   // keep typing at the end
  if(type === 'date') C.mDate = undefined; else { C.mStart = undefined; C.mEnd = undefined; }   // what you type wins
  el.value = out; el.focus(); el.setSelectionRange(caret, caret);
  updateComposer(); autoGrow(); renderSugg();
}
function whenChips(){
  const t = todayStr(), days = [['today','Today'], ['tonight','Tonight'], ['tomorrow','Tomorrow']];
  for(let i = 2; i < 7; i++){ const dt = parseYmd(addDays(t, i)); const w = dt.toLocaleDateString('en-US', {weekday:'short'}); days.push([w, w]); }
  const times = ['9am','noon','3pm','5:30pm','6pm','7pm'];

    + days.map(([v, l]) => `<button class="whenchip" data-when="${v}" data-wt="date">📅 ${l}</button>`).join('')

}

async function saveComposer(){

  const btn = $('#cSave'); btn.disabled = true;

    start_time:d.start, end_time:d.end, sticker:d.sticker || null, invitees:d.people };
  if(d.rep){ Object.assign(ev, { repeat:d.rep.repeat, repeat_days:(d.rep.repeat === 'weekly' || d.rep.repeat === 'biweekly') ? (d.rep.days && d.rep.days.length ? d.rep.days : [dowOf(d.date)]) : null, repeat_until:d.rep.until || null, countdown:false }); }

  const series = C.scope && S.events.find(x => x.id === C.id);
  if(C.scope === 'one'){ delete ev.id; Object.assign(ev, { series_id:C.id, series_date:C.occ }); }        // a one-off that takes that date's place
  if(C.scope === 'future'){ delete ev.id; }                                                            // a new series from here on
  try{

    if(C.scope === 'future' && series) await B.patchEvent(series.id, { repeat_until:addDays(C.occ, -1) });
    if(d.kind === 'list' && d.items.length) await B.addItems(saved.id, d.items);
    const wasEdit = C.editing; closeComposer();
    if(d.kind !== 'private' || d.people.length) B.notify(!wasEdit ? {type:'event', action:'created', event_id:saved.id, count:d.items.length}
      : (d.kind === 'list' && d.items.length) ? {type:'items', event_id:saved.id, texts:d.items} : {type:'event', action:'updated', event_id:saved.id});
    if(d.date){ S.sel = d.date; S.tab = 'cal'; setTab('cal'); }
    else if(d.kind === 'list'){ setTab('lists'); }
    await refresh();
    toast(`${d.sticker || '✨'} ${wasEdit ? 'Saved' : 'Added'}${d.date ? ' for ' + dateLabel(d.date) : ''}`);
    const el = document.querySelector(`[data-open="${saved.id}"] .sticker`); if(el){ el.classList.add('slap'); }
    if(d.rep) setTimeout(() => toast(`🔁 ${repeatLabel({ repeat:ev.repeat, repeat_days:ev.repeat_days, repeat_until:ev.repeat_until, starts_on:d.date })}`), 1600);
    if(wasEdit) closeSheet();
  }catch(e){ btn.disabled = false; toast('⚠️ ' + e.message); }
}

function eventsOnOrAfter(e, d){ for(let i = 0; i < 400; i++){ const x = addDays(d > e.starts_on ? d : e.starts_on, i); if(e.repeat_until && x > e.repeat_until) break; if(occursOn(e, x)) return x; } return e.starts_on; }
function openScope(action, id, occ){
  const e = S.events.find(x => x.id === id); if(!e) return;
  const first = occ === e.starts_on, del = action === 'delete';
  S.scope = { action, id, occ };
  openSheet(`<h3 class="sheeth">${del ? '🗑️ Delete' : '✏️ Change'} a repeating event</h3>
    <p class="hint" style="margin:4px 2px 12px">${esc(view(e).title || 'Event')} · 🔁 ${esc(repeatLabel(e))}</p>
    <button class="btn scopeb" data-scope="one">${del ? 'Skip' : 'Change'} just this one<small>${esc(dateLabel(occ))}</small></button>
    ${first ? '' : `<button class="btn scopeb" data-scope="future">This one and all after it<small>from ${esc(dateLabel(occ))} on</small></button>`}
    <button class="btn scopeb ${del ? 'danger' : ''}" data-scope="all">All of them<small>${del ? 'removes the whole series' : 'every date in the series'}</small></button>
    <div class="btns"><button class="btn" data-scopeback>Cancel</button></div>`);
  $('#sheet').dataset.panel = 'scope';
}
async function scopeDo(which){
  const { action, id, occ } = S.scope || {}, e = S.events.find(x => x.id === id); if(!e) return;
  if(action === 'edit'){ closeSheet(); openComposer({ id, occ, scope: which === 'future' && occ === e.starts_on ? 'all' : which }); return; }
  penGate(async () => {
    closeSheet();
    if(which === 'one') await act(() => B.patchEvent(id, { repeat_skip:[...new Set([...(e.repeat_skip || []), occ])] }));
    else if(which === 'future' && occ > e.starts_on) await act(() => B.patchEvent(id, { repeat_until:addDays(occ, -1) }));
    else{ if(!confirm(`Delete every “${view(e).title}”?`)) return; await act(() => B.deleteEvent(id)); }
    toast(which === 'one' ? `🗑️ Skipped ${dateLabel(occ)}` : which === 'future' ? `🗑️ Ends before ${dateLabel(occ)}` : '🗑️ Deleted the series');
  }, e.owner_id);
}

  scopeDo(t.dataset.scope);

const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4)), c => c.charCodeAt(0));

async function pushInit(){
  P.ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  P.standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  try{ P.reg = await navigator.serviceWorker.register('sw.js'); }catch(e){ return; }
  P.supported = 'PushManager' in window && 'Notification' in window;
  if(!P.supported) return;
  P.perm = Notification.permission;
  try{ P.sub = await P.reg.pushManager.getSubscription(); }catch(e){}
  if(P.sub && B.getPush){
    try{ const row = await B.getPush(P.sub.endpoint); if(row) P.prefs = {...PUSH_DEFAULTS, ...row.prefs}; }catch(e){}
    B.savePush(P.sub, P.prefs).catch(()=>{});   // keeps this phone linked to whoever is signed in
  }
  render();
}

function pushEnable(btn){
  if(P.busy) return;
  const asked = Notification.requestPermission();      // must happen right inside the tap (iOS rule)
  P.busy = true; if(btn) btn.disabled = true;
  asked.then(async perm => {
    P.perm = perm;
    if(perm !== 'granted'){ toast('🔕 Notifications not allowed'); return; }
    const reg = P.reg || await navigator.serviceWorker.ready;
    P.sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uBytes(VAPID_PUBLIC_KEY)});
    await B.savePush(P.sub, P.prefs);
    toast('🔔 Notifications on');
    B.testPush().catch(e => toast('⚠️ ' + e.message));
  }).catch(e => toast('⚠️ ' + e.message))
    .finally(() => { P.busy = false; render(); reopenSettings(); });
}
async function pushDisable(){
  const s = P.sub; P.sub = null;
  try{ await B.deletePush(s.endpoint); }catch(e){}
  try{ await s.unsubscribe(); }catch(e){}
  toast('🔕 Notifications off'); reopenSettings(); render();
}

}

/* ========================= Admin (proof of identity), per calendar =========================
   Protected changes need a PIN from an admin of that calendar. The database checks it on EVERY change (not just here),
   so the lock can't be skipped. Unlocking doesn't change who this device is signed in as, so it works on the shared
   display too. It locks again after 3 minutes without an admin change, or when the screensaver starts. */
const ADMIN = { cal:null, id:null, pin:'', until:0, pick:null };
const ADMIN_MS = 3 * 60000;
const adminOpen = calId => !!ADMIN.id && (!calId || ADMIN.cal === calId) && Date.now() < ADMIN.until && !!cmRow(ADMIN.cal, ADMIN.id)?.is_admin;
const adminCred = () => ({ cal:ADMIN.cal, id:ADMIN.id, pin:ADMIN.pin });
function adminLock(quiet){ const was = !!ADMIN.id; Object.assign(ADMIN, { id:null, pin:'', until:0 }); if(was && !quiet) toast('🔒 Admin locked'); }
function openAdminGate(err, calId){
  calId = calId || ADMIN.cal || S.calOpen;
  if(adminOpen(calId)) return openAdmin();
  if(ADMIN.cal !== calId){ adminLock(true); ADMIN.cal = calId; }
  const ad = admins(calId);
  if(!ad.length) return toast('⚠️ Run the latest schema.sql in Supabase to use admin settings');
  if(!ad.some(m => m.id === ADMIN.pick)) ADMIN.pick = (ad.find(m => m.id === S.me.id) || ad[0]).id;
  const a = member(ADMIN.pick);
  openSheet(`<h3 class="sheeth">🔒 ${esc(calEmoji(calId))} ${esc(calName(calId))} admin</h3>
    <p style="color:var(--muted);margin:6px 0 8px">Managing people needs an admin’s PIN.</p>
    ${ad.length > 1 ? `<div class="who">${ad.map(m => `<button class="${m.id === ADMIN.pick ? 'on' : ''}" data-adminpick="${m.id}">${avatar(m, 'lg')}${esc(firstName(m.name))}</button>`).join('')}</div>`
      : `<div style="text-align:center">${avatar(a, 'lg')}<div style="font-weight:800;margin-top:4px">${esc(a.name)}</div></div>`}
    <input class="field" id="adminPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="${B.mode === 'demo' ? 'Any 4 digits in the demo' : esc(firstName(a.name)) + '’s PIN'}" style="text-align:center;letter-spacing:.4em;font-size:24px;margin-top:12px">
    <div class="err">${esc(err || '')}</div>
    <div class="btns"><button class="btn" data-calsheet="${calId}">Back</button><button class="btn primary" data-adminunlock>Unlock</button></div>`);
  $('#sheet').dataset.panel = 'admingate';
  setTimeout(() => { const i = $('#adminPin'); i && i.focus(); }, 80);
}
async function adminUnlock(btn){
  const pin = ($('#adminPin').value || '').trim(); if(!pin) return openAdminGate('Enter the PIN');
  btn.disabled = true;
  try{ await B.adminVerify({ cal:ADMIN.cal, id:ADMIN.pick, pin }); }catch(e){ return openAdminGate(e.message); }
  Object.assign(ADMIN, { id:ADMIN.pick, pin, until:Date.now() + ADMIN_MS }); S.links = null; openAdmin();
}
async function adminDo(fn, okMsg, after){       // run one protected change with the unlocked admin's PIN
  if(!adminOpen()){ adminLock(true); return openAdminGate('Locked after a few minutes. Enter the PIN again.'); }
  try{ const r = await fn(adminCred()); ADMIN.until = Date.now() + ADMIN_MS; await refresh(); if(okMsg) toast(okMsg); (after || openAdmin)(r); return r; }
  catch(e){ if(e.pin){ adminLock(true); return openAdminGate(e.message); } toast('⚠️ ' + e.message); }
}

  const keep = $('#sheet').classList.contains('on') && $('#sheet').dataset.panel === 'admin' ? $('#sheet').scrollTop : 0;

async function obAction(t){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const step = $('#onboard').dataset.step;
  if(t.dataset.obemoji){ OB.emoji = t.dataset.obemoji; return ob(step); }
  if(t.dataset.obtone){ OB.emoji = withTone(OB.emoji, setPickTone(t.dataset.obtone)); return ob(step); }
  if(t.dataset.obcolor){ OB.color = t.dataset.obcolor; return ob(step); }
  if(t.dataset.obpick){ OB.pick = t.dataset.obpick; return ob('pin'); }
  const a = t.dataset.ob; if(!a) return;
  t.disabled = true;
  try{
    if(a === 'doCreate'){ await B.createFamily({family:v('obFam'), name:v('obName'), emoji:OB.emoji, color:OB.color, pin:v('obPin')}); return finishOnboard(true); }
    if(a === 'doCode'){ OB.code = v('obCode').toUpperCase(); const f = await B.preview(OB.code); if(!f) return ob('code', 'Code not found'); OB.fam = f; return ob(f.members.length ? 'pick' : 'new'); }
    if(a === 'doClaim'){ await B.claim(OB.code, OB.pick, v('obPin')); return finishOnboard(); }
    if(a === 'doJoin'){ await B.join({code:OB.code, name:v('obName'), emoji:OB.emoji, color:OB.color, pin:v('obPin')}); return finishOnboard(); }
    if(a === 'doView'){ if(!v('obName')) return ob('view', 'Add your name'); await B.redeemLink(OB.token, { name:v('obName'), emoji:'👀' }); return finishOnboard(); }
    ob(a);
  }catch(e){ ob(step, e.message); }
  finally{ t.disabled = false; }
}
async function finishOnboard(isNew){
  $('#onboard').classList.add('hidden');
  history.replaceState(null, '', location.pathname);
  await refresh(); B.subscribe(liveRefresh);
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if(tz) S.cals.filter(c => !c.tz && c.role === 'contributor').forEach(c => B.updateCalendar(c.id, {tz}).catch(()=>{}));
  pushInit();
  if(isNew) setTimeout(openMe, 400);
  toast(`👋 Welcome, ${firstName(S.me.name)}!`);
  ssInit(false); wxInit();
}
